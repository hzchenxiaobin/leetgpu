<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Rainbow Table：外层并行 / 内层串行</text>

  <!-- ===== Top: input array ===== -->
  <text x="30" y="58" font-size="12" fill="#446688" font-weight="bold">input (int32)</text>
  <g font-size="11" fill="#333">
    <rect x="30" y="66" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="58" y="84" text-anchor="middle">123</text>
    <rect x="88" y="66" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="116" y="84" text-anchor="middle">456</text>
    <rect x="146" y="66" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="174" y="84" text-anchor="middle">789</text>
    <rect x="204" y="66" width="40" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="224" y="84" text-anchor="middle" fill="#888">…</text>
    <rect x="246" y="66" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="274" y="84" text-anchor="middle">xₙ</text>
  </g>

  <!-- threads fan-out -->
  <text x="360" y="58" font-size="12" fill="#d6a040" font-weight="bold">每元素一线程（grid-stride）</text>
  <g stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <path d="M 58 92 L 380 116" marker-end="url(#arr)"/>
    <path d="M 116 92 L 410 116" marker-end="url(#arr)"/>
    <path d="M 174 92 L 440 116" marker-end="url(#arr)"/>
    <path d="M 274 92 L 510 116" marker-end="url(#arr)"/>
  </g>

  <!-- thread boxes -->
  <g font-size="11" fill="#444">
    <rect x="362" y="118" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="390" y="135" text-anchor="middle">thread 0</text>
    <rect x="392" y="118" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="420" y="135" text-anchor="middle">thread 1</text>
    <rect x="422" y="118" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="450" y="135" text-anchor="middle">thread 2</text>
    <rect x="492" y="118" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="520" y="135" text-anchor="middle">thread n</text>
  </g>

  <!-- ===== Middle: serial dependency chain inside one thread ===== -->
  <rect x="24" y="160" width="572" height="120" fill="#fff" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="34" y="180" font-size="12" fill="#b85450" font-weight="bold">一个线程内部：R 轮哈希串行依赖（不可并行）</text>

  <g font-size="11" fill="#333">
    <rect x="40" y="200" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="65" y="218" text-anchor="middle">x</text>

    <rect x="120" y="200" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="152" y="218" text-anchor="middle">round 1</text>

    <rect x="220" y="200" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="252" y="218" text-anchor="middle">round 2</text>

    <rect x="320" y="200" width="40" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="340" y="218" text-anchor="middle" fill="#888">…</text>

    <rect x="388" y="200" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="420" y="218" text-anchor="middle">round R</text>

    <rect x="486" y="200" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="511" y="218" text-anchor="middle">out</text>
  </g>

  <!-- serial arrows -->
  <g stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 90 213 L 118 213" marker-end="url(#arr)"/>
    <path d="M 184 213 L 218 213" marker-end="url(#arr)"/>
    <path d="M 284 213 L 318 213" marker-end="url(#arr)"/>
    <path d="M 360 213 L 386 213" marker-end="url(#arr)"/>
    <path d="M 452 213 L 484 213" marker-end="url(#arr)"/>
  </g>
  <text x="152" y="246" text-anchor="middle" font-size="10" fill="#888">h₁ = fnv1a(x)</text>
  <text x="252" y="246" text-anchor="middle" font-size="10" fill="#888">h₂ = fnv1a(h₁)</text>
  <text x="420" y="246" text-anchor="middle" font-size="10" fill="#888">out = fnv1a(h_{R-1})</text>
  <text x="310" y="270" text-anchor="middle" font-size="11" fill="#b85450">⚠ 第 r 轮依赖第 r−1 轮输出 → 只能串行循环 R 次</text>

  <!-- ===== Bottom callouts ===== -->
  <rect x="24" y="296" width="276" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="316" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 外层：元素间独立</text>
  <text x="34" y="336" font-size="11" fill="#555">N 个输入互不依赖</text>
  <text x="34" y="354" font-size="11" fill="#555">→ grid-stride loop 并行覆盖</text>
  <text x="34" y="372" font-size="11" fill="#555">→ 线程数 = SM × 4 即可打满</text>

  <rect x="320" y="296" width="276" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="316" font-size="12" fill="#d6a040" font-weight="bold">⚠ 内层：R 轮串行依赖</text>
  <text x="330" y="336" font-size="11" fill="#555">每轮 fnv1a 依赖上一轮哈希状态</text>
  <text x="330" y="354" font-size="11" fill="#555">→ R 增大 → 计算量线性增加</text>
  <text x="330" y="372" font-size="11" fill="#555">→ kernel 从 memory-bound 转向 compute-bound</text>
</svg>
