<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Worked Example：4 点、k=2，第 1 轮 assign → accum → finalize</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 0: points & initial centroids (scatter) ===== -->
  <text x="40" y="74" font-size="12" font-weight="bold" fill="#2b6e9e">初始：点 p0..p3 与中心 c0,c1</text>
  <g filter="url(#sk)">
    <rect x="40" y="82" width="300" height="190" rx="6" fill="#fbfcfe" stroke="#4a8edb" stroke-width="1.1"/>
    <!-- axes -->
    <line x1="60" y1="256" x2="320" y2="256" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>
    <line x1="60" y1="96" x2="60" y2="256" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>
    <text x="60" y="270" font-size="9" fill="#888">0</text>
    <text x="300" y="270" font-size="9" fill="#888">10</text>
    <!-- points -->
    <circle cx="90" cy="250" r="5" fill="#4a8edb" filter="url(#sk)"/>
    <circle cx="110" cy="240" r="5" fill="#4a8edb" filter="url(#sk)"/>
    <circle cx="250" cy="110" r="5" fill="#4a8edb" filter="url(#sk)"/>
    <circle cx="270" cy="96" r="5" fill="#4a8edb" filter="url(#sk)"/>
    <text x="98" y="250" font-size="10" fill="#2b6e9e">p0(1,1)</text>
    <text x="118" y="238" font-size="10" fill="#2b6e9e">p1(2,2)</text>
    <text x="258" y="108" font-size="10" fill="#2b6e9e">p2(8,8)</text>
    <text x="278" y="94" font-size="10" fill="#2b6e9e">p3(9,9)</text>
    <!-- centroids -->
    <path d="M 86 246 L 94 254 M 86 254 L 94 246" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
    <path d="M 246 106 L 254 114 M 246 114 L 254 106" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
    <text x="100" y="266" font-size="10" fill="#b85450">c0(1,1)</text>
    <text x="258" y="126" font-size="10" fill="#b85450">c1(8,8)</text>
  </g>

  <!-- ===== Step 1: assign ===== -->
  <text x="360" y="74" font-size="12" font-weight="bold" fill="#2e6e2e">① assign：算 d² 取 argmin</text>
  <g filter="url(#sk)">
    <rect x="360" y="82" width="540" height="190" rx="6" fill="#f5fbf5" stroke="#4a8e4a" stroke-width="1.1"/>
  </g>
  <text x="372" y="104" font-size="10" font-weight="bold" fill="#444">点</text>
  <text x="420" y="104" font-size="10" font-weight="bold" fill="#7a5415">d²(c0)</text>
  <text x="500" y="104" font-size="10" font-weight="bold" fill="#7a5415">d²(c1)</text>
  <text x="580" y="104" font-size="10" font-weight="bold" fill="#b85450">argmin</text>
  <text x="660" y="104" font-size="10" fill="#888">距离：d²=(px-cx)²+(py-cy)²，c0=(1,1) c1=(8,8)</text>
  <line x1="372" y1="110" x2="888" y2="110" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <text x="372" y="130" font-size="10" fill="#2b6e9e">p0(1,1)</text>
  <text x="430" y="130" font-size="10" fill="#7a5415">0</text>
  <text x="510" y="130" font-size="10" fill="#7a5415">98</text>
  <text x="590" y="130" font-size="11" font-weight="bold" fill="#b85450">0</text>

  <text x="372" y="152" font-size="10" fill="#2b6e9e">p1(2,2)</text>
  <text x="430" y="152" font-size="10" fill="#7a5415">2</text>
  <text x="510" y="152" font-size="10" fill="#7a5415">72</text>
  <text x="590" y="152" font-size="11" font-weight="bold" fill="#b85450">0</text>

  <text x="372" y="174" font-size="10" fill="#2b6e9e">p2(8,8)</text>
  <text x="430" y="174" font-size="10" fill="#7a5415">98</text>
  <text x="510" y="174" font-size="10" fill="#7a5415">0</text>
  <text x="590" y="174" font-size="11" font-weight="bold" fill="#b85450">1</text>

  <text x="372" y="196" font-size="10" fill="#2b6e9e">p3(9,9)</text>
  <text x="430" y="196" font-size="10" fill="#7a5415">128</text>
  <text x="510" y="196" font-size="10" fill="#7a5415">2</text>
  <text x="590" y="196" font-size="11" font-weight="bold" fill="#b85450">1</text>

  <text x="372" y="226" font-size="10" fill="#2e6e2e">→ labels = [0, 0, 1, 1]</text>
  <text x="372" y="244" font-size="9" fill="#888">严格 &lt; 更新：并列时保留小索引（与 torch.argmin 一致）</text>
  <text x="372" y="262" font-size="9" fill="#888">距离计算与 torch 逐位同构 → labels 精确匹配</text>

  <!-- ===== Step 2: accum ===== -->
  <text x="40" y="300" font-size="12" font-weight="bold" fill="#7a5415">② accum：每点 atomicAdd 到所属 bin</text>
  <g filter="url(#sk)">
    <rect x="40" y="308" width="420" height="130" rx="6" fill="#fffdf3" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="56" y="330" font-size="10" fill="#444">p0→bin0: sum_x=1, sum_y=1, count=1</text>
  <text x="56" y="350" font-size="10" fill="#444">p1→bin0: sum_x=1+2=3, sum_y=3, count=2</text>
  <text x="56" y="370" font-size="10" fill="#444">p2→bin1: sum_x=8, sum_y=8, count=1</text>
  <text x="56" y="390" font-size="10" fill="#444">p3→bin1: sum_x=8+9=17, sum_y=17, count=2</text>
  <text x="56" y="416" font-size="10" font-weight="bold" fill="#7a5415">bin0: (3, 3, 2)　bin1: (17, 17, 2)</text>

  <!-- ===== Step 3: finalize ===== -->
  <text x="480" y="300" font-size="12" font-weight="bold" fill="#b85450">③ finalize：count&gt;0 取均值</text>
  <g filter="url(#sk)">
    <rect x="480" y="308" width="420" height="130" rx="6" fill="#fff5f5" stroke="#b85450" stroke-width="1.1"/>
  </g>
  <text x="496" y="332" font-size="11" fill="#444">c0 = (3/2, 3/2) = (1.5, 1.5)</text>
  <text x="496" y="354" font-size="11" fill="#444">c1 = (17/2, 17/2) = (8.5, 8.5)</text>
  <text x="496" y="382" font-size="10" fill="#888">空簇（count==0）→ 不写，保留上一轮中心</text>
  <text x="496" y="400" font-size="10" fill="#888">本例无空簇，两簇各 2 点</text>
  <text x="496" y="424" font-size="10" font-weight="bold" fill="#b85450">→ final_centroid = [(1.5,1.5), (8.5,8.5)]</text>

  <!-- ===== result ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="460" width="860" height="60" rx="8" fill="#f0f7ff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="470" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">第 2 轮：用新中心 (1.5,1.5)/(8.5,8.5) 重新 assign → labels 仍为 [0,0,1,1]，收敛</text>
  <text x="470" y="506" text-anchor="middle" font-size="11" fill="#2e6e2e">最终输出：labels = [0, 0, 1, 1]，final_centroid = [(1.5, 1.5), (8.5, 8.5)] ✓</text>
</svg>
