<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Worked Example：3D 体展平 + 两级归约逐步演算</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#888">N=2, M=2, K=2 → total=8，P=1，BLOCK_SIZE=256（此处用 4 lane 演示）</text>

  <!-- Step 1: 3D input -->
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#2b6e9e">① 输入 3D 体 input[2][2][2]</text>
  <text x="40" y="108" font-size="10" fill="#888">两个切片，每片 2×2</text>

  <!-- slice 0 -->
  <g filter="url(#sk)">
    <rect x="60" y="118" width="120" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="68" y="132" font-size="10" fill="#4a8edb">i=0</text>
  <g filter="url(#sk)">
    <rect x="70" y="140" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="118" y="140" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="70" y="174" width="48" height="0" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
  </g>
  <text x="94" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="142" y="161" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>

  <!-- second row of slice 0 -->
  <g filter="url(#sk)">
    <rect x="70" y="146" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9" opacity="0"/>
  </g>

  <!-- redraw slice 0 as 2x2 properly -->
  <g filter="url(#sk)">
    <rect x="70" y="138" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="118" y="138" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="70" y="172" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="118" y="172" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
  </g>
  <text x="94" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="142" y="160" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>
  <text x="94" y="194" text-anchor="middle" font-size="14" fill="#2b6e9e">4</text>
  <text x="142" y="194" text-anchor="middle" font-size="14" fill="#2b6e9e">5</text>

  <!-- slice 1 -->
  <g filter="url(#sk)">
    <rect x="200" y="118" width="120" height="64" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="208" y="132" font-size="10" fill="#4a8edb">i=1</text>
  <g filter="url(#sk)">
    <rect x="210" y="138" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="258" y="138" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="210" y="172" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="258" y="172" width="48" height="34" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
  </g>
  <text x="234" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="282" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="234" y="194" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>
  <text x="282" y="194" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>

  <!-- flatten arrow -->
  <path d="M 180 222 L 180 250" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="192" y="246" font-size="10" fill="#7a5415">idx=(i·M+j)·K+k</text>

  <!-- Step 2: flattened 1D -->
  <text x="40" y="270" font-size="13" font-weight="bold" fill="#2b6e9e">② 展平为 1D（total = 8）</text>
  <g filter="url(#sk)">
    <rect x="60" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="104" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="148" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="192" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="236" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="280" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="324" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="368" y="282" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="82" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="126" y="303" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="170" y="303" text-anchor="middle" font-size="13" fill="#2b6e9e">4</text>
  <text x="214" y="303" text-anchor="middle" font-size="13" fill="#2b6e9e">5</text>
  <text x="258" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="302" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="346" y="303" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="390" y="303" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="60" y="328" font-size="9" fill="#aaa">idx0</text>
  <text x="104" y="328" font-size="9" fill="#aaa">1</text>
  <text x="148" y="328" font-size="9" fill="#aaa">2</text>
  <text x="192" y="328" font-size="9" fill="#aaa">3</text>
  <text x="236" y="328" font-size="9" fill="#aaa">4</text>
  <text x="280" y="328" font-size="9" fill="#aaa">5</text>
  <text x="324" y="328" font-size="9" fill="#aaa">6</text>
  <text x="368" y="328" font-size="9" fill="#aaa">7</text>

  <!-- predicate arrow -->
  <path d="M 240 336 L 240 358" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="252" y="354" font-size="10" fill="#7a5415">input[i]==P ? 1:0</text>

  <!-- Step 3: predicate + block reduce -->
  <text x="40" y="378" font-size="13" font-weight="bold" fill="#7a5415">③ predicate 融合 + block 归约（2 个 block，各 4 元素）</text>

  <!-- block 0 -->
  <text x="60" y="398" font-size="11" font-weight="bold" fill="#2e6e2e">block 0（idx 0-3）</text>
  <g filter="url(#sk)">
    <rect x="60" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="104" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="148" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="192" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="82" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="126" y="425" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="170" y="425" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="214" y="425" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <!-- warp reduce tree -->
  <path d="M 82 436 Q 110 452 126 458" stroke="#4a8e4a" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 170 436 Q 150 452 134 458" stroke="#4a8e4a" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="130" cy="464" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="130" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="158" y="468" font-size="10" fill="#2e6e2e">block_sum₀ = 1</text>

  <!-- block 1 -->
  <text x="440" y="398" font-size="11" font-weight="bold" fill="#2e6e2e">block 1（idx 4-7）</text>
  <g filter="url(#sk)">
    <rect x="440" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="484" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="528" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="572" y="406" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="462" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="506" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="550" y="425" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="594" y="425" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <path d="M 462 436 Q 490 452 506 458" stroke="#4a8e4a" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <path d="M 550 436 Q 530 452 514 458" stroke="#4a8e4a" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="510" cy="464" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="510" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="538" y="468" font-size="10" fill="#2e6e2e">block_sum₁ = 2</text>

  <!-- partial buffer -->
  <text x="40" y="500" font-size="11" fill="#888">partial[] =</text>
  <g filter="url(#sk)">
    <rect x="120" y="488" width="50" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="170" y="488" width="50" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="145" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="195" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>

  <!-- final reduce arrow -->
  <path d="M 145 516 Q 200 528 250 530" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 195 516 Q 220 526 252 530" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="225" y="524" font-size="10" fill="#2e6e2e">final_reduce</text>

  <!-- Step 4: final output -->
  <text x="380" y="500" font-size="13" font-weight="bold" fill="#2e6e2e">④ final_reduce：1+2 = 3</text>
  <g filter="url(#sk)">
    <rect x="540" y="486" width="130" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="605" y="506" text-anchor="middle" font-size="11" fill="#2e6e2e">output[0]</text>
  <text x="605" y="524" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">= 3 ✓</text>

  <!-- right insight -->
  <g filter="url(#sk)">
    <rect x="700" y="392" width="200" height="138" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="718" y="414" font-size="11" font-weight="bold" fill="#444">💡 演算要点</text>
  <text x="718" y="434" font-size="10" fill="#444">3D 展平后，归约与维度数无关</text>
  <text x="718" y="450" font-size="10" fill="#444">warp shuffle 在寄存器内完成</text>
  <text x="718" y="466" font-size="10" fill="#444">每 block 只写 1 次 partial</text>
  <text x="718" y="482" font-size="10" fill="#444">final_reduce 单 block 收尾</text>
  <text x="718" y="504" font-size="10" font-weight="bold" fill="#b85450">全程 0 次 global atomic</text>
  <text x="718" y="520" font-size="10" fill="#b85450">仅 final 单线程写 output[0]</text>
</svg>
