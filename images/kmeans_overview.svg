<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">K-Means：assign ↔ update 迭代循环（轮间串行、轮内并行）</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- inputs -->
  <text x="40" y="80" font-size="12" font-weight="bold" fill="#2b6e9e">输入：N 个 2D 点 + k 个初始中心</text>
  <g filter="url(#sk)">
    <rect x="40" y="90" width="120" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="40" y="140" width="120" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#2b6e9e">data_x[N], data_y[N]</text>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#2b6e9e">centroid_x/y[k]</text>

  <!-- iteration loop box -->
  <g filter="url(#sk)">
    <rect x="200" y="86" width="470" height="270" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="435" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">for it in range(max_iterations):</text>

  <!-- assign box -->
  <g filter="url(#sk)">
    <rect x="220" y="120" width="200" height="100" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="320" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">① assign_kernel</text>
  <text x="230" y="160" font-size="10" fill="#444">每点 1 thread → 对 k 中心</text>
  <text x="230" y="176" font-size="10" fill="#444">算平方距离，argmin（严格 &lt;）</text>
  <text x="230" y="192" font-size="10" fill="#2e6e2e">中心载入 shared，N 点并行</text>
  <text x="230" y="208" font-size="10" fill="#888">输出 labels[N]（int32）</text>

  <!-- update box -->
  <g filter="url(#sk)">
    <rect x="450" y="120" width="200" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="550" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">② accum + finalize</text>
  <text x="460" y="160" font-size="10" fill="#444">每点 1 thread → atomicAdd</text>
  <text x="460" y="176" font-size="10" fill="#444">到 sum[k]/count[k] 共 k 个 bin</text>
  <text x="460" y="192" font-size="10" fill="#b85450">finalize: count&gt;0 取均值</text>
  <text x="460" y="208" font-size="10" fill="#888">空簇保留旧中心值</text>

  <!-- arrow assign -> update -->
  <path d="M 420 170 L 450 170" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="435" y="164" text-anchor="middle" font-size="9" fill="#5a5a5a">labels</text>

  <!-- loop back arrow -->
  <path d="M 550 220 Q 550 250 320 250 Q 320 250 320 220" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar2)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="435" y="246" text-anchor="middle" font-size="10" fill="#b85450">更新后的 centroid 喂回下一轮 assign（轮间数据依赖）</text>

  <!-- launch count note -->
  <text x="435" y="286" text-anchor="middle" font-size="10" fill="#7a5415">每轮 = 1 assign + 1 memset + 1 accum + 1 finalize</text>
  <text x="435" y="302" text-anchor="middle" font-size="10" fill="#7a5415">30 轮 ≈ 120 次 kernel launch（同 stream 顺序执行保证依赖）</text>
  <text x="435" y="326" text-anchor="middle" font-size="10" fill="#888">⚠ 迭代之间有依赖 → 无法跨轮并行，只能轮内并行</text>
  <text x="435" y="342" text-anchor="middle" font-size="10" fill="#888">launch 开销 ~5µs/次 × 120 ≈ 0.6ms，小数据占比可观</text>

  <!-- outputs -->
  <text x="710" y="80" font-size="12" font-weight="bold" fill="#2e6e2e">输出</text>
  <g filter="url(#sk)">
    <rect x="710" y="120" width="160" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="710" y="170" width="160" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="790" y="144" text-anchor="middle" font-size="11" fill="#2e6e2e">labels[N]（最后一轮分配）</text>
  <text x="790" y="194" text-anchor="middle" font-size="11" fill="#2e6e2e">final_centroid_x/y[k]</text>

  <!-- arrows to output -->
  <path d="M 650 160 L 710 140" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 650 195 L 710 190" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- bottom: key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="378" width="840" height="58" rx="8" fill="#f0f7ff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="460" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">assign = 每点并行 argmin 距离（与 Nearest Neighbor 同构）　·　update = 每点 atomicAdd 归约（与 Histogramming 同构）</text>
  <text x="460" y="422" text-anchor="middle" font-size="10" fill="#888">难点不在单 kernel，而在跨迭代编排 + 空簇处理 + 「轮间串行、轮内并行」的 GPU 认知</text>
</svg>
