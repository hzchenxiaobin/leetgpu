<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="520" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold">Linear Attention：kernel trick 把 O(M²) 降到 O(Md²)</text>
  <path d="M 300 44 Q 470 52 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- ============ 左侧：标准 softmax attention ============ -->
  <text x="190" y="80" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">标准 Softmax Attention（O(M²) 灾难）</text>

  <g filter="url(#sk)">
    <rect x="70" y="94" width="50" height="120" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="125" y="94" width="50" height="120" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="95" y="88" text-anchor="middle" font-size="11" fill="#2b6e9e">Q</text>
  <text x="150" y="88" text-anchor="middle" font-size="11" fill="#2b6e9e">K^T</text>
  <text x="122" y="228" text-anchor="middle" font-size="10" fill="#888">M×d  ×  d×M</text>

  <path d="M 175 154 L 205 154" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- M×M attention 矩阵（红色大） -->
  <g filter="url(#sk)">
    <rect x="210" y="100" width="120" height="108" fill="#fdecec" stroke="#b03a3a" stroke-width="1.6" stroke-dasharray="5,3"/>
  </g>
  <text x="270" y="156" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">M×M</text>
  <text x="270" y="174" text-anchor="middle" font-size="10" fill="#b03a3a">softmax(QK^T)</text>
  <text x="270" y="226" text-anchor="middle" font-size="10" fill="#b03a3a">显存 O(M²) · IO O(M²d)</text>

  <path d="M 335 154 L 365 154" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="370" y="94" width="40" height="120" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="390" y="88" text-anchor="middle" font-size="11" fill="#2e6e2e">V</text>
  <text x="390" y="226" text-anchor="middle" font-size="10" fill="#888">M×d</text>

  <text x="220" y="262" font-size="11" fill="#b03a3a" font-weight="bold">⚠ 中间矩阵 M×M → 长序列 OOM</text>

  <!-- ============ 中间分隔箭头 ============ -->
  <g filter="url(#sk)">
    <rect x="445" y="120" width="70" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="480" y="148" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">φ 换序</text>
  <text x="480" y="164" text-anchor="middle" font-size="9" fill="#7a5415">(QK^T)V</text>
  <text x="480" y="178" text-anchor="middle" font-size="9" fill="#7a5415">→Q(K^TV)</text>
  <path d="M 430 155 L 448 155" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 515 155 L 540 155" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ============ 右侧：linear attention 四步 ============ -->
  <text x="730" y="80" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">Linear Attention（O(Md²)，d≪M 时大幅降低）</text>

  <!-- ① φ -->
  <g filter="url(#sk)">
    <rect x="545" y="94" width="60" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="575" y="112" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">① φ(Q),φ(K)</text>
  <text x="575" y="126" text-anchor="middle" font-size="9" fill="#888">ELU+1, M×d</text>

  <!-- ② S (d×d 绿色小) + z -->
  <g filter="url(#sk)">
    <rect x="545" y="146" width="34" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="562" y="167" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">d×d</text>
  <g filter="url(#sk)">
    <rect x="585" y="150" width="20" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <text x="595" y="167" text-anchor="middle" font-size="8" fill="#2e6e2e">z</text>
  <text x="575" y="196" text-anchor="middle" font-size="9" fill="#2e6e2e">② S=φK^T V, z=ΣφK</text>

  <!-- ③ num/den -->
  <g filter="url(#sk)">
    <rect x="545" y="206" width="60" height="40" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="575" y="224" text-anchor="middle" font-size="10" fill="#c98a2b" font-weight="bold">③ num=φQ@S</text>
  <text x="575" y="238" text-anchor="middle" font-size="9" fill="#888">den=φQ@z, M×d</text>

  <!-- ④ output -->
  <g filter="url(#sk)">
    <rect x="545" y="256" width="60" height="34" rx="5" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.2"/>
  </g>
  <text x="575" y="277" text-anchor="middle" font-size="10" fill="#8e5db8" font-weight="bold">④ num/den</text>

  <path d="M 575 134 L 575 144" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 575 196 L 575 204" stroke="#c98a2b" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 575 246 L 575 254" stroke="#8e5db8" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 右侧对比框 -->
  <g filter="url(#sk)">
    <rect x="640" y="300" width="280" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="660" y="322" font-size="11" fill="#444" font-weight="bold">复杂度对比（M=10000, d=128）</text>
  <text x="660" y="344" font-size="11" fill="#b03a3a">softmax:  O(M²d) ≈ 1.28×10¹⁰ FLOPs</text>
  <text x="660" y="362" font-size="11" fill="#2e6e2e">linear :  O(Md²) ≈ 1.64×10⁸  FLOPs</text>
  <text x="660" y="384" font-size="11" fill="#7a5415" font-weight="bold">→ 约 78× 差距（两个数量级）</text>
  <text x="660" y="406" font-size="10" fill="#888">代价：φ 非归一化核，需线性分母归一化</text>

  <!-- 公式 -->
  <g filter="url(#sk)">
    <rect x="70" y="300" width="540" height="50" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="4,3"/>
  </g>
  <text x="340" y="324" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">softmax: O = softmax(QK^T/√d) V        →  O(M²d)</text>
  <text x="340" y="342" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">linear : O = φ(Q)(φ(K)^T V) / φ(Q)(Σφ(K))  →  O(Md²)</text>

  <text x="470" y="402" text-anchor="middle" font-size="11" fill="#666">关键：结合律换序 (φQ·φK^T)V → φQ·(φK^T·V)，中间矩阵 M×M → d×d</text>
  <text x="470" y="422" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">S = φ(K)^T V 仅 d×d，天然可常驻 shared memory，无长序列 OOM</text>

  <text x="470" y="478" text-anchor="middle" font-size="11" fill="#888">瓶颈从“消除 M² 物化”（FlashAttention）转向“双 GEMM tiling 复用”</text>
</svg>
