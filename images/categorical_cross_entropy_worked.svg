<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Worked Example: N=2, C=3, true_labels=[1, 1]</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">逐步推演两行 log-sum-exp − true_logit 的完整计算过程</text>

  <!-- ===== Row 0 ===== -->
  <text x="30" y="74" font-size="13" fill="#446688" font-weight="bold">Row 0: z = [1.0, 2.0, 0.5], y = 1</text>

  <rect x="20" y="82" width="600" height="160" fill="#e8f0fe" fill-opacity="0.2" stroke="#446688" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>

  <text x="30" y="105" font-size="11" fill="#333">① max: m = max(1.0, 2.0, 0.5) = <tspan font-weight="bold" fill="#b85450">2.0</tspan></text>

  <text x="30" y="128" font-size="11" fill="#333">② z − m = [−1.0, 0.0, −1.5]</text>

  <text x="30" y="151" font-size="11" fill="#333">③ exp(z − m) = [0.3679, 1.0000, 0.2231]</text>

  <text x="30" y="174" font-size="11" fill="#333">④ s = Σ = 0.3679 + 1.0000 + 0.2231 = <tspan font-weight="bold" fill="#b85450">1.5910</tspan></text>

  <text x="30" y="197" font-size="11" fill="#333">⑤ lse = m + log(s) = 2.0 + log(1.5910) = 2.0 + 0.4648 = <tspan font-weight="bold" fill="#d6a040">2.4648</tspan></text>

  <text x="30" y="220" font-size="11" fill="#333">⑥ true_logit = z[1] = <tspan font-weight="bold" fill="#b85450">2.0</tspan></text>

  <text x="30" y="237" font-size="12" fill="#4a7a3a" font-weight="bold">  Loss_0 = lse − true_logit = 2.4648 − 2.0 = 0.4648</text>

  <!-- ===== Row 1 ===== -->
  <text x="30" y="270" font-size="13" fill="#446688" font-weight="bold">Row 1: z = [0.1, 3.0, 1.5], y = 1</text>

  <rect x="20" y="278" width="600" height="160" fill="#e6f4ea" fill-opacity="0.2" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>

  <text x="30" y="301" font-size="11" fill="#333">① max: m = max(0.1, 3.0, 1.5) = <tspan font-weight="bold" fill="#b85450">3.0</tspan></text>

  <text x="30" y="324" font-size="11" fill="#333">② z − m = [−2.9, 0.0, −1.5]</text>

  <text x="30" y="347" font-size="11" fill="#333">③ exp(z − m) = [0.0550, 1.0000, 0.2231]</text>

  <text x="30" y="370" font-size="11" fill="#333">④ s = Σ = 0.0550 + 1.0000 + 0.2231 = <tspan font-weight="bold" fill="#b85450">1.2781</tspan></text>

  <text x="30" y="393" font-size="11" fill="#333">⑤ lse = m + log(s) = 3.0 + log(1.2781) = 3.0 + 0.2451 = <tspan font-weight="bold" fill="#d6a040">3.2451</tspan></text>

  <text x="30" y="416" font-size="11" fill="#333">⑥ true_logit = z[1] = <tspan font-weight="bold" fill="#b85450">3.0</tspan></text>

  <text x="30" y="433" font-size="12" fill="#4a7a3a" font-weight="bold">  Loss_1 = lse − true_logit = 3.2451 − 3.0 = 0.2451</text>

  <!-- ===== Final result ===== -->
  <rect x="20" y="448" width="600" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="466" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">L = (Loss_0 + Loss_1) / N = (0.4648 + 0.2451) / 2 = 0.3550</text>
</svg>
