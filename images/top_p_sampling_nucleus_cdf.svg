<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Nucleus 选择 + CDF 采样：cumsum → 截断 → renorm → 采样</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">排序后做前缀和，找到累积概率首次 ≥ p 的位置，重归一化后按 CDF 采样</text>

  <!-- ===== Sorted probs ===== -->
  <text x="30" y="74" font-size="12" fill="#d6a040" font-weight="bold">① 排序后的概率（降序）</text>

  <rect x="40" y="82" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="102" text-anchor="middle" font-size="10" fill="#d6a040">0.64</text>
  <rect x="105" y="82" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="102" text-anchor="middle" font-size="10" fill="#d6a040">0.24</text>
  <rect x="170" y="82" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="102" text-anchor="middle" font-size="10" fill="#d6a040">0.09</text>
  <rect x="235" y="82" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="102" text-anchor="middle" font-size="10" fill="#d6a040">0.03</text>

  <text x="310" y="102" font-size="9" fill="#888">idx: [2, 1, 0, 3]</text>

  <!-- ===== Cumsum ===== -->
  <text x="30" y="136" font-size="12" fill="#b85450" font-weight="bold">② 前缀和 cumsum</text>

  <line x1="70" y1="116" x2="70" y2="138" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="135" y1="116" x2="135" y2="138" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="200" y1="116" x2="200" y2="138" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="265" y1="116" x2="265" y2="138" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="142" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="162" text-anchor="middle" font-size="10" fill="#b85450">0.64</text>
  <rect x="105" y="142" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="162" text-anchor="middle" font-size="10" fill="#b85450">0.88</text>
  <rect x="170" y="142" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0.97</text>
  <rect x="235" y="142" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="265" y="162" text-anchor="middle" font-size="10" fill="#b85450">1.00</text>

  <!-- p threshold line -->
  <line x1="30" y1="155" x2="310" y2="155" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="320" y="158" font-size="10" fill="#446688" font-weight="bold">p = 0.9</text>

  <text x="310" y="162" font-size="9" fill="#b85450" font-weight="bold">↑ 首次 ≥ 0.9 → cutoff = 3</text>

  <!-- ===== Nucleus ===== -->
  <text x="30" y="196" font-size="12" fill="#446688" font-weight="bold">③ Nucleus = top cutoff 个 token</text>

  <rect x="40" y="204" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="224" text-anchor="middle" font-size="10" fill="#446688">0.64</text>
  <rect x="105" y="204" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="135" y="224" text-anchor="middle" font-size="10" fill="#446688">0.24</text>
  <rect x="170" y="204" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="200" y="224" text-anchor="middle" font-size="10" fill="#446688">0.09</text>
  <rect x="235" y="204" width="60" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="265" y="224" text-anchor="middle" font-size="10" fill="#ccc">0.03</text>

  <text x="310" y="224" font-size="9" fill="#888">[0.03 被丢弃]</text>

  <!-- ===== Renorm ===== -->
  <text x="30" y="258" font-size="12" fill="#4a7a3a" font-weight="bold">④ 重归一化: probs / sum(nucleus) = / 0.97</text>

  <line x1="70" y1="238" x2="70" y2="258" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="135" y1="238" x2="135" y2="258" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="200" y1="238" x2="200" y2="258" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="262" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">0.66</text>
  <rect x="105" y="262" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="135" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">0.25</text>
  <rect x="170" y="262" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="200" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a">0.09</text>

  <text x="310" y="282" font-size="9" fill="#4a7a3a">sum = 1.00 ✓</text>

  <!-- ===== CDF + Sample ===== -->
  <text x="30" y="318" font-size="12" fill="#d6a040" font-weight="bold">⑤ CDF 采样: 生成 r ∈ [0,1)，找首个 CDF ≥ r 的位置</text>

  <line x1="70" y1="298" x2="70" y2="318" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="135" y1="298" x2="135" y2="318" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="200" y1="298" x2="200" y2="318" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="322" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="340" text-anchor="middle" font-size="9" fill="#d6a040">CDF[0]=0.66</text>
  <rect x="105" y="322" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="135" y="340" text-anchor="middle" font-size="9" fill="#d6a040">CDF[1]=0.91</text>
  <rect x="170" y="322" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="340" text-anchor="middle" font-size="9" fill="#d6a040">CDF[2]=1.00</text>

  <text x="260" y="340" font-size="10" fill="#333">r = 0.73 → CDF[0] &lt; r ≤ CDF[1]</text>
  <text x="260" y="356" font-size="10" fill="#b85450" font-weight="bold">→ sampled_idx = 1 → token = idx[1] = 1</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="375" width="580" height="55" fill="#e8f0fe" fill-opacity="0.2" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="395" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">采样 = 在 nucleus 的 CDF 上做一次二分搜索</text>
  <text x="320" y="413" text-anchor="middle" font-size="10" fill="#888">r 由 seed 经哈希生成 → 不同 seed 采不同 token；同一 seed 可复现</text>
  <text x="320" y="427" text-anchor="middle" font-size="9" fill="#888">p=1.0 时等价于普通采样；p→0 时退化为贪心（argmax）</text>
</svg>
