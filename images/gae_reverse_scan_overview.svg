<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#fdfcf7"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">GAE 反向 scan：一序列一 block，δ 现算 → 右→左 递推</text>
  <path d="M 250 42 Q 450 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- B sequences mapping -->
  <text x="40" y="76" font-size="13" font-weight="bold" fill="#2b6e9e">B 条独立序列 → B 个 block（blockIdx.x = b）</text>
  <g filter="url(#sk)">
    <rect x="40" y="86" width="150" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="40" y="116" width="150" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="40" y="146" width="150" height="26" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="40" y="176" width="150" height="22" rx="5" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <text x="115" y="103" text-anchor="middle" font-size="12" fill="#2b6e9e">序列 0 (block 0)</text>
  <text x="115" y="133" text-anchor="middle" font-size="12" fill="#2b6e9e">序列 1 (block 1)</text>
  <text x="115" y="163" text-anchor="middle" font-size="12" fill="#2b6e9e">序列 2 (block 2)</text>
  <text x="115" y="190" text-anchor="middle" font-size="11" fill="#8aa0bb">... (B 条)</text>

  <path d="M 195 131 L 235 131" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="215" y="124" text-anchor="middle" font-size="10" fill="#7a5415">展开序列 b</text>

  <!-- expanded single sequence: rewards / values -> delta -> reverse scan -> advantages -->
  <text x="250" y="76" font-size="12" font-weight="bold" fill="#2b6e9e">输入 rewards / values (shape B×S)</text>
  <g filter="url(#sk)">
    <rect x="250" y="86" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="300" y="86" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="350" y="86" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="400" y="86" width="50" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="455" y="86" width="40" height="30" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <text x="275" y="105" text-anchor="middle" font-size="12" fill="#2b6e9e">rₜ</text>
  <text x="325" y="105" text-anchor="middle" font-size="12" fill="#2b6e9e">rₜ₊₁</text>
  <text x="375" y="105" text-anchor="middle" font-size="12" fill="#aaa">…</text>
  <text x="425" y="105" text-anchor="middle" font-size="12" fill="#2b6e9e">r_S₋₁</text>
  <text x="475" y="105" text-anchor="middle" font-size="11" fill="#8aa0bb">S 步</text>

  <path d="M 340 120 L 340 142" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="352" y="136" font-size="10" fill="#7a5415">δₜ = rₜ + γ·next_v − vₜ</text>

  <text x="250" y="156" font-size="12" font-weight="bold" fill="#7a5415">δ（TD 误差，现算不落盘）</text>
  <g filter="url(#sk)">
    <rect x="250" y="166" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="300" y="166" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="350" y="166" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="400" y="166" width="50" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="275" y="185" text-anchor="middle" font-size="12" fill="#7a5415">δ₀</text>
  <text x="325" y="185" text-anchor="middle" font-size="12" fill="#7a5415">δ₁</text>
  <text x="375" y="185" text-anchor="middle" font-size="12" fill="#aaa">…</text>
  <text x="425" y="185" text-anchor="middle" font-size="12" fill="#7a5415">δ_S₋₁</text>

  <!-- reverse scan arrow pointing LEFT -->
  <path d="M 410 218 L 300 218" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="355" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">反向 scan（右→左）</text>
  <text x="355" y="234" text-anchor="middle" font-size="11" fill="#b85450">Aₜ = δₜ + decay·Aₜ₊₁</text>

  <text x="250" y="256" font-size="12" font-weight="bold" fill="#2e6e2e">输出 advantages (Aₜ)</text>
  <g filter="url(#sk)">
    <rect x="250" y="266" width="50" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="300" y="266" width="50" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="350" y="266" width="50" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="400" y="266" width="50" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="275" y="285" text-anchor="middle" font-size="12" fill="#2e6e2e">A₀</text>
  <text x="325" y="285" text-anchor="middle" font-size="12" fill="#2e6e2e">A₁</text>
  <text x="375" y="285" text-anchor="middle" font-size="12" fill="#aaa">…</text>
  <text x="425" y="285" text-anchor="middle" font-size="12" fill="#2e6e2e">A_S₋₁</text>

  <!-- block internal 3-phase on the right -->
  <g filter="url(#sk)">
    <rect x="540" y="86" width="330" height="220" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 3"/>
  </g>
  <text x="555" y="108" font-size="13" font-weight="bold" fill="#444">block 内三段式反向 scan</text>

  <g filter="url(#sk)">
    <rect x="555" y="122" width="300" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="705" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">① chunk 内串行反向 scan</text>
  <text x="705" y="156" text-anchor="middle" font-size="10" fill="#2b6e9e">每线程 E 步 → (a=decay连乘, b=累积偏置)</text>

  <path d="M 705 166 L 705 180" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="555" y="184" width="300" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="705" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">② warp 内 __shfl_down_sync scan</text>
  <text x="705" y="218" text-anchor="middle" font-size="10" fill="#7a5415">32 chunk 聚合 → 5 步蝶形 → warp 内右侧</text>

  <path d="M 705 228 L 705 242" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="555" y="246" width="300" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="705" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">③ block 级 shared memory 拼接</text>
  <text x="705" y="280" text-anchor="middle" font-size="10" fill="#b85450">8 warp 聚合 → warp 间右侧 → carry</text>

  <path d="M 340 300 L 540 240" stroke="#5a5a5a" stroke-width="1.1" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="276" font-size="10" fill="#888">Aₜ = a·carry.b + b</text>

  <!-- bottom insight -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="830" height="128" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="354" font-size="13" font-weight="bold" fill="#444">💡 核心洞察</text>
  <text x="56" y="376" font-size="12" fill="#444">递推 Aₜ = decay·Aₜ₊₁ + δₜ 看似只能串行；把它抽象成仿射复合 ⊕（可结合）后，</text>
  <text x="56" y="396" font-size="12" fill="#444">反向 scan 用 __shfl_down_sync + 递增 offset 蝶形 5 步完成（与 #16 正向 scan 镜像）。</text>
  <text x="56" y="416" font-size="12" fill="#b85450">B 条序列互相独立 → 一序列一 block；δ 现算不落盘，无中间缓冲。</text>
  <text x="56" y="438" font-size="11" fill="#888">算子从 + 换成 ⊕、方向从 左→右 换成 右→左，scan 模板原封不动。</text>
</svg>
