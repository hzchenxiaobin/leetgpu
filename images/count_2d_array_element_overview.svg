<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#fdfcf7"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Count 2D Array Element：2D 矩阵 → 展平 → predicate 归约</text>
  <path d="M 250 42 Q 450 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- K badge -->
  <g filter="url(#sk)">
    <rect x="740" y="60" width="120" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="800" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">目标值 K = 1</text>

  <!-- 2D matrix -->
  <text x="80" y="80" font-size="12" font-weight="bold" fill="#2b6e9e">输入：input[N][M]（int32，N 行 × M 列，row-major）</text>
  <text x="300" y="76" font-size="10" fill="#888">col 0   col 1   col 2   col 3</text>
  <text x="58" y="100" font-size="10" fill="#888">row 0</text>
  <text x="58" y="138" font-size="10" fill="#888">row 1</text>
  <g filter="url(#sk)">
    <rect x="100" y="88" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="160" y="88" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="220" y="88" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="280" y="88" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="100" y="124" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="160" y="124" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="220" y="124" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="280" y="124" width="60" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="130" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="190" y="112" text-anchor="middle" font-size="15" fill="#2b6e9e">2</text>
  <text x="250" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="310" y="112" text-anchor="middle" font-size="15" fill="#2b6e9e">3</text>
  <text x="130" y="148" text-anchor="middle" font-size="15" fill="#2b6e9e">4</text>
  <text x="190" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="250" y="148" text-anchor="middle" font-size="15" fill="#2b6e9e">2</text>
  <text x="310" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="370" y="120" font-size="11" fill="#888">idx = row * M + col</text>

  <!-- flatten arrow -->
  <path d="M 200 168 L 200 188" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="184" font-size="11" fill="#7a5415">展平 row-major</text>

  <!-- 1D flattened -->
  <text x="80" y="204" font-size="12" font-weight="bold" fill="#2b6e9e">展平为 1D：total = N × M 个元素</text>
  <g filter="url(#sk)">
    <rect x="100" y="212" width="60" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="160" y="212" width="60" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="220" y="212" width="60" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="280" y="212" width="60" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="100" y="212" width="240" height="2" fill="#4a8edb" opacity="0.3"/>
  </g>
  <text x="130" y="234" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <text x="190" y="234" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="250" y="234" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <text x="310" y="234" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <text x="360" y="234" font-size="11" fill="#888">4  1  2  1  ... (共 N×M)</text>

  <!-- predicate arrow -->
  <path d="M 200 252 L 200 272" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="268" font-size="11" fill="#7a5415">predicate：input[i] == K ?</text>

  <!-- predicate row -->
  <text x="80" y="288" font-size="12" font-weight="bold" fill="#7a5415">逐元素判定：等于 K 记 1，否则记 0</text>
  <g filter="url(#sk)">
    <rect x="100" y="296" width="60" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="160" y="296" width="60" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="220" y="296" width="60" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="280" y="296" width="60" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="130" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1</text>
  <text x="190" y="318" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="250" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1</text>
  <text x="310" y="318" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="360" y="318" font-size="11" fill="#aaa">0  1  0  1  ...</text>

  <!-- reduce arrow -->
  <path d="M 200 336 L 200 356" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="352" font-size="11" fill="#2e6e2e">归约求和 Σ</text>

  <!-- reduction -->
  <text x="80" y="372" font-size="12" font-weight="bold" fill="#2e6e2e">两级归约：warp shuffle → block_sum → final</text>
  <g filter="url(#sk)">
    <circle cx="130" cy="398" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <circle cx="250" cy="398" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <circle cx="190" cy="436" r="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="130" y="402" text-anchor="middle" font-size="11" fill="#2e6e2e">1</text>
  <text x="250" y="402" text-anchor="middle" font-size="11" fill="#2e6e2e">1</text>
  <text x="190" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <path d="M 130 413 Q 160 425 178 430" stroke="#4a8e4a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 250 413 Q 220 425 202 430" stroke="#4a8e4a" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- output -->
  <g filter="url(#sk)">
    <rect x="540" y="410" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="615" y="430" text-anchor="middle" font-size="11" fill="#2e6e2e">output[0]</text>
  <text x="615" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">= 4</text>
  <path d="M 210 438 Q 380 460 535 432" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="520" y="120" width="350" height="170" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="538" y="144" font-size="12" font-weight="bold" fill="#444">💡 核心洞察</text>
  <text x="538" y="166" font-size="11" fill="#444">2D 矩阵在内存中本就是 row-major</text>
  <text x="538" y="182" font-size="11" fill="#444">一维连续存储，故"2D 计数"本质与</text>
  <text x="538" y="198" font-size="11" fill="#444">1D 计数同构——展平后直接复用</text>
  <text x="538" y="214" font-size="11" fill="#444">predicate + 两级归约模板。</text>
  <text x="538" y="240" font-size="11" font-weight="bold" fill="#b85450">关键差异在性能测试：</text>
  <text x="538" y="256" font-size="11" fill="#b85450">K=1, 值域{1,2} → 50% 命中</text>
  <text x="538" y="272" font-size="11" fill="#b85450">≈ 5000 万次 atomicAdd → 串行化</text>
</svg>
