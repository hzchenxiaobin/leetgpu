<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e6e2e"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">局部排序（shared mem） vs 全局归并（cross-block）</text>
  <path d="M 280 40 Q 450 48 620 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- Left: local sort in shared memory -->
  <text x="40" y="74" font-size="13" font-weight="bold" fill="#7a5415">局部排序：1 个 block 排 TILE 个元素（全在 shared mem）</text>
  <g filter="url(#sk)">
    <rect x="40" y="84" width="380" height="250" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="106" font-size="11" font-weight="bold" fill="#7a5415">__shared__ float sh[TILE]</text>

  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle">
    <rect x="56" y="118" width="26" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/><text x="69" y="134">…</text>
    <rect x="86" y="118" width="26" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/><text x="99" y="134">5</text>
    <rect x="116" y="118" width="26" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/><text x="129" y="134">2</text>
    <rect x="146" y="118" width="26" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/><text x="159" y="134">8</text>
    <rect x="176" y="118" width="26" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/><text x="189" y="134">1</text>
    <rect x="206" y="118" width="26" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/><text x="219" y="134">…</text>
    <rect x="236" y="118" width="26" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3 2"/><text x="249" y="134">∞</text>
    <rect x="266" y="118" width="26" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3 2"/><text x="279" y="134">∞</text>
  </g>
  <text x="300" y="134" font-size="10" fill="#888">global → shared（补 +∞）</text>

  <path d="M 230 150 L 230 170" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="56" y="178" width="348" height="60" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="230" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">for size = 2 → TILE（翻倍）</text>
  <text x="230" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">  for stride = size/2 → 1（减半）</text>
  <text x="230" y="234" text-anchor="middle" font-size="11" fill="#7a5415">    compare-swap sh[tid] ↔ sh[tid⊕stride]</text>

  <path d="M 230 242 L 230 262" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle">
    <rect x="56" y="270" width="26" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="69" y="286">1</text>
    <rect x="86" y="270" width="26" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="99" y="286">2</text>
    <rect x="116" y="270" width="26" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="129" y="286">5</text>
    <rect x="146" y="270" width="26" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="159" y="286">8</text>
    <rect x="176" y="270" width="26" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="189" y="286">…</text>
    <rect x="206" y="270" width="26" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="219" y="286">…</text>
    <rect x="236" y="270" width="26" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3 2"/><text x="249" y="286">∞</text>
    <rect x="266" y="270" width="26" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3 2"/><text x="279" y="286">∞</text>
  </g>
  <text x="300" y="286" font-size="10" fill="#888">TILE 内有序（方向交替）</text>
  <text x="56" y="318" font-size="10" fill="#888">每个 stride 后 __syncthreads()；无全局内存往返</text>

  <!-- Right: global merge across blocks -->
  <text x="480" y="74" font-size="13" font-weight="bold" fill="#2e6e2e">全局归并：stride ≥ TILE，跨 block 在 global mem 上比较-交换</text>
  <g filter="url(#sk)">
    <rect x="480" y="84" width="380" height="250" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="496" y="106" font-size="11" font-weight="bold" fill="#2e6e2e">每子步一次 kernel launch</text>

  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle">
    <rect x="496" y="120" width="58" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="525" y="137">block0</text>
    <rect x="558" y="120" width="58" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="587" y="137">block1</text>
    <rect x="620" y="120" width="58" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="649" y="137">block2</text>
    <rect x="682" y="120" width="58" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="711" y="137">block3</text>
    <rect x="744" y="120" width="58" height="26" rx="3" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1" stroke-dasharray="3 2"/><text x="773" y="137">…</text>
  </g>
  <text x="496" y="160" font-size="10" fill="#888">已排好序的 TILE 段</text>

  <g stroke="#2e6e2e" stroke-width="1.3" fill="none" filter="url(#sk)">
    <path d="M525 150 L649 150"/><path d="M587 150 L711 150"/>
  </g>
  <text x="496" y="172" font-size="10" fill="#2e6e2e">size=2·TILE, stride=TILE：相邻段配对比较-交换</text>

  <path d="M 660 178 L 660 198" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle">
    <rect x="496" y="206" width="120" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="556" y="223">段[0..1] 归并</text>
    <rect x="620" y="206" width="120" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/><text x="680" y="223">段[2..3] 归并</text>
    <rect x="744" y="206" width="58" height="26" rx="3" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1" stroke-dasharray="3 2"/><text x="773" y="223">…</text>
  </g>
  <text x="496" y="250" font-size="10" fill="#2e6e2e">stride 减半 TILE→TILE/2→…→1，每次一个 kernel</text>
  <text x="496" y="266" font-size="10" fill="#888">size 再翻倍 2·TILE→4·TILE→…→P，重复</text>

  <path d="M 660 276 L 660 296" stroke="#2e6e2e" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle">
    <rect x="496" y="304" width="248" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="620" y="321">全 P 元素升序</text>
  </g>

  <!-- bottom: launch count -->
  <g filter="url(#sk)">
    <rect x="40" y="354" width="820" height="96" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="378" font-size="12" font-weight="bold" fill="#444">💡 kernel 编排</text>
  <text x="56" y="398" font-size="11" fill="#444">局部排序 = 1 个 kernel（前 log₂TILE 级全在 shared mem 里跑完，省 N·log² 的全局往返）。</text>
  <text x="56" y="416" font-size="11" fill="#444">全局归并 = log₂(P/TILE) 级，每级 log₂(size) 个子步 → 约 log₂P·(log₂P+1)/2 − log₂TILE·(log₂TILE+1)/2 次 launch。</text>
  <text x="56" y="436" font-size="11" fill="#b85450">优化方向：stride &lt; TILE 的子步并回 shared mem；用 grid_sync 合并多子步；或换 merge-sort 路线减 launch。</text>
</svg>
