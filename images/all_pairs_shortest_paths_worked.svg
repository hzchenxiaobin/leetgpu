<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Worked Example：4 顶点有向图，k=0 的一轮松弛</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">边：0→1(5), 0→3(10), 1→2(3), 2→3(1), 3→0(2)；∞ 表示无边</text>

  <!-- ===== 左上：初始邻接矩阵 ===== -->
  <text x="30" y="74" font-size="12" fill="#446688" font-weight="bold">初始 d（邻接矩阵）</text>
  <g font-family="monospace" font-size="11" fill="#333">
    <text x="60" y="96" text-anchor="middle" fill="#888">0</text>
    <text x="92" y="96" text-anchor="middle" fill="#888">1</text>
    <text x="124" y="96" text-anchor="middle" fill="#888">2</text>
    <text x="156" y="96" text-anchor="middle" fill="#888">3</text>
    <text x="34" y="120" text-anchor="middle" fill="#888">0</text>
    <text x="34" y="142" text-anchor="middle" fill="#888">1</text>
    <text x="34" y="164" text-anchor="middle" fill="#888">2</text>
    <text x="34" y="186" text-anchor="middle" fill="#888">3</text>
  </g>
  <!-- row 0 (k) highlight -->
  <rect x="44" y="108" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <!-- col 0 (k) highlight -->
  <rect x="44" y="108" width="32" height="100" fill="none" stroke="#d6a040" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <g font-family="monospace" font-size="11" fill="#333">
    <text x="60" y="124" text-anchor="middle">0</text>
    <text x="92" y="124" text-anchor="middle">5</text>
    <text x="124" y="124" text-anchor="middle">∞</text>
    <text x="156" y="124" text-anchor="middle">10</text>

    <text x="60" y="146" text-anchor="middle">∞</text>
    <text x="92" y="146" text-anchor="middle">0</text>
    <text x="124" y="146" text-anchor="middle">3</text>
    <text x="156" y="146" text-anchor="middle">∞</text>

    <text x="60" y="168" text-anchor="middle">∞</text>
    <text x="92" y="168" text-anchor="middle">∞</text>
    <text x="124" y="168" text-anchor="middle">0</text>
    <text x="156" y="168" text-anchor="middle">1</text>

    <text x="60" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="92" y="190" text-anchor="middle">∞</text>
    <text x="124" y="190" text-anchor="middle">∞</text>
    <text x="156" y="190" text-anchor="middle">0</text>
  </g>
  <rect x="44" y="108" width="120" height="100" fill="none" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="104" y="222" text-anchor="middle" font-size="9" fill="#d6a040">第 k=0 行 / 列（本轮广播源）</text>

  <!-- ===== right: the relaxation computation ===== -->
  <text x="260" y="74" font-size="12" fill="#4a7a3a" font-weight="bold">k=0 轮的松弛（每个 (i,j) 并行）</text>
  <rect x="250" y="82" width="370" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <g font-family="monospace" font-size="11" fill="#333">
    <text x="265" y="106">广播：  d[i][0] = 列 0 切片</text>
    <text x="265" y="124">        d[0][j] = 行 0 切片 = [0, 5, ∞, 10]</text>
  </g>

  <rect x="265" y="136" width="340" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="156" font-family="monospace" font-size="11" fill="#333">关注 (i=3, j=1)：</text>
  <text x="280" y="170" font-family="monospace" font-size="11" fill="#b85450">d[3][1] = min( ∞ , d[3][0] + d[0][1] )</text>

  <g font-family="monospace" font-size="12" fill="#333">
    <text x="290" y="200">       = min( ∞ , 2 + 5 ) = </text>
    <text x="478" y="200" fill="#b85450" font-weight="bold">7</text>
  </g>

  <!-- ===== bottom left: matrix after k=0 ===== -->
  <text x="30" y="252" font-size="12" fill="#446688" font-weight="bold">k=0 后的 d</text>
  <g font-family="monospace" font-size="11" fill="#333">
    <text x="60" y="274" text-anchor="middle" fill="#888">0</text>
    <text x="92" y="274" text-anchor="middle" fill="#888">1</text>
    <text x="124" y="274" text-anchor="middle" fill="#888">2</text>
    <text x="156" y="274" text-anchor="middle" fill="#888">3</text>
    <text x="34" y="298" text-anchor="middle" fill="#888">0</text>
    <text x="34" y="320" text-anchor="middle" fill="#888">1</text>
    <text x="34" y="342" text-anchor="middle" fill="#888">2</text>
    <text x="34" y="364" text-anchor="middle" fill="#888">3</text>

    <text x="60" y="298" text-anchor="middle">0</text>
    <text x="92" y="298" text-anchor="middle">5</text>
    <text x="124" y="298" text-anchor="middle">∞</text>
    <text x="156" y="298" text-anchor="middle">10</text>

    <text x="60" y="320" text-anchor="middle">∞</text>
    <text x="92" y="320" text-anchor="middle">0</text>
    <text x="124" y="320" text-anchor="middle">3</text>
    <text x="156" y="320" text-anchor="middle">∞</text>

    <text x="60" y="342" text-anchor="middle">∞</text>
    <text x="92" y="342" text-anchor="middle">∞</text>
    <text x="124" y="342" text-anchor="middle">0</text>
    <text x="156" y="342" text-anchor="middle">1</text>

    <text x="60" y="364" text-anchor="middle">2</text>
    <text x="92" y="364" text-anchor="middle" fill="#b85450" font-weight="bold">7</text>
    <text x="124" y="364" text-anchor="middle">∞</text>
    <text x="156" y="364" text-anchor="middle">0</text>
  </g>
  <!-- highlight changed cell -->
  <rect x="76" y="352" width="32" height="22" fill="none" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <rect x="44" y="282" width="120" height="100" fill="none" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="104" y="396" text-anchor="middle" font-size="9" fill="#b85450">3→1 经由 0：2+5=7（新通路）</text>

  <!-- ===== bottom right: final result ===== -->
  <text x="260" y="252" font-size="12" fill="#446688" font-weight="bold">跑完 k=0..3 的最终全源最短路</text>
  <g font-family="monospace" font-size="11" fill="#333">
    <text x="290" y="274" text-anchor="middle" fill="#888">0</text>
    <text x="322" y="274" text-anchor="middle" fill="#888">1</text>
    <text x="354" y="274" text-anchor="middle" fill="#888">2</text>
    <text x="386" y="274" text-anchor="middle" fill="#888">3</text>
    <text x="264" y="298" text-anchor="middle" fill="#888">0</text>
    <text x="264" y="320" text-anchor="middle" fill="#888">1</text>
    <text x="264" y="342" text-anchor="middle" fill="#888">2</text>
    <text x="264" y="364" text-anchor="middle" fill="#888">3</text>

    <text x="290" y="298" text-anchor="middle">0</text>
    <text x="322" y="298" text-anchor="middle">5</text>
    <text x="354" y="298" text-anchor="middle">8</text>
    <text x="386" y="298" text-anchor="middle">9</text>

    <text x="290" y="320" text-anchor="middle">6</text>
    <text x="322" y="320" text-anchor="middle">0</text>
    <text x="354" y="320" text-anchor="middle">3</text>
    <text x="386" y="320" text-anchor="middle">4</text>

    <text x="290" y="342" text-anchor="middle">3</text>
    <text x="322" y="342" text-anchor="middle">8</text>
    <text x="354" y="342" text-anchor="middle">0</text>
    <text x="386" y="342" text-anchor="middle">1</text>

    <text x="290" y="364" text-anchor="middle">2</text>
    <text x="322" y="364" text-anchor="middle">7</text>
    <text x="354" y="364" text-anchor="middle">10</text>
    <text x="386" y="364" text-anchor="middle">0</text>
  </g>
  <rect x="274" y="282" width="120" height="100" fill="none" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="300" font-size="10" fill="#4a7a3a">例：1→0 = 6</text>
  <text x="450" y="316" font-size="9" fill="#888">1→2→3→0 = 3+1+2</text>
  <text x="450" y="338" font-size="10" fill="#4a7a3a">例：2→1 = 8</text>
  <text x="450" y="354" font-size="9" fill="#888">2→3→0→1 = 1+2+5</text>

  <!-- bottom note -->
  <rect x="20" y="416" width="600" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="436" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">关键不变式：第 k 轮内 d[i][k] 与 d[k][j] 不会改变（因 d[k][k]=0，松弛是 no-op）</text>
  <text x="320" y="450" text-anchor="middle" font-size="9" fill="#888">→ 所有 (i,j) 在第 k 轮读到的 d[i][k]、d[k][j] 是定值，无数据竞争，可全并行</text>
  <text x="320" y="462" text-anchor="middle" font-size="9" fill="#888">每个 k 内 N² 个 (i,j) 互不冲突，靠 kernel launch 提供跨 k 的全局同步</text>
</svg>
