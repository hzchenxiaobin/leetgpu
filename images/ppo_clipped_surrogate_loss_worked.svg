<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">PPO Clipped Surrogate Loss 逐步演算</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">B=1, S=4, clip_eps=0.2，逐 token 推演到 output=0.075</text>

  <!-- ===== Input row ===== -->
  <text x="60" y="82" font-size="10" fill="#446688" font-weight="bold">advantages</text>
  <rect x="120" y="68" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="86" text-anchor="middle" font-size="11" fill="#446688">1.0</text>
  <rect x="172" y="68" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="197" y="86" text-anchor="middle" font-size="11" fill="#446688">-2.0</text>
  <rect x="224" y="68" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="249" y="86" text-anchor="middle" font-size="11" fill="#446688">3.0</text>
  <rect x="276" y="68" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="301" y="86" text-anchor="middle" font-size="11" fill="#446688">-4.0</text>

  <text x="60" y="118" font-size="10" fill="#446688" font-weight="bold">log_pi</text>
  <rect x="120" y="104" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="122" text-anchor="middle" font-size="9" fill="#446688">ln(1.3)</text>
  <rect x="172" y="104" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="197" y="122" text-anchor="middle" font-size="9" fill="#446688">ln(0.7)</text>
  <rect x="224" y="104" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="249" y="122" text-anchor="middle" font-size="9" fill="#446688">ln(1.1)</text>
  <rect x="276" y="104" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="301" y="122" text-anchor="middle" font-size="9" fill="#446688">ln(0.8)</text>

  <text x="60" y="154" font-size="10" fill="#446688" font-weight="bold">log_pi_old</text>
  <rect x="120" y="140" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="158" text-anchor="middle" font-size="11" fill="#446688">0.0</text>
  <rect x="172" y="140" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="197" y="158" text-anchor="middle" font-size="11" fill="#446688">0.0</text>
  <rect x="224" y="140" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="249" y="158" text-anchor="middle" font-size="11" fill="#446688">0.0</text>
  <rect x="276" y="140" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="301" y="158" text-anchor="middle" font-size="11" fill="#446688">0.0</text>

  <!-- ===== Step 1: ratio ===== -->
  <text x="380" y="86" font-size="10" fill="#d6a040" font-weight="bold">ratio = exp(π-πo)</text>
  <rect x="380" y="92" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405" y="110" text-anchor="middle" font-size="11" fill="#d6a040">1.3</text>
  <rect x="432" y="92" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="457" y="110" text-anchor="middle" font-size="11" fill="#d6a040">0.7</text>
  <rect x="484" y="92" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="509" y="110" text-anchor="middle" font-size="11" fill="#d6a040">1.1</text>
  <rect x="536" y="92" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="561" y="110" text-anchor="middle" font-size="11" fill="#d6a040">0.8</text>

  <line x1="330" y1="105" x2="376" y2="105" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: clipped ===== -->
  <text x="380" y="148" font-size="10" fill="#d6a040" font-weight="bold">clip(r, 0.8, 1.2)</text>
  <rect x="380" y="154" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405" y="172" text-anchor="middle" font-size="11" fill="#d6a040">1.2</text>
  <rect x="432" y="154" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="457" y="172" text-anchor="middle" font-size="11" fill="#d6a040">0.8</text>
  <rect x="484" y="154" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="509" y="172" text-anchor="middle" font-size="11" fill="#d6a040">1.1</text>
  <rect x="536" y="154" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="561" y="172" text-anchor="middle" font-size="11" fill="#d6a040">0.8</text>

  <line x1="405" y1="120" x2="405" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="457" y1="120" x2="457" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="509" y1="120" x2="509" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="561" y1="120" x2="561" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Step 3: surrogate ===== -->
  <text x="380" y="210" font-size="10" fill="#b85450" font-weight="bold">min(r·A, clip·A)</text>
  <rect x="380" y="216" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405" y="234" text-anchor="middle" font-size="10" fill="#b85450">1.2</text>
  <rect x="432" y="216" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="457" y="234" text-anchor="middle" font-size="10" fill="#b85450">-1.6</text>
  <rect x="484" y="216" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="509" y="234" text-anchor="middle" font-size="10" fill="#b85450">3.3</text>
  <rect x="536" y="216" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="561" y="234" text-anchor="middle" font-size="10" fill="#b85450">-3.2</text>

  <!-- annotations -->
  <text x="405" y="258" text-anchor="middle" font-size="8" fill="#888">min(1.3,1.2)=1.2</text>
  <text x="457" y="258" text-anchor="middle" font-size="8" fill="#888">min(-1.4,-1.6)=-1.6</text>
  <text x="509" y="258" text-anchor="middle" font-size="8" fill="#888">min(3.3,3.3)=3.3</text>
  <text x="561" y="258" text-anchor="middle" font-size="8" fill="#888">min(-3.2,-3.2)=-3.2</text>

  <!-- ===== Reduction ===== -->
  <line x1="455" y1="266" x2="455" y2="296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="286" font-size="9" fill="#888">sum + negate + mean</text>

  <rect x="350" y="300" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">output[0]</text>
  <text x="455" y="336" text-anchor="middle" font-size="10" fill="#4a7a3a">= -(1.2-1.6+3.3-3.2)/4 = -(-0.3)/4</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="60" y="360" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="330" y="382" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察：min 对正/负 advantage 都取悲观值</text>
  <text x="330" y="400" text-anchor="middle" font-size="10" fill="#555">A&gt;0: min(r·A, clip·A) 取更小的 clip·A（限制贪婪改进）</text>
  <text x="330" y="414" text-anchor="middle" font-size="10" fill="#555">A&lt;0: min(r·A, clip·A) 取更小的 r·A（限制贪婪退化）→ 双向 trust region</text>

  <text x="330" y="448" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">output = 0.075</text>
</svg>
