<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">全融合 loss kernel：一 block 一组，adv 广播 + grid-stride 累加</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">blockIdx.x = bg = b·G+g，块内 256 线程协作扫 S 个 token，块归约后 atomicAdd</text>

  <!-- ===== (b,g) group blocks row ===== -->
  <text x="330" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Grid：B·G 个 block，每个负责一个 (b,g) 组</text>

  <rect x="40" y="90" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="112" text-anchor="middle" font-size="10" fill="#446688">block 0</text>
  <rect x="120" y="90" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="112" text-anchor="middle" font-size="10" fill="#446688">block 1</text>
  <text x="215" y="112" text-anchor="middle" font-size="13" fill="#888">…</text>
  <rect x="240" y="90" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">block bg</text>
  <text x="345" y="112" text-anchor="middle" font-size="13" fill="#888">…</text>
  <rect x="370" y="90" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="112" text-anchor="middle" font-size="10" fill="#446688">block B·G−1</text>

  <!-- ===== Zoom into block bg ===== -->
  <line x1="280" y1="126" x2="280" y2="150" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="154" width="560" height="232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">block bg 内部（BLOCK_SIZE = 256 线程）</text>

  <!-- Step 1: load adv -->
  <rect x="58" y="186" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="204" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① tid==0 读 advantages[bg]</text>
  <text x="148" y="219" text-anchor="middle" font-size="9" fill="#555">→ shared s_adv → __syncthreads</text>

  <!-- Step 2: grid-stride -->
  <rect x="250" y="186" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">② adv = s_adv（广播）</text>
  <text x="340" y="219" text-anchor="middle" font-size="9" fill="#555">pi/log_pi_old/log_ref + bg·S</text>

  <!-- grid-stride loop box -->
  <rect x="58" y="238" width="490" height="86" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="303" y="256" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③ for (s = tid; s &lt; S; s += 256)  // grid-stride</text>
  <text x="78" y="274" font-size="9" fill="#555">ratio = __expf(pi[s] − pio[s])</text>
  <text x="78" y="288" font-size="9" fill="#555">clipped = clamp(ratio, 1−ε, 1+ε)</text>
  <text x="78" y="302" font-size="9" fill="#555">sur = min(ratio·adv, clipped·adv)</text>
  <text x="78" y="316" font-size="9" fill="#555">kl = expf(ref[s]−pi[s]) − (ref[s]−pi[s]) − 1</text>
  <text x="320" y="274" font-size="9" fill="#555">local += sur − β·kl</text>
  <text x="320" y="290" font-size="9" fill="#888">↑ 逐 token 全在寄存器，</text>
  <text x="320" y="304" font-size="9" fill="#888">  无 (B,G,S) 中间数组落盘</text>

  <!-- Step 4: block reduce -->
  <rect x="58" y="332" width="230" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="350" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">④ block_reduce_sum(local)</text>
  <text x="173" y="365" text-anchor="middle" font-size="9" fill="#555">warp shuffle + shared 汇总</text>

  <!-- Step 5: atomicAdd -->
  <rect x="318" y="332" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="433" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">⑤ atomicAdd(output, −sum/N)</text>
  <text x="433" y="365" text-anchor="middle" font-size="9" fill="#555">tid==0 执行，全局聚合</text>

  <!-- coalesced note -->
  <line x1="340" y1="226" x2="340" y2="236" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="173" y1="324" x2="173" y2="332" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="433" y1="324" x2="433" y2="332" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="330" y="412" text-anchor="middle" font-size="10" fill="#888">S 个 token 连续 → pi[s]/pio[s]/ref[s] 连续地址，warp 内 32 线程 coalesced 读</text>
  <text x="330" y="430" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">advantage 每组只读 1 次（广播），3 个大数组各读 1 遍 → memory-bound 极限</text>
</svg>
