<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Count 3D Array Element：3D 体数据 → 展平 → predicate 归约</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- P badge -->
  <g filter="url(#sk)">
    <rect x="740" y="60" width="130" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="805" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">目标值 P = 2</text>

  <!-- 3D volume (stacked layers) -->
  <text x="60" y="80" font-size="12" font-weight="bold" fill="#2b6e9e">输入：input[N][M][K]（int32，N 片 × M 行 × K 列，row-major）</text>
  <text x="60" y="96" font-size="10" fill="#888">三维体 = 多个 2D 切片堆叠</text>

  <!-- slice 0 (back, drawn lighter/smaller) -->
  <g filter="url(#sk)" opacity="0.55">
    <rect x="150" y="110" width="150" height="90" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="158" y="124" font-size="10" fill="#4a8edb">slice i=0</text>

  <!-- slice 1 (front) -->
  <g filter="url(#sk)">
    <rect x="120" y="130" width="150" height="90" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="128" y="144" font-size="10" font-weight="bold" fill="#2b6e9e">slice i=1</text>

  <!-- cells in front slice: 2x3 grid of values -->
  <g filter="url(#sk)">
    <rect x="130" y="156" width="44" height="26" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="174" y="156" width="44" height="26" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="218" y="156" width="44" height="26" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="130" y="184" width="44" height="26" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="174" y="184" width="44" height="26" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
    <rect x="218" y="184" width="44" height="26" rx="3" fill="#fff" stroke="#4a8edb" stroke-width="0.9"/>
  </g>
  <text x="152" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="196" y="174" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <text x="240" y="174" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <text x="152" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="196" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="240" y="202" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>

  <!-- depth connector lines -->
  <path d="M 120 130 L 150 110" stroke="#4a8edb" stroke-width="0.9" fill="none" filter="url(#sk)"/>
  <path d="M 270 130 L 300 110" stroke="#4a8edb" stroke-width="0.9" fill="none" filter="url(#sk)"/>
  <path d="M 270 220 L 300 200" stroke="#4a8edb" stroke-width="0.9" fill="none" filter="url(#sk)"/>

  <text x="300" y="246" font-size="10" fill="#888">idx = (i·M + j)·K + k</text>

  <!-- flatten arrow -->
  <path d="M 200 236 L 200 270" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="264" font-size="11" fill="#7a5415">展平 row-major</text>

  <!-- 1D flattened -->
  <text x="60" y="288" font-size="12" font-weight="bold" fill="#2b6e9e">展平为 1D：total = N × M × K 个元素（务必用 size_t）</text>
  <g filter="url(#sk)">
    <rect x="80" y="298" width="50" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="130" y="298" width="50" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="180" y="298" width="50" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="230" y="298" width="50" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="280" y="298" width="50" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="330" y="298" width="50" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="105" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="155" y="319" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="205" y="319" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="255" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="305" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="355" y="319" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="390" y="319" font-size="10" fill="#aaa">... 共 N·M·K</text>

  <!-- predicate arrow -->
  <path d="M 200 336 L 200 362" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="358" font-size="11" fill="#7a5415">predicate：input[i] == P ?</text>

  <!-- predicate row -->
  <text x="60" y="380" font-size="12" font-weight="bold" fill="#7a5415">逐元素判定：等于 P 记 1，否则记 0</text>
  <g filter="url(#sk)">
    <rect x="80" y="388" width="50" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="130" y="388" width="50" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="180" y="388" width="50" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="230" y="388" width="50" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="280" y="388" width="50" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="330" y="388" width="50" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="105" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="155" y="408" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="205" y="408" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="255" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="305" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="355" y="408" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- reduce arrow -->
  <path d="M 200 424 L 200 446" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="442" font-size="11" fill="#2e6e2e">归约求和 Σ</text>

  <!-- output -->
  <g filter="url(#sk)">
    <rect x="80" y="450" width="120" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="140" y="468" text-anchor="middle" font-size="11" fill="#2e6e2e">output[0]</text>
  <text x="140" y="484" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">= 3</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="480" y="120" width="400" height="190" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="498" y="144" font-size="12" font-weight="bold" fill="#444">💡 核心洞察</text>
  <text x="498" y="166" font-size="11" fill="#444">3D 体数据在内存中本就是 row-major</text>
  <text x="498" y="182" font-size="11" fill="#444">一维连续存储，故"3D 计数"本质与</text>
  <text x="498" y="198" font-size="11" fill="#444">2D/1D 计数同构——展平后直接复用</text>
  <text x="498" y="214" font-size="11" fill="#444">predicate + 两级归约模板。</text>
  <text x="498" y="240" font-size="11" font-weight="bold" fill="#b85450">3D 新增工程细节：</text>
  <text x="498" y="256" font-size="11" fill="#b85450">① total = (size_t)N*M*K 防溢出</text>
  <text x="498" y="272" font-size="11" fill="#b85450">② 朴素 3D grid 须 threadIdx.x→K</text>
  <text x="498" y="288" font-size="11" fill="#b85450">   保证合并访存（最内层连续）</text>

  <!-- performance callout -->
  <g filter="url(#sk)">
    <rect x="480" y="330" width="400" height="150" rx="8" fill="#fff5f5" stroke="#b85450" stroke-dasharray="5 3"/>
  </g>
  <text x="498" y="354" font-size="12" font-weight="bold" fill="#b85450">⚠ 性能测试：N=M=K=500</text>
  <text x="498" y="376" font-size="11" fill="#b85450">total = 1.25 亿元素</text>
  <text x="498" y="394" font-size="11" fill="#b85450">P=2, 值域{1,2} → 50% 命中</text>
  <text x="498" y="412" font-size="11" fill="#b85450">≈ 6250 万次 atomicAdd 撞同一地址</text>
  <text x="498" y="430" font-size="11" fill="#b85450">→ 硬件串行化，比归约慢 20x+</text>
  <text x="498" y="452" font-size="11" font-weight="bold" fill="#2e6e2e">归约版：零 global atomic，2.5 ms</text>
  <text x="498" y="470" font-size="11" fill="#2e6e2e">瓶颈干净落在读带宽 ≈ 187 GB/s</text>
</svg>
