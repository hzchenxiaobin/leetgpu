<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">Multi-Head Cross-Attention：Q(M,H,D) × K(N,H,D)</text>
  <path d="M 220 40 Q 360 48 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#888">grid=(H, M)，每 block 一个 (m,h) 对；online softmax 扫描 N 个 key，S/P 不物化</text>

  <!-- ===== Left: input layouts ===== -->
  <text x="130" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">输入张量布局（行主序）</text>

  <!-- Q: (M,H,D) -->
  <g filter="url(#sk)">
    <rect x="40" y="92" width="180" height="60" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="130" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">Q [M, H, D]</text>
  <text x="130" y="126" text-anchor="middle" font-size="9" fill="#555">Q[m,h,d] = Q[((m·H)+h)·D + d]</text>
  <text x="130" y="140" text-anchor="middle" font-size="9" fill="#888">M 个 query，每 query H 组 D 维</text>

  <!-- K: (N,H,D) -->
  <g filter="url(#sk)">
    <rect x="40" y="162" width="180" height="60" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="130" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">K [N, H, D]</text>
  <text x="130" y="196" text-anchor="middle" font-size="9" fill="#555">K[n,h,d] = K[((n·H)+h)·D + d]</text>
  <text x="130" y="210" text-anchor="middle" font-size="9" fill="#888">N 个 key（≠ M，cross-attn 特征）</text>

  <!-- V: (N,H,D) -->
  <g filter="url(#sk)">
    <rect x="40" y="232" width="180" height="60" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="130" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">V [N, H, D]</text>
  <text x="130" y="266" text-anchor="middle" font-size="9" fill="#555">与 K 同形，stride = H·D</text>
  <text x="130" y="280" text-anchor="middle" font-size="9" fill="#888">key 维 N ≠ query 维 M</text>

  <!-- arrow to middle -->
  <path d="M 226 182 L 280 182" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Middle: grid mapping ===== -->
  <text x="380" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">grid = (H, M) block 映射</text>

  <!-- grid of blocks: H columns x M rows (drawn small) -->
  <g filter="url(#sk)">
    <!-- header H -->
    <text x="320" y="104" text-anchor="middle" font-size="9" fill="#4a8edb" font-weight="bold">h=0</text>
    <text x="360" y="104" text-anchor="middle" font-size="9" fill="#4a8edb" font-weight="bold">h=1</text>
    <text x="400" y="104" text-anchor="middle" font-size="9" fill="#4a8edb" font-weight="bold">…</text>
    <text x="440" y="104" text-anchor="middle" font-size="9" fill="#4a8edb" font-weight="bold">H-1</text>
    <!-- row labels M -->
    <text x="306" y="124" text-anchor="end" font-size="9" fill="#4a8e4a" font-weight="bold">m=0</text>
    <text x="306" y="148" text-anchor="end" font-size="9" fill="#4a8e4a" font-weight="bold">m=1</text>
    <text x="306" y="172" text-anchor="end" font-size="9" fill="#4a8e4a" font-weight="bold">…</text>
    <text x="306" y="196" text-anchor="end" font-size="9" fill="#4a8e4a" font-weight="bold">M-1</text>
    <!-- blocks -->
    <rect x="310" y="112" width="36" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="350" y="112" width="36" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="390" y="112" width="36" height="24" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="2,2"/>
    <rect x="430" y="112" width="36" height="24" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="310" y="136" width="36" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="350" y="136" width="36" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="390" y="136" width="36" height="24" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="2,2"/>
    <rect x="430" y="136" width="36" height="24" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="310" y="160" width="36" height="24" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="2,2"/>
    <rect x="350" y="160" width="36" height="24" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="2,2"/>
    <rect x="390" y="160" width="36" height="24" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="2,2"/>
    <rect x="430" y="160" width="36" height="24" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="2,2"/>
    <rect x="310" y="184" width="36" height="24" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.1"/>
    <rect x="350" y="184" width="36" height="24" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.1"/>
    <rect x="390" y="184" width="36" height="24" rx="3" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="2,2"/>
    <rect x="430" y="184" width="36" height="24" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.1"/>
  </g>
  <text x="380" y="222" text-anchor="middle" font-size="9" fill="#888">blockIdx.x = h, blockIdx.y = m</text>
  <text x="380" y="236" text-anchor="middle" font-size="9" fill="#888">共 H×M 个 block，各自独立</text>

  <!-- ===== Right: per-block online softmax scan ===== -->
  <path d="M 476 160 L 510 160" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">每 block 内：遍历 n=0..N-1，online softmax</text>

  <g filter="url(#sk)">
    <rect x="520" y="92" width="170" height="56" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <text x="605" y="110" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">① s = Q[m,h]·K[n,h] / √D</text>
  <text x="605" y="124" text-anchor="middle" font-size="9" fill="#888">block_reduce_sum（D 维点积）</text>
  <text x="605" y="138" text-anchor="middle" font-size="9" fill="#888">thread 0 算出标量 score</text>

  <g filter="url(#sk)">
    <rect x="520" y="156" width="170" height="56" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="3,2"/>
  </g>
  <text x="605" y="174" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">② 更新 (m, l, O)</text>
  <text x="605" y="188" text-anchor="middle" font-size="9" fill="#888">α=exp(m_old−m_new), p=exp(s−m_new)</text>
  <text x="605" y="202" text-anchor="middle" font-size="9" fill="#888">O ← O·α + V[n,h]·p（广播 α/β）</text>

  <g filter="url(#sk)">
    <rect x="520" y="220" width="170" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="605" y="240" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">③ output[m,h] = O</text>
  <text x="605" y="254" text-anchor="middle" font-size="9" fill="#888">已归一化（α+β=1），无需 /l</text>

  <!-- deps arrows -->
  <path d="M 605 148 L 605 154" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 605 212 L 605 218" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Bottom: key difference vs self-attention ===== -->
  <text x="360" y="296" text-anchor="middle" font-size="12" fill="#888">与 Self-Attention 的关键差异</text>
  <g filter="url(#sk)">
    <rect x="40" y="308" width="300" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="190" y="326" text-anchor="middle" font-size="10" fill="#4a8edb" font-weight="bold">Self-Attention (#12 MHA)</text>
  <text x="190" y="342" text-anchor="middle" font-size="9" fill="#555">Q,K,V 同形 (B,H,N,d)，M=N</text>
  <text x="190" y="356" text-anchor="middle" font-size="9" fill="#555">grid=(B,H,N_tile)，三重并行</text>

  <g filter="url(#sk)">
    <rect x="360" y="308" width="300" height="56" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.1"/>
  </g>
  <text x="510" y="326" text-anchor="middle" font-size="10" fill="#c98a2b" font-weight="bold">Cross-Attention (#26)</text>
  <text x="510" y="342" text-anchor="middle" font-size="9" fill="#555">Q(M,H,D), K,V(N,H,D)，M≠N</text>
  <text x="510" y="356" text-anchor="middle" font-size="9" fill="#555">grid=(H,M)，decoder→encoder</text>

  <!-- ===== Bottom formula ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="380" width="620" height="60" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="4,3"/>
  </g>
  <text x="350" y="402" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">output[m,h] = softmax(Q[m,h]·K[:,h]ᵀ / √D) · V[:,h]</text>
  <text x="350" y="420" text-anchor="middle" font-size="10" fill="#666">online softmax：m_new=max(m,s), l_new=l·exp(m−m_new)+exp(s−m_new), O←O·α+V·p</text>
  <text x="350" y="434" text-anchor="middle" font-size="9" fill="#888">stride = H·D（head 维内层连续，便于 D 维 coalesced）</text>
</svg>
