<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="940" height="500" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Worked Example：N=4, keys=[1,2,3,0]，两趟即可排好</text>
  <path d="M 280 40 Q 470 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ LEFT: pass bit0 ============ -->
  <text x="30" y="74" font-size="14" font-weight="bold" fill="#2b6e9e">趟 b=0（LSB）</text>
  <text x="180" y="74" font-size="11" fill="#888">1 block, excl0=0, totalZ=2</text>

  <!-- keys -->
  <text x="30" y="104" font-size="11" fill="#444">key</text>
  <g filter="url(#sk)">
    <rect x="70" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="116" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="162" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="208" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="92" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="138" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="184" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">3</text>
  <text x="230" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">0</text>

  <!-- bit0 -->
  <text x="30" y="138" font-size="11" fill="#444">bit0</text>
  <g filter="url(#sk)">
    <rect x="70" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="116" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="162" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="208" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="92" y="140" text-anchor="middle" font-size="11" fill="#7a5415">1</text>
  <text x="138" y="140" text-anchor="middle" font-size="11" fill="#7a5415">0</text>
  <text x="184" y="140" text-anchor="middle" font-size="11" fill="#7a5415">1</text>
  <text x="230" y="140" text-anchor="middle" font-size="11" fill="#7a5415">0</text>

  <!-- pred0 -->
  <text x="30" y="172" font-size="11" fill="#444">pred0</text>
  <g filter="url(#sk)">
    <rect x="70" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
    <rect x="116" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
    <rect x="162" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
    <rect x="208" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
  </g>
  <text x="92" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">0</text>
  <text x="138" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">1</text>
  <text x="184" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">0</text>
  <text x="230" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">1</text>

  <!-- rank0 -->
  <text x="30" y="206" font-size="11" fill="#444">rank0</text>
  <g filter="url(#sk)">
    <rect x="70" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="116" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="162" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="208" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="92" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">0</text>
  <text x="138" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">0</text>
  <text x="184" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">1</text>
  <text x="230" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">1</text>
  <text x="266" y="208" font-size="11" fill="#888">= excl_scan(pred0)</text>

  <path d="M 160 224 L 160 250" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="244" font-size="10" fill="#7a5415">bit0=0→excl0+rank0；bit0=1→totalZ+(tid−rank0)</text>

  <!-- output bit0 -->
  <text x="30" y="280" font-size="11" fill="#444">out</text>
  <g filter="url(#sk)">
    <rect x="70" y="264" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="116" y="264" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="166" y="263" width="2" height="28" fill="#b85450"/>
    <rect x="172" y="264" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="218" y="264" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="92" y="282" text-anchor="middle" font-size="11" fill="#2e6e2e">2</text>
  <text x="138" y="282" text-anchor="middle" font-size="11" fill="#2e6e2e">0</text>
  <text x="194" y="282" text-anchor="middle" font-size="11" fill="#7a5415">1</text>
  <text x="240" y="282" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <text x="70" y="306" font-size="10" fill="#2e6e2e">↑ bit0=0 段（保序）</text>
  <text x="172" y="306" font-size="10" fill="#7a5415">↑ bit0=1 段（保序）</text>

  <!-- ============ RIGHT: pass bit1 ============ -->
  <text x="490" y="74" font-size="14" font-weight="bold" fill="#2b6e9e">趟 b=1</text>
  <text x="640" y="74" font-size="11" fill="#888">输入 = 上一趟输出</text>

  <text x="490" y="104" font-size="11" fill="#444">key</text>
  <g filter="url(#sk)">
    <rect x="530" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="576" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="622" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="668" y="88" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="552" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">2</text>
  <text x="598" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">0</text>
  <text x="644" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">1</text>
  <text x="690" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">3</text>

  <text x="490" y="138" font-size="11" fill="#444">bit1</text>
  <g filter="url(#sk)">
    <rect x="530" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="576" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="622" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="668" y="122" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="552" y="140" text-anchor="middle" font-size="11" fill="#7a5415">1</text>
  <text x="598" y="140" text-anchor="middle" font-size="11" fill="#7a5415">0</text>
  <text x="644" y="140" text-anchor="middle" font-size="11" fill="#7a5415">0</text>
  <text x="690" y="140" text-anchor="middle" font-size="11" fill="#7a5415">1</text>

  <text x="490" y="172" font-size="11" fill="#444">pred0</text>
  <g filter="url(#sk)">
    <rect x="530" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
    <rect x="576" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
    <rect x="622" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
    <rect x="668" y="156" width="44" height="26" rx="4" fill="#eef2f7" stroke="#9bb6d6" stroke-width="1.1"/>
  </g>
  <text x="552" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">0</text>
  <text x="598" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">1</text>
  <text x="644" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">1</text>
  <text x="690" y="174" text-anchor="middle" font-size="11" fill="#5a5a5a">0</text>

  <text x="490" y="206" font-size="11" fill="#444">rank0</text>
  <g filter="url(#sk)">
    <rect x="530" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="576" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="622" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="668" y="190" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="552" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">0</text>
  <text x="598" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">0</text>
  <text x="644" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">1</text>
  <text x="690" y="208" text-anchor="middle" font-size="11" fill="#2e6e2e">2</text>
  <text x="726" y="208" font-size="11" fill="#888">total0=2</text>

  <path d="M 620 224 L 620 250" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="630" y="244" font-size="10" fill="#7a5415">同公式：0→excl0+rank0，1→totalZ+(tid−rank0)</text>

  <text x="490" y="280" font-size="11" fill="#444">out</text>
  <g filter="url(#sk)">
    <rect x="530" y="264" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="576" y="264" width="44" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="626" y="263" width="2" height="28" fill="#b85450"/>
    <rect x="632" y="264" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="678" y="264" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="552" y="282" text-anchor="middle" font-size="11" fill="#2e6e2e">0</text>
  <text x="598" y="282" text-anchor="middle" font-size="11" fill="#2e6e2e">1</text>
  <text x="654" y="282" text-anchor="middle" font-size="11" fill="#7a5415">2</text>
  <text x="700" y="282" text-anchor="middle" font-size="11" fill="#7a5415">3</text>

  <!-- final result banner -->
  <g filter="url(#sk)">
    <rect x="30" y="340" width="880" height="120" rx="10" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="470" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">✓ 两趟后已升序：[0,1,2,3]（高位趟 bit2..31 全为 0，pred0 全 1，原序不动）</text>
  <text x="470" y="392" text-anchor="middle" font-size="12" fill="#444">每趟把“bit=0 的元素”稳定地搬到左侧 [0, totalZ)、</text>
  <text x="470" y="410" text-anchor="middle" font-size="12" fill="#444">“bit=1 的元素”稳定地搬到右侧 [totalZ, N)。</text>
  <text x="470" y="436" text-anchor="middle" font-size="12" fill="#b85450">从 LSB→MSB 共 32 趟即得完整 uint32 升序；稳定性保证低位序不被高位趟破坏。</text>
  <text x="470" y="454" text-anchor="middle" font-size="11" fill="#888">rank1 = tid − rank0：因 pred0 为 0/1，1 的前缀数 = 位置数 − 0 的前缀数，省掉第二次 scan。</text>
</svg>
