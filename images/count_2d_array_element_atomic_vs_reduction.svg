    <rect x="150" y="290" width="120" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="210" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">output[0]</text>
  <text x="210" y="330" text-anchor="middle" font-size="11" fill="#b85450">单地址 · 硬件串行化</text>

  <!-- problem callout -->
