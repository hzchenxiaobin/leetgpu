<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">朴素 atomicAdd（写冲突）vs 两级归约（无冲突）</text>
  <path d="M 250 42 Q 460 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- divider -->
  <path d="M 460 64 L 460 460" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>

  <!-- ============ LEFT: atomic ============ -->
  <text x="220" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">朴素版：每个命中线程 atomicAdd(&amp;output[0], 1)</text>

