    <rect x="50" y="360" width="340" height="96" rx="8" fill="#fff5f5" stroke="#b85450" stroke-dasharray="5 3"/>
  </g>
  <text x="68" y="384" font-size="12" font-weight="bold" fill="#b85450">⚠ 性能测试 K=1, 值域{1,2}</text>
  <text x="68" y="404" font-size="11" fill="#b85450">50% 命中 ≈ 5000 万次 atomicAdd</text>
  <text x="68" y="422" font-size="11" fill="#b85450">全部撞在 output[0] 同一地址</text>
  <text x="68" y="442" font-size="11" font-weight="bold" fill="#b85450">→ SM 大量空转，比归约慢 10x+</text>

