<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Row-parallel SpMM：一行 A → 一个 warp/block</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">每行独立处理，warp 内 threads 分摊 K 维，对非零元做 scaled B 行累加</text>

  <!-- ===== Step 1: Dense to CSR ===== -->
  <rect x="20" y="58" width="600" height="130" fill="#e8f0fe" fill-opacity="0.2" stroke="#446688" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="78" font-size="12" fill="#446688" font-weight="bold">Step 1: 密集 A → CSR 三元组（kernel 内即时转换或预处理）</text>

  <!-- Dense A -->
  <rect x="40" y="88" width="140" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="106" text-anchor="middle" font-size="9" fill="#446688">A (dense, M×N)</text>
  <text x="110" y="124" text-anchor="middle" font-size="8" fill="#888">2 0 0 1 0 3 ...</text>
  <text x="110" y="140" text-anchor="middle" font-size="8" fill="#888">0 3 0 0 4 0 ...</text>
  <text x="110" y="156" text-anchor="middle" font-size="8" fill="#888">含大量 0</text>

  <!-- Arrow -->
  <line x1="185" y1="128" x2="215" y2="128" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="120" text-anchor="middle" font-size="8" fill="#888">压缩</text>

  <!-- CSR -->
  <rect x="220" y="88" width="160" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="106" text-anchor="middle" font-size="9" fill="#d6a040">CSR 三元组</text>
  <text x="230" y="124" font-size="8" fill="#d6a040">values: [2, 1, 3, 4, ...]</text>
  <text x="230" y="140" font-size="8" fill="#d6a040">col_idx: [0, 3, 1, 2, ...]</text>
  <text x="230" y="156" font-size="8" fill="#d6a040">row_ptr: [0, 2, 3, 4, ...]</text>

  <text x="410" y="120" font-size="9" fill="#888">row_ptr[i] 到 row_ptr[i+1]</text>
  <text x="410" y="136" font-size="9" fill="#888">= 第 i 行的非零元范围</text>
  <text x="410" y="152" font-size="9" fill="#888">仅存非零元，省内存</text>

  <!-- Arrow down -->
  <line x1="300" y1="172" x2="300" y2="184" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Row-parallel kernel ===== -->
  <rect x="20" y="186" width="600" height="140" fill="#e6f4ea" fill-opacity="0.2" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="206" font-size="12" fill="#4a7a3a" font-weight="bold">Step 2: 每行一个 warp，遍历非零元 × B 行 → 累加到 C 行</text>

  <!-- Row 0 -->
  <rect x="35" y="216" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="236" text-anchor="middle" font-size="9" fill="#446688">Warp 0: A row 0</text>

  <rect x="225" y="216" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">values[0:2] × B[col_idx[0:2], :]</text>

  <rect x="415" y="216" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="236" text-anchor="middle" font-size="9" fill="#d6a040">→ C[0, :]</text>

  <!-- Row 1 -->
  <rect x="35" y="252" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="272" text-anchor="middle" font-size="9" fill="#446688">Warp 1: A row 1</text>

  <rect x="225" y="252" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a">values[2:3] × B[col_idx[2:3], :]</text>

  <rect x="415" y="252" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="272" text-anchor="middle" font-size="9" fill="#d6a040">→ C[1, :]</text>

  <!-- Row 2 -->
  <rect x="35" y="288" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="308" text-anchor="middle" font-size="9" fill="#446688">Warp 2: A row 2</text>

  <rect x="225" y="288" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="308" text-anchor="middle" font-size="9" fill="#4a7a3a">values[3:4] × B[col_idx[3:4], :]</text>

  <rect x="415" y="288" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="308" text-anchor="middle" font-size="9" fill="#d6a040">→ C[2, :]</text>

  <!-- Arrow down -->
  <line x1="300" y1="328" x2="300" y2="340" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== K-dimension parallelism ===== -->
  <rect x="20" y="342" width="600" height="68" fill="#fff8e1" fill-opacity="0.2" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="362" font-size="12" fill="#d6a040" font-weight="bold">K 维并行：warp 内 32 threads 分摊 K 列</text>

  <text x="35" y="382" font-size="10" fill="#333">每 thread 负责 ⌈K/32⌉ 个输出列：C[i, j] += val × B[col, j]</text>
  <text x="35" y="398" font-size="10" fill="#333">B[col, :] 整行被 warp 共享（coalesced 读）→ 缓存友好</text>

  <!-- ===== Key insight ===== -->
  <rect x="20" y="420" width="600" height="48" fill="#fce4ec" fill-opacity="0.2" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="440" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">两级并行：行间（warp 间）完全独立 + 行内 K 维（warp 内 threads）并行</text>
  <text x="320" y="458" text-anchor="middle" font-size="10" fill="#888">非零元数不均匀时可能 load imbalance → 可用 row-splitting 平衡</text>
</svg>
