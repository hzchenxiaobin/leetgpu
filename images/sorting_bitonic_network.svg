<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
  </defs>
  <rect width="900" height="500" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Bitonic 网络逐步演算（P=8）：size 翻倍造序列、stride 减半做归并</text>
  <path d="M 260 40 Q 450 48 640 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 8 columns: x = 90,180,270,360,450,540,630,720 -->
  <!-- Row: input (y box 50-76) -->
  <text x="40" y="68" font-size="12" font-weight="bold" fill="#2b6e9e">输入</text>
  <g filter="url(#sk)" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <rect x="74" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="90" y="68">5</text>
    <rect x="164" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="180" y="68">2</text>
    <rect x="254" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="270" y="68">8</text>
    <rect x="344" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="360" y="68">1</text>
    <rect x="434" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="450" y="68">9</text>
    <rect x="524" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="540" y="68">4</text>
    <rect x="614" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="630" y="68">7</text>
    <rect x="704" y="50" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/><text x="720" y="68">6</text>
  </g>

  <!-- k=2, j=1: pairs (0,1)(2,3)(4,5)(6,7) connectors at y=92 -->
  <text x="40" y="116" font-size="11" font-weight="bold" fill="#7a5415">size=2</text>
  <text x="40" y="130" font-size="10" fill="#888">stride=1</text>
  <g stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#sk)">
    <path d="M90 92 L180 92"/><path d="M270 92 L360 92"/><path d="M450 92 L540 92"/><path d="M630 92 L720 92"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <rect x="74" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="90" y="118">2</text>
    <rect x="164" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="180" y="118">5</text>
    <rect x="254" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="270" y="118">8</text>
    <rect x="344" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="360" y="118">1</text>
    <rect x="434" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="450" y="118">4</text>
    <rect x="524" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="540" y="118">9</text>
    <rect x="614" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="630" y="118">7</text>
    <rect x="704" y="100" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="720" y="118">6</text>
  </g>

  <!-- k=4, j=2: pairs (0,2)(1,3)(4,6)(5,7) connectors y=142 -->
  <text x="40" y="166" font-size="11" font-weight="bold" fill="#7a5415">size=4</text>
  <text x="40" y="180" font-size="10" fill="#888">stride=2</text>
  <g stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#sk)">
    <path d="M90 142 L270 142"/><path d="M180 142 L360 142"/><path d="M450 142 L630 142"/><path d="M540 142 L720 142"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <rect x="74" y="150" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="90" y="168">2</text>
    <rect x="164" y="150" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="180" y="168">1</text>
    <rect x="254" y="150" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="270" y="168">8</text>
    <rect x="344" y="150" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="360" y="168">5</text>
    <rect x="434" y="150" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="450" y="168">7</text>
    <rect x="524" y="150" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="540" y="168">9</text>
    <rect x="614" y="150" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="630" y="168">4</text>
