  <g filter="url(#sk)">
    <rect x="40" y="456" width="820" height="34" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="478" font-size="11" fill="#444">每根连线 = 一次 compare-swap：partner = i ⊕ stride，方向由 (i &amp; size)==0 决定（升/降交替）。size 翻倍造 bitonic，stride 减半做 merge。</text>
</svg>
