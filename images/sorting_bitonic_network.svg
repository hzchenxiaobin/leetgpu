  <g stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#sk)">
    <path d="M90 192 L180 192"/><path d="M270 192 L360 192"/><path d="M450 192 L540 192"/><path d="M630 192 L720 192"/>
