    <rect x="164" y="200" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="180" y="218">2</text>
    <rect x="254" y="200" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="270" y="218">5</text>
    <rect x="344" y="200" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="360" y="218">8</text>
    <rect x="434" y="200" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="450" y="218">9</text>
    <rect x="524" y="200" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="540" y="218">7</text>
    <rect x="614" y="200" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="630" y="218">6</text>
    <rect x="704" y="200" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/><text x="720" y="218">4</text>
  </g>
  <text x="430" y="244" font-size="10" fill="#888" text-anchor="middle">↑ 前半 size=4 升序 {1,2,5,8}，后半降序 {9,7,6,4} → 拼成 bitonic 序列</text>

  <!-- k=8, j=4: pairs (0,4)(1,5)(2,6)(3,7) connectors y=262 -->
  <text x="40" y="286" font-size="11" font-weight="bold" fill="#b85450">size=8</text>
  <text x="40" y="300" font-size="10" fill="#888">stride=4</text>
  <g stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)">
    <path d="M90 262 L450 262"/><path d="M180 262 L540 262"/><path d="M270 262 L630 262"/><path d="M360 262 L720 262"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <rect x="74" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="90" y="288">1</text>
    <rect x="164" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="180" y="288">2</text>
    <rect x="254" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="270" y="288">5</text>
    <rect x="344" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="360" y="288">4</text>
    <rect x="434" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="450" y="288">9</text>
    <rect x="524" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="540" y="288">7</text>
    <rect x="614" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="630" y="288">6</text>
    <rect x="704" y="270" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/><text x="720" y="288">8</text>
  </g>

  <!-- k=8, j=2: pairs (0,2)(1,3)(4,6)(5,7) connectors y=312 -->
  <text x="40" y="336" font-size="10" fill="#888">stride=2</text>
  <g stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)">
    <path d="M90 312 L270 312"/><path d="M180 312 L360 312"/><path d="M450 312 L630 312"/><path d="M540 312 L720 312"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <rect x="74" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="90" y="338">1</text>
    <rect x="164" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="180" y="338">2</text>
    <rect x="254" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="270" y="338">5</text>
    <rect x="344" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="360" y="338">4</text>
    <rect x="434" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="450" y="338">6</text>
    <rect x="524" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="540" y="338">7</text>
    <rect x="614" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="630" y="338">9</text>
    <rect x="704" y="320" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="720" y="338">8</text>
  </g>

  <!-- k=8, j=1: pairs (0,1)(2,3)(4,5)(6,7) connectors y=362 -->
  <text x="40" y="386" font-size="10" fill="#888">stride=1</text>
  <g stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)">
    <path d="M90 362 L180 362"/><path d="M270 362 L360 362"/><path d="M450 362 L540 362"/><path d="M630 362 L720 362"/>
  </g>
  <g filter="url(#sk)" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <rect x="74" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="90" y="388">1</text>
    <rect x="164" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="180" y="388">2</text>
    <rect x="254" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="270" y="388">4</text>
    <rect x="344" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="360" y="388">5</text>
    <rect x="434" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="450" y="388">6</text>
    <rect x="524" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="540" y="388">7</text>
    <rect x="614" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="630" y="388">8</text>
    <rect x="704" y="370" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/><text x="720" y="388">9</text>
  </g>

  <!-- result -->
  <text x="40" y="430" font-size="12" font-weight="bold" fill="#2e6e2e">结果</text>
  <g filter="url(#sk)" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <rect x="74" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="90" y="432">1</text>
    <rect x="164" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="180" y="432">2</text>
    <rect x="254" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="270" y="432">4</text>
    <rect x="344" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="360" y="432">5</text>
    <rect x="434" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="450" y="432">6</text>
    <rect x="524" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="540" y="432">7</text>
    <rect x="614" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="630" y="432">8</text>
    <rect x="704" y="414" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/><text x="720" y="432">9</text>
