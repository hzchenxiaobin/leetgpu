<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">INT4 Nibble 解包：1 byte → 2 个权重</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">高 4 位 (bits 7:4) = w[2i]，低 4 位 (bits 3:0) = w[2i+1]，无符号存储减偏移 8</text>

  <!-- ===== Byte layout ===== -->
  <text x="30" y="78" font-size="12" fill="#444" font-weight="bold">① 一个 byte 的位布局</text>

  <!-- 8 bit cells -->
  <rect x="120" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="200" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="88" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="280" y="88" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="320" y="88" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="360" y="88" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="400" y="88" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <text x="180" y="82" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">高 nibble (bits 7:4)</text>
  <text x="340" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">低 nibble (bits 3:0)</text>

  <text x="140" y="111" text-anchor="middle" font-size="10" fill="#d6a040">b7</text>
  <text x="180" y="111" text-anchor="middle" font-size="10" fill="#d6a040">b6</text>
  <text x="220" y="111" text-anchor="middle" font-size="10" fill="#d6a040">b5</text>
  <text x="260" y="111" text-anchor="middle" font-size="10" fill="#d6a040">b4</text>
  <text x="300" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a">b3</text>
  <text x="340" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a">b2</text>
  <text x="380" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a">b1</text>
  <text x="420" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a">b0</text>

  <text x="470" y="111" font-size="10" fill="#888">= w_q[n, i]</text>

  <!-- ===== Unpack high ===== -->
  <text x="30" y="148" font-size="12" fill="#d6a040" font-weight="bold">② 解包高 nibble: (byte &gt;&gt; 4) &amp; 0xF → w[2i]</text>

  <rect x="120" y="158" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#d6a040" font-family="monospace">uint8_t hi = (w_q[i] &gt;&gt; 4) &amp; 0x0F;  // 0..15</text>

  <line x1="280" y1="196" x2="280" y2="206" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="210" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">int8_t signed_hi = (int)hi - 8;  // -8..7</text>

  <!-- ===== Unpack low ===== -->
  <text x="30" y="266" font-size="12" fill="#4a7a3a" font-weight="bold">③ 解包低 nibble: byte &amp; 0xF → w[2i+1]</text>

  <rect x="120" y="276" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="monospace">uint8_t lo = w_q[i] &amp; 0x0F;  // 0..15</text>

  <line x1="280" y1="314" x2="280" y2="324" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="328" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">int8_t signed_lo = (int)lo - 8;  // -8..7</text>

  <!-- ===== Dequant with scale ===== -->
  <text x="30" y="386" font-size="12" fill="#446688" font-weight="bold">④ 乘以分组 scale → FP16 权重</text>

  <rect x="60" y="396" width="520" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="418" text-anchor="middle" font-size="11" fill="#446688" font-family="monospace">__half w = __float2half((float)(nibble - 8) * __half2float(scale[k / group_size]))</text>

  <!-- ===== Example ===== -->
  <rect x="30" y="438" width="580" height="18" fill="#fff8e1" fill-opacity="0.3" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="320" y="451" text-anchor="middle" font-size="9" fill="#d6a040">例: byte=0x99 → hi=9, lo=9 → signed=1, 1 → ×scale 0.5 → W=0.5, 0.5</text>
</svg>
