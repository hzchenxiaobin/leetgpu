<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Worked Example: 3×4 稀疏 A × 4×2 稠密 B</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">逐行推演 SpMM 的 scaled accumulation 过程</text>

  <!-- ===== Inputs ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">A (3×4):</text>
  <text x="80" y="72" font-size="10" fill="#333">[[2, 0, 0, 1], [0, 3, 0, 0], [0, 0, 4, 0]]</text>
  <text x="380" y="72" font-size="10" fill="#888">nnz = 4 (非零: A[0,0], A[0,3], A[1,1], A[2,2])</text>

  <text x="30" y="92" font-size="11" fill="#4a7a3a" font-weight="bold">B (4×2):</text>
  <text x="80" y="92" font-size="10" fill="#333">[[1, 2], [3, 4], [5, 6], [7, 8]]</text>

  <!-- ===== Row 0 ===== -->
  <text x="30" y="122" font-size="12" fill="#d6a040" font-weight="bold">Row 0: A[0,:] = [2, 0, 0, 1]</text>

  <rect x="20" y="130" width="600" height="80" fill="#e8f0fe" fill-opacity="0.15" stroke="#446688" stroke-width="0.8" rx="4" filter="url(#rough2)"/>

  <text x="30" y="150" font-size="10" fill="#333">非零元: A[0,0]=2 (col=0), A[0,3]=1 (col=3)</text>

  <text x="30" y="170" font-size="10" fill="#446688">C[0,:] = 2 × B[0,:] + 1 × B[3,:]</text>
  <text x="30" y="186" font-size="10" fill="#4a7a3a">       = 2 × [1, 2] + 1 × [7, 8]</text>
  <text x="30" y="202" font-size="10" fill="#d6a040" font-weight="bold">       = [2, 4] + [7, 8] = [9, 12] ✓</text>

  <text x="400" y="170" font-size="9" fill="#888">(跳过 A[0,1]=0, A[0,2]=0)</text>
  <text x="400" y="186" font-size="9" fill="#888">省 2 次 B 行读取 + 2 次 FMA</text>

  <!-- ===== Row 1 ===== -->
  <text x="30" y="232" font-size="12" fill="#d6a040" font-weight="bold">Row 1: A[1,:] = [0, 3, 0, 0]</text>

  <rect x="20" y="240" width="600" height="64" fill="#e6f4ea" fill-opacity="0.15" stroke="#4a7a3a" stroke-width="0.8" rx="4" filter="url(#rough2)"/>

  <text x="30" y="260" font-size="10" fill="#333">非零元: A[1,1]=3 (col=1)</text>

  <text x="30" y="278" font-size="10" fill="#446688">C[1,:] = 3 × B[1,:]</text>
  <text x="30" y="294" font-size="10" fill="#d6a040" font-weight="bold">       = 3 × [3, 4] = [9, 12] ✓</text>

  <text x="400" y="278" font-size="9" fill="#888">(跳过 3 个零)</text>

  <!-- ===== Row 2 ===== -->
  <text x="30" y="324" font-size="12" fill="#d6a040" font-weight="bold">Row 2: A[2,:] = [0, 0, 4, 0]</text>

  <rect x="20" y="332" width="600" height="64" fill="#fff8e1" fill-opacity="0.15" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)"/>

  <text x="30" y="352" font-size="10" fill="#333">非零元: A[2,2]=4 (col=2)</text>

  <text x="30" y="370" font-size="10" fill="#446688">C[2,:] = 4 × B[2,:]</text>
  <text x="30" y="386" font-size="10" fill="#d6a040" font-weight="bold">       = 4 × [5, 6] = [20, 24] ✓</text>

  <!-- ===== Result ===== -->
  <text x="30" y="416" font-size="12" fill="#444" font-weight="bold">结果 C (3×2):</text>

  <rect x="120" y="426" width="200" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="448" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">[[9, 12],</text>
  <text x="220" y="466" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold"> [9, 12],</text>
  <text x="220" y="482" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold"> [20, 24]]</text>

  <!-- ===== Summary ===== -->
  <rect x="350" y="426" width="270" height="60" fill="#fce4ec" fill-opacity="0.15" stroke="#b85450" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="365" y="446" font-size="9" fill="#b85450" font-weight="bold">计算量对比</text>
  <text x="365" y="462" font-size="9" fill="#333">稠密: M×N×K = 3×4×2 = 24 FMA</text>
  <text x="365" y="476" font-size="9" fill="#333">稀疏: nnz×K = 4×2 = 8 FMA</text>
  <text x="365" y="488" font-size="9" fill="#4a7a3a" font-weight="bold">省 67% 计算 ✓</text>
</svg>
