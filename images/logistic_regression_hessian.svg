<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="14"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="740" height="460" fill="#fdfcf7"/>

  <text x="370" y="28" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold">hessian_kernel：tiled GEMM 带 W 行缩放</text>
  <text x="370" y="46" text-anchor="middle" font-size="11" fill="#888">H[j₁][j₂] = Σᵢ X[i][j₁]·W[i]·X[i][j₂] + l2·δ(j₁==j₂) —— Bsub 加载时乘 W</text>

  <!-- 左侧: X 和 W -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">X (n_samples × n_feat)</text>
  <rect x="40" y="84" width="130" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="100" font-size="9" fill="#888">kb+0</text>
  <rect x="72" y="92" width="86" height="52" fill="#d4e8fc" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="115" y="112" text-anchor="middle" font-size="9" fill="#446688">X[kb..][col]</text>
  <text x="115" y="126" text-anchor="middle" font-size="8" fill="#446688">TILE×TILE</text>
  <text x="115" y="138" text-anchor="middle" font-size="8" fill="#888">子块</text>
  <text x="50" y="164" font-size="9" fill="#888">kb+T</text>
  <rect x="72" y="152" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="115" y="176" text-anchor="middle" font-size="8" fill="#888">下一 tile</text>
  <text x="115" y="232" text-anchor="middle" font-size="8" fill="#888">沿 n_samples 滑动</text>

  <text x="190" y="78" font-size="11" fill="#4a7a3a" font-weight="bold">W</text>
  <rect x="186" y="84" width="28" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="8" fill="#4a7a3a">0.04</text>
  <text x="200" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a">0.07</text>
  <text x="200" y="168" text-anchor="middle" font-size="8" fill="#888">...</text>

  <!-- 中间: shared memory tiles -->
  <path d="M 170 140 L 230 110" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="104" font-size="8" fill="#888">加载</text>
  <path d="M 216 140 L 250 130" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="300" y="74" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">shared memory</text>
  <!-- Asub -->
  <rect x="240" y="84" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">Asub</text>
  <text x="280" y="116" text-anchor="middle" font-size="8" fill="#555">X[kb+kk][gi]</text>
  <text x="280" y="130" text-anchor="middle" font-size="8" fill="#555">列块 tile_i</text>
  <text x="280" y="146" text-anchor="middle" font-size="8" fill="#888">TILE×TILE</text>
  <text x="280" y="158" text-anchor="middle" font-size="8" fill="#888">只读</text>

  <!-- Bsub -->
  <rect x="340" y="84" width="80" height="80" fill="#fff3d0" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="100" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">Bsub</text>
  <text x="380" y="116" text-anchor="middle" font-size="8" fill="#555">W[row]·</text>
  <text x="380" y="128" text-anchor="middle" font-size="8" fill="#555">X[kb+kk][gj]</text>
  <text x="380" y="142" text-anchor="middle" font-size="8" fill="#555">列块 tile_j</text>
  <text x="380" y="156" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">×W 缩放!</text>

  <!-- 累加 -->
  <path d="M 322 124 L 338 124" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="116" text-anchor="middle" font-size="8" fill="#888">×</text>

  <!-- acc -->
  <rect x="440" y="100" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">acc</text>
  <text x="475" y="134" text-anchor="middle" font-size="8" fill="#555">+= Σ_kk</text>
  <text x="475" y="146" text-anchor="middle" font-size="8" fill="#555">A·B</text>
  <path d="M 422 124 L 438 124" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- kb 循环 -->
  <path d="M 475 152 L 475 178 L 280 178 L 280 166" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="174" text-anchor="middle" font-size="8" fill="#d6a040">kb += TILE (沿 n_samples 滑动)</text>

  <!-- 右侧: H 输出 -->
  <path d="M 512 124 L 548 110" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">H (n_feat × n_feat)</text>
  <rect x="548" y="84" width="140" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="548" y1="120" x2="688" y2="120" stroke="#4a7a3a" stroke-width="0.8"/>
  <line x1="548" y1="156" x2="688" y2="156" stroke="#4a7a3a" stroke-width="0.8"/>
  <line x1="548" y1="192" x2="688" y2="192" stroke="#4a7a3a" stroke-width="0.8"/>
  <line x1="618" y1="84" x2="618" y2="224" stroke="#4a7a3a" stroke-width="0.8"/>
  <!-- 高亮一个 TILE×TILE 子块 -->
  <rect x="548" y="84" width="70" height="36" fill="#d4f0d8" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="583" y="106" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">block(0,0)</text>
  <text x="583" y="218" text-anchor="middle" font-size="8" fill="#888">对角块 gi==gj 时 +l2</text>

  <!-- 下方: 与 OLS 对比 -->
  <rect x="40" y="250" width="660" height="180" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="12" fill="#2e6e2e" font-weight="bold">与 OLS gram_kernel 的对比 —— IRLS = 迭代加权最小二乘</text>

  <text x="56" y="294" font-size="10" fill="#444" font-weight="bold">OLS (W≡1):</text>
  <text x="160" y="294" font-size="10" fill="#444">Bsub[ty][tx] = X[row][cj]</text>
  <text x="380" y="294" font-size="10" fill="#888">→ H = XᵀX</text>

  <text x="56" y="314" font-size="10" fill="#444" font-weight="bold">IRLS (W=p(1-p)):</text>
  <text x="160" y="314" font-size="10" fill="#b85450" font-weight="bold">Bsub[ty][tx] = W[row] * X[row][cj]</text>
  <text x="430" y="314" font-size="10" fill="#888">→ H = Xᵀdiag(W)X</text>

  <line x1="56" y1="324" x2="684" y2="324" stroke="#4a8e4a" stroke-width="0.6" stroke-dasharray="3 2"/>

  <text x="56" y="344" font-size="10" fill="#444">• 唯一区别：Bsub 加载时多乘一个 W[row]（行缩放），无需额外存储 XW 矩阵</text>
  <text x="56" y="360" font-size="10" fill="#444">• W 每轮由 forward_kernel 重新计算，Hessian 随 β 更新而变化 —— 这是 IRLS 的核心</text>
  <text x="56" y="376" font-size="10" fill="#444">• l2 正则：对角元 H[j][j] += l2（gi==gj 时），保证 Hessian 正定</text>
  <text x="56" y="396" font-size="10" fill="#444">• tiling 复用：同一批 X 行被 tile_i 和 tile_j 列块各读一次，载入 shared 后 256 thread 复用</text>
  <text x="56" y="416" font-size="10" fill="#888">瓶颈：n_samples 大时 memory-bound（tiling 折叠归约维度）；n_feat 小时 kernel launch 主导</text>
</svg>
