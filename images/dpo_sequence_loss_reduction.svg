<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两级归约：warp shuffle → shared → atomicAdd</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">每线程 grid-stride 累加局部 loss → warp 内 5 步归约 → block 间 atomicAdd</text>

  <!-- ===== Thread-level: grid-stride ===== -->
  <text x="30" y="68" font-size="11" fill="#446688" font-weight="bold">① 每线程 grid-stride 累加</text>
  <rect x="30" y="76" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="94" text-anchor="middle" font-size="10" fill="#333">for (i = tid; i &lt; B; i += stride) { local_sum += softplus(-logits[i]); }</text>

  <line x1="280" y1="104" x2="280" y2="120" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Warp-level: shuffle ===== -->
  <text x="30" y="134" font-size="11" fill="#8a6d20" font-weight="bold">② warp 内 __shfl_down_sync 归约（5 步）</text>

  <!-- 8 lanes shown as circles -->
  <g font-size="9" fill="#333">
    <circle cx="80" cy="156" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="80" y="160" text-anchor="middle">l0</text>
    <circle cx="130" cy="156" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="130" y="160" text-anchor="middle">l1</text>
    <circle cx="180" cy="156" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="180" y="160" text-anchor="middle">l2</text>
    <circle cx="230" cy="156" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="160" text-anchor="middle">...</text>
    <circle cx="280" cy="156" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="280" y="160" text-anchor="middle">...</text>
    <circle cx="330" cy="156" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="330" y="160" text-anchor="middle">...</text>
    <circle cx="380" cy="156" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="380" y="160" text-anchor="middle">l30</text>
    <circle cx="430" cy="156" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="430" y="160" text-anchor="middle" font-weight="bold">l31</text>
  </g>

  <!-- shuffle arrows -->
  <line x1="80" y1="172" x2="430" y2="172" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="255" y="186" text-anchor="middle" font-size="9" fill="#888">offset=16→8→4→2→1，全部累加到 l31 → lane 0 持结果（经 down shuffle）</text>

  <line x1="280" y1="192" x2="280" y2="208" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Block-level: shared + final warp ===== -->
  <text x="30" y="222" font-size="11" fill="#2d5a1d" font-weight="bold">③ block 级：8 个 warp 总和 → shared → warp 0 最终归约</text>

  <!-- 8 warp sums -->
  <g font-size="9" fill="#333">
    <rect x="60" y="234" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="85" y="249" text-anchor="middle">w0</text>
    <rect x="120" y="234" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="145" y="249" text-anchor="middle">w1</text>
    <rect x="180" y="234" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="205" y="249" text-anchor="middle">w2</text>
    <rect x="240" y="234" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="265" y="249" text-anchor="middle">...</text>
    <rect x="300" y="234" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="325" y="249" text-anchor="middle">w6</text>
    <rect x="360" y="234" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="385" y="249" text-anchor="middle">w7</text>
  </g>
  <text x="440" y="249" font-size="9" fill="#888">→ shared[8]</text>

  <line x1="210" y1="256" x2="210" y2="272" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="274" width="200" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="290" text-anchor="middle" font-size="9" fill="#555">warp 0 对 shared[0..7] 再做 1 次 warp_reduce</text>

  <line x1="210" y1="298" x2="210" y2="314" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== atomicAdd ===== -->
  <text x="30" y="328" font-size="11" fill="#b85450" font-weight="bold">④ thread 0 → atomicAdd(output, sum / B)</text>

  <rect x="100" y="336" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="353" text-anchor="middle" font-size="10" fill="#8a3040" font-weight="bold">block 0</text>

  <rect x="230" y="336" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="353" text-anchor="middle" font-size="10" fill="#8a3040" font-weight="bold">block 1</text>

  <rect x="360" y="336" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="353" text-anchor="middle" font-size="10" fill="#8a3040" font-weight="bold">block N</text>

  <line x1="150" y1="362" x2="265" y2="378" stroke="#b85450" stroke-width="0.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="362" x2="265" y2="378" stroke="#b85450" stroke-width="0.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="410" y1="362" x2="265" y2="378" stroke="#b85450" stroke-width="0.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="380" width="90" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="393" text-anchor="middle" font-size="10" fill="#2d5a1d" font-weight="bold">output[0]</text>
</svg>
