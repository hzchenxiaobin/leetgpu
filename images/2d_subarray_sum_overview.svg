<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#fdfcf7"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">2D Subarray Sum：子矩形求和 = 展平 + 两级归约</text>
  <path d="M 250 40 Q 450 48 650 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 2D matrix with sub-rectangle -->
  <text x="70" y="74" font-size="12" font-weight="bold" fill="#2b6e9e">输入：input[N][M]（int32，row-major），高亮子矩形 [S_ROW..E_ROW][S_COL..E_COL]</text>
  <text x="300" y="92" font-size="10" fill="#888">col 0   col 1   col 2   col 3   col 4</text>
  <text x="58" y="116" font-size="10" fill="#888">row 0</text>
  <text x="58" y="152" font-size="10" fill="#888">row 1</text>
  <text x="58" y="188" font-size="10" fill="#888">row 2</text>
  <g filter="url(#sk)">
    <!-- row 0 -->
    <rect x="100" y="104" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="156" y="104" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="212" y="104" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="268" y="104" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="324" y="104" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <!-- row 1 -->
    <rect x="100" y="138" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="156" y="138" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="212" y="138" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="268" y="138" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="324" y="138" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <!-- row 2 -->
    <rect x="100" y="172" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="156" y="172" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="212" y="172" width="56" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="268" y="172" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="324" y="172" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="212" y="220" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">子矩形：row_len = E_ROW − S_ROW + 1，col_len = E_COL − S_COL + 1</text>
  <text x="430" y="124" font-size="10" fill="#888">S_COL</text>
  <text x="268" y="98" text-anchor="middle" font-size="9" fill="#7a5415">S_COL..E_COL</text>
  <text x="92" y="124" font-size="9" fill="#7a5415">S_ROW</text>
  <text x="92" y="190" font-size="9" fill="#7a5415">E_ROW</text>

  <!-- flatten arrow -->
  <path d="M 212 226 L 212 246" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="224" y="242" font-size="11" fill="#7a5415">展平子矩形为 1D（total = row_len × col_len）</text>

  <!-- 1D flattened -->
  <text x="70" y="262" font-size="12" font-weight="bold" fill="#2b6e9e">子矩形展平为 1D：off ∈ [0, total)</text>
  <g filter="url(#sk)">
    <rect x="100" y="270" width="52" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="152" y="270" width="52" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="204" y="270" width="52" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="256" y="270" width="52" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="308" y="270" width="52" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="360" y="270" width="52" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="126" y="290" text-anchor="middle" font-size="10" fill="#7a5415">off=0</text>
  <text x="178" y="290" text-anchor="middle" font-size="10" fill="#7a5415">1</text>
  <text x="230" y="290" text-anchor="middle" font-size="10" fill="#7a5415">...</text>
  <text x="334" y="290" text-anchor="middle" font-size="10" fill="#7a5415">total-1</text>
  <text x="430" y="290" font-size="10" fill="#888">r = off / col_len，c = off % col_len</text>
  <text x="430" y="305" font-size="10" fill="#888">idx = (S_ROW+r)·M + (S_COL+c)</text>

  <!-- reduce arrow -->
  <path d="M 212 306 L 212 326" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="224" y="322" font-size="11" fill="#2e6e2e">grid-stride 累加（long long）+ 两级归约</text>

  <!-- reduction pipeline -->
  <rect x="70" y="334" width="240" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#sk)"/>
  <text x="84" y="354" font-family="monospace" font-size="10" fill="#333">long long sum = 0;</text>
  <text x="84" y="370" font-family="monospace" font-size="10" fill="#333">for(off=tid; off&lt;total; off+=stride)</text>
  <text x="84" y="382" font-family="monospace" font-size="9" fill="#666">  sum += input[(S_ROW+r)*M + S_COL+c];</text>

  <rect x="330" y="334" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="6" filter="url(#sk)"/>
  <text x="344" y="354" font-size="11" fill="#7a5415" font-weight="bold">warp_reduce + block 终约</text>
  <text x="344" y="370" font-size="10" fill="#555">__shfl_down_sync 树形归约（long long）</text>
  <text x="344" y="382" font-size="10" fill="#555">shared → warp 0 终约 → block_sum</text>

  <!-- cross-block -->
  <path d="M 450 386 L 450 404" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="320" y="408" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#sk)"/>
  <text x="450" y="424" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">atomicAdd → scratch(long long)</text>
  <text x="450" y="436" text-anchor="middle" font-size="9" fill="#888">output[0] = (int)scratch[0]（匹配 torch.sum int64→int32）</text>

  <!-- output -->
  <g filter="url(#sk)">
    <rect x="640" y="410" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="715" y="430" text-anchor="middle" font-size="11" fill="#2e6e2e">output[0]</text>
  <text x="715" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">= 子矩形和</text>
  <path d="M 580 425 Q 612 425 635 425" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="600" y="110" width="280" height="200" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="618" y="134" font-size="12" font-weight="bold" fill="#444">💡 核心洞察</text>
  <text x="618" y="156" font-size="11" fill="#444">子矩形在内存中并非连续——每行</text>
  <text x="618" y="172" font-size="11" fill="#444">col_len 个元素连续，行间隔 M。</text>
  <text x="618" y="188" font-size="11" fill="#444">故展平需 off→(r,c)→全局下标。</text>
  <text x="618" y="214" font-size="11" font-weight="bold" fill="#b85450">与 #47 的唯一差异：</text>
  <text x="618" y="230" font-size="11" fill="#b85450">索引从 1D 连续 input[S+off]</text>
  <text x="618" y="246" font-size="11" fill="#b85450">变成 2D 映射 input[(S_ROW+r)·M</text>
  <text x="618" y="262" font-size="11" fill="#b85450">+ S_COL+c]，归约骨架完全复用。</text>
  <text x="618" y="288" font-size="11" fill="#2e6e2e">long long 累加 → memory-bound</text>
</svg>
