<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">softplus 数值稳定性：朴素 vs 稳定公式</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">logits = ±1000 时朴素 log(1+exp) 溢出，稳定公式分流消除</text>

  <!-- ===== Naive version ===== -->
  <rect x="30" y="58" width="230" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="76" text-anchor="middle" font-size="11" fill="#8a3040" font-weight="bold">朴素公式（❌ 会溢出）</text>
  <text x="145" y="94" text-anchor="middle" font-size="10" fill="#555">loss = log(1 + exp(-logits))</text>

  <rect x="50" y="104" width="190" height="24" fill="#fff" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="120" text-anchor="middle" font-size="9" fill="#b85450">logits = -1000 → exp(1000) = ∞</text>

  <rect x="50" y="134" width="190" height="24" fill="#fff" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="145" y="150" text-anchor="middle" font-size="9" fill="#b85450">logits = +1000 → log(1+0) = 0 ✓</text>

  <!-- ===== Stable version ===== -->
  <rect x="300" y="58" width="230" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="76" text-anchor="middle" font-size="11" fill="#2d5a1d" font-weight="bold">稳定公式（✅ 无溢出）</text>
  <text x="415" y="94" text-anchor="middle" font-size="10" fill="#555">loss = max(-logits, 0)</text>
  <text x="415" y="108" text-anchor="middle" font-size="10" fill="#555">     + log1p(exp(-|logits|))</text>

  <rect x="320" y="118" width="190" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="415" y="134" text-anchor="middle" font-size="9" fill="#2d5a1d">logits = -1000: max(1000,0)</text>
  <text x="415" y="146" text-anchor="middle" font-size="9" fill="#2d5a1d">  + log1p(exp(-1000)) ≈ 1000 ✓</text>

  <rect x="320" y="152" width="190" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="415" y="167" text-anchor="middle" font-size="9" fill="#2d5a1d">logits = +1000: 0 + log1p(0) = 0 ✓</text>

  <!-- ===== Branch diagram ===== -->
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">分流逻辑</text>

  <!-- logits >= 0 branch -->
  <rect x="30" y="214" width="240" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">logits ≥ 0（模型偏好 chosen）</text>
  <text x="150" y="248" text-anchor="middle" font-size="9" fill="#555">-logits ≤ 0 → max = 0</text>
  <text x="150" y="262" text-anchor="middle" font-size="9" fill="#555">exp(-|logits|) = exp(-logits) ∈ (0,1]</text>
  <text x="150" y="276" text-anchor="middle" font-size="9" fill="#555">loss = log1p(exp(-logits))</text>
  <text x="150" y="288" text-anchor="middle" font-size="9" fill="#888">→ loss ∈ [0, log2]，无溢出</text>

  <!-- logits < 0 branch -->
  <rect x="290" y="214" width="240" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="232" text-anchor="middle" font-size="10" fill="#8a6d20" font-weight="bold">logits &lt; 0（模型偏好 rejected）</text>
  <text x="410" y="248" text-anchor="middle" font-size="9" fill="#555">-logits > 0 → max = -logits</text>
  <text x="410" y="262" text-anchor="middle" font-size="9" fill="#555">exp(-|logits|) = exp(logits) ∈ (0,1)</text>
  <text x="410" y="276" text-anchor="middle" font-size="9" fill="#555">loss = -logits + log1p(exp(logits))</text>
  <text x="410" y="288" text-anchor="middle" font-size="9" fill="#888">→ loss ≈ -logits（大数不溢出）</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="310" width="500" height="50" fill="#fafafa" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#555">核心：把 log(1+exp(z)) 拆成 max(z,0) + log1p(exp(-|z|))</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#555">max 保证大数不走 exp → 不溢出；log1p 保证小数精度 → 不丢精度</text>
  <text x="280" y="358" text-anchor="middle" font-size="9" fill="#888">测试用例 logits=±1000 验证此稳定性（朴素版会得 inf/NaN）</text>
</svg>
