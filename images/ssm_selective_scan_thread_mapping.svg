<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Thread-per-Channel：并行化 (batch × d_model) 个独立通道</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">每个线程负责一个 (b, d) 通道，维护 d_state 维寄存器状态，顺序扫描 seq_len 步</text>

  <!-- ===== Top: 3D tensor with channel decomposition ===== -->
  <text x="160" y="76" font-size="12" fill="#446688" font-weight="bold">y[batch][seq_len][d_model]</text>
  <g font-size="9" fill="#333">
    <!-- batch 0 -->
    <rect x="60" y="84" width="200" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="68" y="98" font-size="8" fill="#888">b=0</text>
    <!-- d_model channels as columns -->
    <g stroke="#bcd" stroke-width="0.3" filter="url(#rough2)">
      <line x1="100" y1="84" x2="100" y2="184"/>
      <line x1="140" y1="84" x2="140" y2="184"/>
      <line x1="180" y1="84" x2="180" y2="184"/>
      <line x1="220" y1="84" x2="220" y2="184"/>
    </g>
    <text x="80" y="140" text-anchor="middle" font-size="7" fill="#446688" transform="rotate(-90 80 140)">d=0</text>
    <text x="120" y="140" text-anchor="middle" font-size="7" fill="#446688" transform="rotate(-90 120 140)">d=1</text>
    <text x="160" y="140" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 160 140)">d=2</text>
    <text x="200" y="140" text-anchor="middle" font-size="7" fill="#888" transform="rotate(-90 200 140)">...</text>
    <text x="240" y="140" text-anchor="middle" font-size="7" fill="#888" transform="rotate(-90 240 140)">d=D</text>

    <!-- highlight one channel -->
    <rect x="140" y="84" width="40" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="160" y="200" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">一个通道</text>
  </g>

  <!-- arrow -->
  <path d="M 270 134 L 310 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="9" fill="#666">→ 线程</text>

  <!-- ===== Middle: thread mapping ===== -->
  <text x="470" y="76" font-size="12" fill="#4a7a3a" font-weight="bold">Thread Grid (1D)</text>
  <g font-size="9" fill="#333">
    <!-- block of threads -->
    <rect x="320" y="84" width="280" height="100" fill="#f6f6f6" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="332" y="100" font-size="8" fill="#888">block 0 (256 threads)</text>

    <!-- individual thread cells -->
    <g filter="url(#rough2)">
      <rect x="330" y="110" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2"/>
      <text x="345" y="126" text-anchor="middle" font-size="7" fill="#446688">(0,0)</text>

      <rect x="365" y="110" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2"/>
      <text x="380" y="126" text-anchor="middle" font-size="7" fill="#446688">(0,1)</text>

      <rect x="400" y="110" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
      <text x="415" y="126" text-anchor="middle" font-size="7" fill="#4a7a3a" font-weight="bold">(0,2)</text>

      <rect x="435" y="110" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="450" y="126" text-anchor="middle" font-size="7" fill="#999">...</text>

      <rect x="470" y="110" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2"/>
      <text x="485" y="126" text-anchor="middle" font-size="7" fill="#446688">(0,D)</text>

      <rect x="505" y="110" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2"/>
      <text x="520" y="126" text-anchor="middle" font-size="7" fill="#446688">(1,0)</text>

      <rect x="540" y="110" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="555" y="126" text-anchor="middle" font-size="7" fill="#999">...</text>
    </g>

    <!-- second row of threads -->
    <g filter="url(#rough2)">
      <rect x="330" y="140" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="345" y="156" text-anchor="middle" font-size="7" fill="#999">...</text>
      <rect x="365" y="140" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="380" y="156" text-anchor="middle" font-size="7" fill="#999">...</text>
      <rect x="400" y="140" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="415" y="156" text-anchor="middle" font-size="7" fill="#999">...</text>
      <rect x="435" y="140" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="450" y="156" text-anchor="middle" font-size="7" fill="#999">...</text>
      <rect x="470" y="140" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="485" y="156" text-anchor="middle" font-size="7" fill="#999">...</text>
      <rect x="505" y="140" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="520" y="156" text-anchor="middle" font-size="7" fill="#999">...</text>
      <rect x="540" y="140" width="30" height="24" fill="#eee" stroke="#ccc" stroke-width="0.8" rx="2"/>
      <text x="555" y="156" text-anchor="middle" font-size="7" fill="#999">...</text>
    </g>

    <text x="460" y="178" text-anchor="middle" font-size="8" fill="#888">tid → (b=tid/d_model, d=tid%d_model)</text>
  </g>

  <!-- ===== Bottom: per-thread execution flow ===== -->
  <line x1="20" y1="210" x2="620" y2="210" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="320" y="234" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">单线程执行流程（通道 d=2, batch b=0 为例）</text>

  <!-- register state box -->
  <rect x="30" y="250" width="120" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="270" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">寄存器状态</text>
  <text x="90" y="286" text-anchor="middle" font-family="monospace" font-size="9" fill="#d6a040">h[0..d_state-1]</text>
  <text x="90" y="302" text-anchor="middle" font-size="8" fill="#888">初始 = 0</text>
  <text x="90" y="318" text-anchor="middle" font-size="8" fill="#888">全程驻留寄存器</text>

  <!-- time loop -->
  <rect x="180" y="250" width="300" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="270" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">for t = 0 .. seq_len-1（顺序循环）</text>
  <text x="196" y="288" font-family="monospace" font-size="8" fill="#4a7a3a">① 读 u[b,t,d], delta[b,t,d]  ← global</text>
  <text x="196" y="302" font-family="monospace" font-size="8" fill="#d6a040">② A_bar = __expf(delta * A[d,n])  ← 逐 n</text>
  <text x="196" y="316" font-family="monospace" font-size="8" fill="#446688">③ h[n] = A_bar*h[n] + delta*B[b,t,n]*u</text>
  <text x="196" y="330" font-family="monospace" font-size="8" fill="#b85450">④ y = Σ C[b,t,n]*h[n] + skip[d]*u → global</text>

  <!-- arrow from register to loop -->
  <path d="M 150 290 L 178 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 178 300 L 150 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="282" text-anchor="middle" font-size="7" fill="#666">读写</text>

  <!-- output -->
  <rect x="510" y="250" width="100" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="560" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">输出</text>
  <text x="560" y="288" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a7a3a">y[b,t,d]</text>
  <text x="560" y="304" text-anchor="middle" font-size="8" fill="#888">每步写 1 个</text>
  <text x="560" y="318" text-anchor="middle" font-size="8" fill="#888">共 seq_len 个</text>

  <path d="M 482 310 L 508 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="30" y="350" width="580" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="370" font-size="11" fill="#d6a040" font-weight="bold">💡 为什么不用关联扫描（像 #82 Linear Recurrence 那样）？</text>
  <text x="60" y="388" font-size="10" fill="#555">Selective scan 的 Ā/B̄ 每步随 delta 变化，仿射复合 (a₁a₂, a₁b₂+b₁) 扩展到矩阵状态后：</text>
  <text x="60" y="402" font-size="10" fill="#555">复合开销 = O(d_state²) per step，且 exp(delta·A) 的复合无简单闭式解。</text>
  <text x="60" y="416" font-size="10" fill="#555">→ 实际工程（Mamba CUDA kernel）采用 thread-per-channel + 顺序时间循环，用并行度换简单性。</text>

  <!-- ===== Performance note ===== -->
  <rect x="30" y="440" width="580" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="460" font-size="10" fill="#444" font-weight="bold">性能测试规模：batch=4, d_model=512 → 2048 个独立通道 = 2048 个线程</text>
  <text x="44" y="476" font-size="9" fill="#888">RTX 5090 有 108 SM × 2048 线程/SM = 221K 线程并发，2048 通道轻松填满（occupancy 受寄存器限制）</text>
</svg>
