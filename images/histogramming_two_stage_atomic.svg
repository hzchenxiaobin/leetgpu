<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">两阶段 atomic：把 global 写竞争降两个数量级</text>
  <path d="M 210 38 Q 360 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#888">N=50,000,000, num_bins=256, blocks=num_sm×4（≈432）</text>

  <!-- Column A: naive -->
  <g filter="url(#sk)">
    <rect x="30" y="74" width="210" height="190" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="135" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">朴素：N 次 global atomic</text>
  <text x="135" y="118" text-anchor="middle" font-size="10" fill="#555">atomicAdd(&amp;hist[bin], 1)</text>
  <text x="135" y="140" text-anchor="middle" font-size="10" fill="#555">冲突域 = 全 grid（50M threads）</text>
  <text x="135" y="158" text-anchor="middle" font-size="10" fill="#555">50M 线程抢 256 桶</text>
  <text x="135" y="176" text-anchor="middle" font-size="10" fill="#555">每桶 ~195,000 次串行</text>
  <text x="135" y="194" text-anchor="middle" font-size="10" fill="#555">延迟：~数百周期/次</text>
  <g filter="url(#sk)">
    <rect x="50" y="208" width="170" height="40" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="135" y="224" text-anchor="middle" font-size="9" fill="#888">global atomic 次数</text>
  <text x="135" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">≈ 50,000,000</text>

  <!-- arrow A -> B+C -->
  <path d="M 240 168 L 252 168" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="160" text-anchor="middle" font-size="8" fill="#888">私有化</text>

  <!-- Column B: stage 1 -->
  <g filter="url(#sk)">
    <rect x="255" y="74" width="210" height="190" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="360" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">阶段①：N 次 shared atomic</text>
  <text x="360" y="118" text-anchor="middle" font-size="10" fill="#555">atomicAdd(&amp;s_hist[bin], 1)</text>
  <text x="360" y="140" text-anchor="middle" font-size="10" fill="#555">冲突域 = 单 block（256 threads）</text>
  <text x="360" y="158" text-anchor="middle" font-size="10" fill="#555">256 线程抢 256 桶</text>
  <text x="360" y="176" text-anchor="middle" font-size="10" fill="#555">每桶 ~1 次冲突</text>
  <text x="360" y="194" text-anchor="middle" font-size="10" fill="#555">延迟：~数十周期/次</text>
  <g filter="url(#sk)">
    <rect x="275" y="208" width="170" height="40" rx="6" fill="#fff" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="360" y="224" text-anchor="middle" font-size="9" fill="#888">shared atomic 次数</text>
  <text x="360" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">≈ 50,000,000（廉价）</text>

  <!-- arrow B -> C -->
  <path d="M 360 264 L 360 278" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="276" font-size="8" fill="#888">末尾合并</text>

  <!-- Column C: stage 2 -->
  <g filter="url(#sk)">
    <rect x="480" y="74" width="210" height="190" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="585" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">阶段②：B×blocks 次 global atomic</text>
  <text x="585" y="118" text-anchor="middle" font-size="10" fill="#555">atomicAdd(&amp;hist[b], s_hist[b])</text>
  <text x="585" y="140" text-anchor="middle" font-size="10" fill="#555">每桶仅 blocks 个写者</text>
  <text x="585" y="158" text-anchor="middle" font-size="10" fill="#555">256 桶 × 432 blocks</text>
  <text x="585" y="176" text-anchor="middle" font-size="10" fill="#555">冲突极低（可忽略）</text>
  <text x="585" y="194" text-anchor="middle" font-size="10" fill="#555">延迟：global 但并发低</text>
  <g filter="url(#sk)">
    <rect x="500" y="208" width="170" height="40" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="585" y="224" text-anchor="middle" font-size="9" fill="#888">global atomic 次数</text>
  <text x="585" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">≈ 110,000</text>

  <!-- storage hierarchy -->
  <text x="30" y="300" font-size="12" font-weight="bold" fill="#446688">存储层次（数据流：register → shared → global）</text>
  <g filter="url(#sk)">
    <rect x="30" y="312" width="180" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="270" y="312" width="180" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="510" y="312" width="180" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="120" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">register</text>
  <text x="120" y="350" text-anchor="middle" font-size="9" fill="#555">每线程当前 bin 值</text>
  <text x="360" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">shared memory</text>
  <text x="360" y="350" text-anchor="middle" font-size="9" fill="#555">s_hist[B]，block 私有</text>
  <text x="600" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">global memory</text>
  <text x="600" y="350" text-anchor="middle" font-size="9" fill="#555">hist[B]，最终输出</text>
  <path d="M 210 336 L 270 336" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 450 336 L 510 336" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="30" y="382" width="660" height="56" rx="7" fill="#f6f6f6" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="360" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">global atomic 次数：50,000,000 → 110,000，降 ~450×</text>
  <text x="360" y="424" text-anchor="middle" font-size="10" fill="#555">瓶颈从 atomic-bound（global 写串行化）转为 memory-bound（读 input 带宽）</text>
</svg>
