<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Tiled 数据复用：reference agent 载入 shared，256 thread 共享</text>
  <path d="M 240 42 Q 460 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- global memory: all agents -->
  <text x="40" y="76" font-size="12" font-weight="bold" fill="#2b6e9e">global memory: agents[4N]</text>
  <g filter="url(#sk)">
    <rect x="40" y="86" width="36" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="76" y="86" width="36" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="112" y="86" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="148" y="86" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="184" y="86" width="36" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="220" y="86" width="36" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="58" y="104" text-anchor="middle" font-size="8" fill="#2b6e9e">0</text>
  <text x="94" y="104" text-anchor="middle" font-size="8" fill="#2b6e9e">1</text>
  <text x="130" y="104" text-anchor="middle" font-size="8" fill="#7a5415">2</text>
  <text x="166" y="104" text-anchor="middle" font-size="8" fill="#7a5415">3</text>
  <text x="202" y="104" text-anchor="middle" font-size="8" fill="#2b6e9e">4</text>
  <text x="238" y="104" text-anchor="middle" font-size="8" fill="#888">...</text>
  <text x="40" y="128" font-size="9" fill="#7a5415">当前 tile = agent[2..3]（橙）, 每 agent = float4 (px,py,vx,vy)</text>

  <!-- cooperative load arrow -->
  <path d="M 138 120 L 138 168" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="150" font-size="10" fill="#7a5415">协作加载</text>
  <text x="150" y="163" font-size="9" fill="#888">每 thread 载 1 个 → sh[tid]</text>

  <!-- shared memory tile -->
  <text x="40" y="190" font-size="12" font-weight="bold" fill="#7a5415">shared memory: sh[256] (float4, 4 KB / block)</text>
  <g filter="url(#sk)">
    <rect x="40" y="200" width="60" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="100" y="200" width="60" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="160" y="200" width="60" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="220" y="200" width="60" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="70" y="220" text-anchor="middle" font-size="8" fill="#7a5415">sh[0]</text>
  <text x="130" y="220" text-anchor="middle" font-size="8" fill="#7a5415">sh[1]</text>
  <text x="190" y="220" text-anchor="middle" font-size="8" fill="#7a5415">sh[2]</text>
  <text x="250" y="220" text-anchor="middle" font-size="8" fill="#888">...</text>
  <text x="40" y="248" font-size="9" fill="#888">__syncthreads() ① 等待写入完成</text>

  <!-- 256 threads (registers) -->
  <text x="380" y="190" font-size="12" font-weight="bold" fill="#2e6e2e">256 个 thread（agent i 驻留寄存器）</text>
  <g filter="url(#sk)">
    <rect x="380" y="200" width="60" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="444" y="200" width="60" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="508" y="200" width="60" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="572" y="200" width="60" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="410" y="216" text-anchor="middle" font-size="8" fill="#2e6e2e">t0: i=0</text>
  <text x="410" y="228" text-anchor="middle" font-size="7" fill="#888">px,py,vx,vy</text>
  <text x="474" y="216" text-anchor="middle" font-size="8" fill="#2e6e2e">t1: i=1</text>
  <text x="538" y="216" text-anchor="middle" font-size="8" fill="#2e6e2e">t2: i=2</text>
  <text x="602" y="216" text-anchor="middle" font-size="8" fill="#888">...</text>
  <text x="380" y="252" font-size="9" fill="#888">各自累加器 sum_vx / sum_vy / count（寄存器）</text>

  <!-- reuse arrows: every thread reads same shared tile -->
  <g filter="url(#sk)">
    <path d="M 190 234 Q 300 270 410 234" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
    <path d="M 190 236 Q 330 280 474 236" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
    <path d="M 190 238 Q 360 290 538 238" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="306" text-anchor="middle" font-size="10" fill="#2e6e2e">同一 tile 被 256 个 thread 复用 → 读流量 ÷ 256</text>

  <!-- per-thread compute -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="840" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="460" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">per-thread 计算（对 tile 内每个 k）</text>
  <text x="460" y="374" text-anchor="middle" font-size="11" fill="#444">dx = px − sh[k].x;  dy = py − sh[k].y;  if (dx²+dy² &lt; 25 &amp;&amp; k≠i) { sum_vx += sh[k].z; sum_vy += sh[k].w; count++ }</text>

  <!-- syncthreads 2 + next tile -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="840" height="60" rx="8" fill="#f0f7ff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="460" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">__syncthreads() ②  等计算完成 → 加载下一个 tile → ... → 全部 tile 遍历完</text>
  <text x="460" y="446" text-anchor="middle" font-size="11" fill="#444">avg = count&gt;0 ? sum/count : 自身速度;  v' = v + 0.05(avg − v);  p' = p + v';  写回 agents_next[i]</text>
  <text x="460" y="460" text-anchor="middle" font-size="10" fill="#888">双屏障缺一不可：① 防读未初始化 ② 防下一轮覆盖 —— 与 GEMM/nearest-neighbor tiling 完全一致</text>
</svg>
