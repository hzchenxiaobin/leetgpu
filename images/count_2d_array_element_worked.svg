<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Worked Example：2D 矩阵展平 + 两级归约（K=1, N=2, M=3）</text>
  <path d="M 250 42 Q 460 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 2D matrix -->
  <text x="60" y="78" font-size="12" font-weight="bold" fill="#2b6e9e">输入：input[2][3]（row-major，K=1）</text>
  <text x="150" y="74" font-size="10" fill="#888">col0  col1  col2</text>
  <text x="108" y="98" font-size="10" fill="#888">row0</text>
  <text x="108" y="134" font-size="10" fill="#888">row1</text>
  <g filter="url(#sk)">
    <rect x="140" y="86" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="196" y="86" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="252" y="86" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="140" y="118" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="196" y="118" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="252" y="118" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="168" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="224" y="108" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="280" y="108" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <text x="168" y="140" text-anchor="middle" font-size="13" fill="#2b6e9e">4</text>
  <text x="224" y="140" text-anchor="middle" font-size="13" fill="#2b6e9e">5</text>
  <text x="280" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>

  <!-- flatten arrow -->
  <path d="M 224 156 L 224 176" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="236" y="172" font-size="10" fill="#7a5415">展平: idx = row*3 + col</text>

  <!-- 1D flattened -->
  <text x="60" y="192" font-size="12" font-weight="bold" fill="#2b6e9e">展平为 1D（total = 6）</text>
  <g filter="url(#sk)">
    <rect x="140" y="200" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="196" y="200" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="252" y="200" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="308" y="200" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="364" y="200" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="420" y="200" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="168" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="224" y="222" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="280" y="222" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <text x="336" y="222" text-anchor="middle" font-size="13" fill="#2b6e9e">4</text>
  <text x="392" y="222" text-anchor="middle" font-size="13" fill="#2b6e9e">5</text>
  <text x="448" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="168" y="246" text-anchor="middle" font-size="9" fill="#888">idx0</text>
  <text x="336" y="246" text-anchor="middle" font-size="9" fill="#888">idx3</text>
  <text x="448" y="246" text-anchor="middle" font-size="9" fill="#888">idx5</text>
  <text x="158" y="246" font-size="9" fill="#888">block0</text>
  <text x="420" y="246" font-size="9" fill="#888">block1</text>

  <!-- predicate arrow -->
  <path d="M 300 252 L 300 270" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="266" font-size="10" fill="#7a5415">predicate: ==1 ? 1:0</text>

  <!-- predicate row -->
  <text x="60" y="284" font-size="12" font-weight="bold" fill="#7a5415">逐元素判定</text>
  <g filter="url(#sk)">
    <rect x="140" y="292" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="196" y="292" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="252" y="292" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="308" y="292" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="364" y="292" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="420" y="292" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="168" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1</text>
  <text x="224" y="314" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="336" y="314" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="392" y="314" text-anchor="middle" font-size="13" fill="#aaa">0</text>
  <text x="448" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">1</text>

  <!-- block 0 warp reduce -->
  <path d="M 224 330 L 224 346" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="60" y="360" font-size="12" font-weight="bold" fill="#7a5415">block 0：3 lane warp 归约（offset 2 → 1）</text>
  <g filter="url(#sk)">
    <rect x="140" y="368" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="196" y="368" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="252" y="368" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="168" y="387" text-anchor="middle" font-size="12" fill="#7a5415">1</text>
  <text x="224" y="387" text-anchor="middle" font-size="12" fill="#7a5415">0</text>
  <text x="280" y="387" text-anchor="middle" font-size="12" fill="#7a5415">0</text>
  <text x="324" y="387" font-size="10" fill="#888">lane 0  1  2</text>

  <text x="140" y="412" font-size="10" fill="#b85450">offset=2: lane0 += lane2 → 1</text>
  <text x="140" y="430" font-size="10" fill="#b85450">offset=1: lane0 += lane1 → 1</text>
  <g filter="url(#sk)">
    <rect x="140" y="436" width="56" height="30" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="168" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="210" y="457" font-size="12" fill="#2e6e2e">→ block_sum₀ = 1</text>

  <!-- block 1 warp reduce -->
  <text x="500" y="360" font-size="12" font-weight="bold" fill="#7a5415">block 1：3 lane warp 归约（同理）</text>
  <g filter="url(#sk)">
    <rect x="500" y="368" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="556" y="368" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="612" y="368" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="528" y="387" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="584" y="387" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <text x="640" y="387" text-anchor="middle" font-size="12" fill="#7a5415">1</text>

  <text x="500" y="412" font-size="10" fill="#b85450">offset 2→1 后 lane0 持和</text>
  <g filter="url(#sk)">
    <rect x="500" y="436" width="56" height="30" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="528" y="457" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="570" y="457" font-size="12" fill="#2e6e2e">→ block_sum₁ = 1</text>

  <!-- final reduce arrows -->
  <path d="M 168 470 Q 320 500 400 510" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 528 470 Q 420 500 400 510" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- final reduce -->
  <text x="60" y="500" font-size="12" font-weight="bold" fill="#2e6e2e">final_reduce</text>
  <g filter="url(#sk)">
    <rect x="340" y="514" width="130" height="38" rx="7" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/>
  </g>
  <text x="405" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1 + 1 = 2</text>

  <!-- output box -->
  <g filter="url(#sk)">
    <rect x="540" y="514" width="150" height="38" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="615" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">output[0] = 2 ✓</text>
  <path d="M 470 533 L 535 533" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="460" y="556" text-anchor="middle" font-size="10" fill="#888">注：实际 BLOCK_SIZE=256（8 warp），此处用 3 lane 演示归约步骤</text>
</svg>
