<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Top-p Sampling 五阶段流水线</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">logits → softmax → sort desc → cumsum → nucleus → renorm → sample</text>

  <!-- ===== Step 1: Logits ===== -->
  <rect x="20" y="60" width="100" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="70" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① logits</text>
  <text x="70" y="100" text-anchor="middle" font-size="9" fill="#888">[1.0, 2.0, 3.0, 0.5]</text>
  <text x="70" y="116" text-anchor="middle" font-size="9" fill="#888">vocab_size 个</text>

  <line x1="125" y1="95" x2="155" y2="95" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Softmax ===== -->
  <rect x="160" y="60" width="100" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="210" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② softmax</text>
  <text x="210" y="100" text-anchor="middle" font-size="9" fill="#888">减 max + exp</text>
  <text x="210" y="116" text-anchor="middle" font-size="9" fill="#888">→ probs</text>

  <line x1="265" y1="95" x2="295" y2="95" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Sort ===== -->
  <rect x="300" y="60" width="100" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="82" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ sort desc</text>
  <text x="350" y="100" text-anchor="middle" font-size="9" fill="#888">bitonic sort</text>
  <text x="350" y="116" text-anchor="middle" font-size="9" fill="#888">probs[idx]</text>

  <line x1="405" y1="95" x2="435" y2="95" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: Cumsum + nucleus ===== -->
  <rect x="440" y="60" width="100" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="490" y="82" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④ cumsum</text>
  <text x="490" y="100" text-anchor="middle" font-size="9" fill="#888">找 ≥ p 的截断</text>
  <text x="490" y="116" text-anchor="middle" font-size="9" fill="#888">→ nucleus</text>

  <line x1="545" y1="95" x2="575" y2="95" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: Sample ===== -->
  <rect x="540" y="60" width="80" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="580" y="82" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">⑤ sample</text>
  <text x="580" y="100" text-anchor="middle" font-size="9" fill="#888">renorm</text>
  <text x="580" y="116" text-anchor="middle" font-size="9" fill="#888">→ token</text>

  <!-- ===== Detailed example ===== -->
  <text x="320" y="158" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">Worked Example: logits=[1, 2, 3, 0.5], p=0.9</text>

  <!-- Row 1: probs -->
  <rect x="40" y="170" width="560" height="28" fill="#e6f4ea" fill-opacity="0.2" stroke="#4a7a3a" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="188" font-size="9" fill="#4a7a3a">probs:</text>
  <text x="100" y="188" font-size="9" fill="#333">[0.16, 0.42, 0.12] </text>
  <text x="250" y="188" font-size="9" fill="#333">idx: [1, 2, 0, 3]</text>

  <!-- Row 2: sorted -->
  <rect x="40" y="202" width="560" height="28" fill="#fff8e1" fill-opacity="0.2" stroke="#d6a040" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="220" font-size="9" fill="#d6a040">sorted:</text>
  <text x="100" y="220" font-size="9" fill="#333">[0.64, 0.24, 0.09, 0.03]</text>
  <text x="280" y="220" font-size="9" fill="#333">idx: [2, 1, 0, 3]</text>

  <!-- Row 3: cumsum -->
  <rect x="40" y="234" width="560" height="28" fill="#fce4ec" fill-opacity="0.2" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="252" font-size="9" fill="#b85450">cumsum:</text>
  <text x="100" y="252" font-size="9" fill="#333">[0.64, 0.88, 0.97, 1.00]</text>
  <text x="280" y="252" font-size="9" fill="#b85450" font-weight="bold">↑ ≥0.9 at idx=2 → nucleus = top 3</text>

  <!-- Row 4: nucleus -->
  <rect x="40" y="266" width="560" height="28" fill="#e8f0fe" fill-opacity="0.2" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="284" font-size="9" fill="#446688">nucleus:</text>
  <text x="100" y="284" font-size="9" fill="#333">[0.64, 0.24, 0.09] / 0.97 = [0.66, 0.25, 0.09]</text>
  <text x="430" y="284" font-size="9" fill="#446688" font-weight="bold">→ sample</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="310" width="580" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">核心：nucleus = 最小 token 集合使其累积概率 ≥ p</text>
  <text x="320" y="348" text-anchor="middle" font-size="10" fill="#888">p 大 → 更多 token 候选（更多样） / p 小 → 更少候选（更确定）</text>

  <!-- ===== Kernel mapping ===== -->
  <rect x="30" y="362" width="580" height="30" fill="#fce4ec" fill-opacity="0.2" stroke="#b85450" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="381" text-anchor="middle" font-size="10" fill="#b85450">💡 一个 block 处理一次采样：softmax → bitonic sort → scan → CDF 采样，全程 shared memory</text>
</svg>
