<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">SSM Selective Scan：状态递推链</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">h_t = A_bar · h_{t-1} + B_bar · u_t，时间维度串行，(batch, d_model) 维度并行</text>

  <!-- ===== Recurrence chain ===== -->
  <!-- t=0 -->
  <g font-size="10" fill="#333">
    <rect x="40" y="120" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="80" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">h₀</text>
    <text x="80" y="158" text-anchor="middle" font-size="8" fill="#446688">d_state 维</text>
    <text x="80" y="108" text-anchor="middle" font-size="8" fill="#888">t=0</text>

    <!-- input arrow -->
    <line x1="80" y1="210" x2="80" y2="172" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="80" y="228" text-anchor="middle" font-size="8" fill="#4a7a3a">B̄·u₀</text>
  </g>

  <!-- arrow t0->t1 -->
  <line x1="122" y1="145" x2="168" y2="145" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="138" text-anchor="middle" font-size="8" fill="#d6a040">Ā₀</text>

  <!-- t=1 -->
  <g font-size="10" fill="#333">
    <rect x="170" y="120" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">h₁</text>
    <text x="210" y="158" text-anchor="middle" font-size="8" fill="#446688">d_state 维</text>
    <text x="210" y="108" text-anchor="middle" font-size="8" fill="#888">t=1</text>
    <line x1="210" y1="210" x2="210" y2="172" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="210" y="228" text-anchor="middle" font-size="8" fill="#4a7a3a">B̄·u₁</text>
  </g>

  <line x1="252" y1="145" x2="298" y2="145" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="138" text-anchor="middle" font-size="8" fill="#d6a040">Ā₁</text>

  <!-- t=2 -->
  <g font-size="10" fill="#333">
    <rect x="300" y="120" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="340" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">h₂</text>
    <text x="340" y="158" text-anchor="middle" font-size="8" fill="#446688">d_state 维</text>
    <text x="340" y="108" text-anchor="middle" font-size="8" fill="#888">t=2</text>
    <line x1="340" y1="210" x2="340" y2="172" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="340" y="228" text-anchor="middle" font-size="8" fill="#4a7a3a">B̄·u₂</text>
  </g>

  <line x1="382" y1="145" x2="428" y2="145" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="138" text-anchor="middle" font-size="8" fill="#d6a040">Ā₂</text>

  <!-- t=3 -->
  <g font-size="10" fill="#333">
    <rect x="430" y="120" width="80" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="470" y="142" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">h₃</text>
    <text x="470" y="158" text-anchor="middle" font-size="8" fill="#446688">d_state 维</text>
    <text x="470" y="108" text-anchor="middle" font-size="8" fill="#888">t=3</text>
    <line x1="470" y1="210" x2="470" y2="172" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="470" y="228" text-anchor="middle" font-size="8" fill="#4a7a3a">B̄·u₃</text>
  </g>

  <!-- continuation -->
  <line x1="512" y1="145" x2="558" y2="145" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output arrows (h -> y) -->
  <line x1="80" y1="118" x2="80" y2="80" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="72" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">y₀</text>

  <line x1="210" y1="118" x2="210" y2="80" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="72" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">y₁</text>

  <line x1="340" y1="118" x2="340" y2="80" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="72" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">y₂</text>

  <line x1="470" y1="118" x2="470" y2="80" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="72" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">y₃</text>

  <!-- ===== Legend / formulas ===== -->
  <line x1="20" y1="260" x2="620" y2="260" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="276" width="580" height="76" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="296" font-size="11" fill="#444" font-weight="bold">每步递推公式（selective = 输入依赖）：</text>
  <text x="60" y="316" font-family="monospace" font-size="10" fill="#d6a040">Ā_{b,t,d,n} = exp(Δ_{b,t,d} · A_{d,n})   ← A_bar 随 delta 变化（selective）</text>
  <text x="60" y="332" font-family="monospace" font-size="10" fill="#4a7a3a">B̄_{b,t,d,n} = Δ_{b,t,d} · B_{b,t,n}        ← B_bar 也随 delta 变化</text>
  <text x="60" y="348" font-family="monospace" font-size="10" fill="#446688">h_{b,t,d,n} = Ā · h_{b,t-1,d,n} + B̄ · u_{b,t,d}  →  y_{b,t,d} = Σ_n C_{b,t,n}·h_{b,t,d,n} + skip_d·u</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="368" width="580" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="388" font-size="11" fill="#d6a040" font-weight="bold">⚠ 核心矛盾：时间维度有串行依赖（h_t 依赖 h_{t-1}）</text>
  <text x="60" y="406" font-size="10" fill="#555">→ 不能像 matmul 那样全并行。解法：并行化 (batch × d_model) 个独立通道，每个通道内顺序扫描时间。</text>
  <text x="60" y="420" font-size="10" fill="#555">→ 这与 Linear Recurrence (#82) 的关联扫描不同：selective 的 Ā/B̄ 每步不同，复合复杂度高。</text>
</svg>
