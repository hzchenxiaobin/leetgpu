<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">可分离卷积：2D 核 = 行向量 ⊗ 列向量</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">Gaussian 核可分解为 ky × kx，2D 卷积拆成两趟 1D 卷积，计算量 K² → 2K</text>

  <!-- ===== Top: kernel decomposition ===== -->
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">核分解：kernel2D[i][j] = ky[i] × kx[j]</text>

  <!-- ky (vertical 1D, column vector) -->
  <text x="60" y="96" font-size="10" fill="#b85450" font-weight="bold">ky (列)</text>
  <g font-size="9" fill="#333">
    <rect x="50" y="104" width="36" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="68" y="124" text-anchor="middle" font-size="8" fill="#b85450">0.25</text>
    <text x="68" y="154" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">0.50</text>
    <text x="68" y="184" text-anchor="middle" font-size="8" fill="#b85450">0.25</text>
    <line x1="50" y1="134" x2="86" y2="134" stroke="#e8b" stroke-width="0.5"/>
    <line x1="50" y1="164" x2="86" y2="164" stroke="#e8b" stroke-width="0.5"/>
  </g>

  <!-- outer product symbol -->
  <text x="100" y="156" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">⊗</text>

  <!-- kx (horizontal 1D, row vector) -->
  <text x="180" y="96" font-size="10" fill="#446688" font-weight="bold">kx (行)</text>
  <g font-size="9" fill="#333">
    <rect x="120" y="138" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <text x="140" y="158" text-anchor="middle" font-size="8" fill="#446688">0.25</text>
    <text x="180" y="158" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0.50</text>
    <text x="220" y="158" text-anchor="middle" font-size="8" fill="#446688">0.25</text>
    <line x1="160" y1="138" x2="160" y2="168" stroke="#8ab" stroke-width="0.5"/>
    <line x1="200" y1="138" x2="200" y2="168" stroke="#8ab" stroke-width="0.5"/>
  </g>

  <!-- equals -->
  <text x="265" y="156" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">=</text>

  <!-- 2D kernel result -->
  <text x="360" y="96" font-size="10" fill="#d6a040" font-weight="bold">kernel2D (3×3)</text>
  <g font-size="8" fill="#333">
    <rect x="300" y="104" width="120" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
    <!-- row 1 -->
    <text x="320" y="124" text-anchor="middle" fill="#d6a040">.0625</text>
    <text x="360" y="124" text-anchor="middle" fill="#d6a040">.125</text>
    <text x="400" y="124" text-anchor="middle" fill="#d6a040">.0625</text>
    <!-- row 2 -->
    <text x="320" y="154" text-anchor="middle" fill="#d6a040">.125</text>
    <text x="360" y="154" text-anchor="middle" fill="#d6a040" font-weight="bold">.25</text>
    <text x="400" y="154" text-anchor="middle" fill="#d6a040">.125</text>
    <!-- row 3 -->
    <text x="320" y="184" text-anchor="middle" fill="#d6a040">.0625</text>
    <text x="360" y="184" text-anchor="middle" fill="#d6a040">.125</text>
    <text x="400" y="184" text-anchor="middle" fill="#d6a040">.0625</text>
    <!-- grid -->
    <g stroke="#e8d090" stroke-width="0.4" filter="url(#rough2)">
      <line x1="340" y1="104" x2="340" y2="194"/>
      <line x1="380" y1="104" x2="380" y2="194"/>
      <line x1="300" y1="134" x2="420" y2="134"/>
      <line x1="300" y1="164" x2="420" y2="164"/>
    </g>
  </g>

  <!-- verify annotation -->
  <text x="460" y="130" font-size="9" fill="#4a7a3a">验证：0.25×0.25=0.0625 ✓</text>
  <text x="460" y="148" font-size="9" fill="#4a7a3a">       0.25×0.50=0.125 ✓</text>
  <text x="460" y="166" font-size="9" fill="#4a7a3a">       0.50×0.50=0.25 ✓</text>
  <text x="460" y="186" font-size="9" fill="#b85450">⚠ 仅可分离核适用</text>

  <!-- ===== Middle: two-pass pipeline ===== -->
  <line x1="20" y1="216" x2="620" y2="216" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两趟 1D 卷积流水线</text>

  <!-- Pass 1: horizontal -->
  <rect x="30" y="256" width="170" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="276" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Pass 1: 水平 1D</text>
  <text x="115" y="292" text-anchor="middle" font-size="8" fill="#555">input → temp</text>
  <text x="115" y="310" text-anchor="middle" font-family="monospace" font-size="8" fill="#446688">temp[i,j] =</text>
  <text x="115" y="322" text-anchor="middle" font-family="monospace" font-size="8" fill="#446688">Σ_n input[i,j+n]·kx[n]</text>
  <text x="115" y="342" text-anchor="middle" font-size="8" fill="#888">每像素 K 次乘加</text>

  <!-- arrow 1 -->
  <path d="M 205 306 L 245 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- intermediate -->
  <rect x="250" y="276" width="120" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="300" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">temp[H][W]</text>
  <text x="310" y="318" text-anchor="middle" font-size="8" fill="#888">中间缓冲</text>
  <text x="310" y="330" text-anchor="middle" font-size="8" fill="#888">(HBM, 需额外内存)</text>

  <!-- arrow 2 -->
  <path d="M 375 306 L 415 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 2: vertical -->
  <rect x="420" y="256" width="170" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="505" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Pass 2: 垂直 1D</text>
  <text x="505" y="292" text-anchor="middle" font-size="8" fill="#555">temp → output</text>
  <text x="505" y="310" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a7a3a">output[i,j] =</text>
  <text x="505" y="322" text-anchor="middle" font-family="monospace" font-size="8" fill="#4a7a3a">Σ_m temp[i+m,j]·ky[m]</text>
  <text x="505" y="342" text-anchor="middle" font-size="8" fill="#888">每像素 K 次乘加</text>

  <!-- ===== Bottom: complexity comparison ===== -->
  <line x1="20" y1="376" x2="620" y2="376" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="392" width="580" height="112" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="412" font-size="11" fill="#444" font-weight="bold">计算量对比（每像素乘加次数）：</text>

  <!-- bar chart -->
  <g font-size="9" fill="#555">
    <!-- 2D conv bar -->
    <text x="44" y="436" fill="#b85450" font-weight="bold">2D 卷积</text>
    <rect x="110" y="424" width="252" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="370" y="436" fill="#b85450">K² = 49 (K=7)</text>

    <!-- separable bars -->
    <text x="44" y="462" fill="#446688" font-weight="bold">Pass 1</text>
    <rect x="110" y="450" width="72" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="190" y="462" fill="#446688">K = 7</text>

    <text x="44" y="484" fill="#4a7a3a" font-weight="bold">Pass 2</text>
    <rect x="110" y="472" width="72" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="190" y="484" fill="#4a7a3a">K = 7</text>

    <!-- total -->
    <text x="300" y="474" font-size="10" fill="#444" font-weight="bold">合计 2K = 14</text>
    <text x="300" y="490" font-size="9" fill="#4a7a3a">K=7 时 3.5× 加速</text>
    <text x="300" y="504" font-size="8" fill="#888">K=21 时 10.5× 加速</text>
  </g>
</svg>
