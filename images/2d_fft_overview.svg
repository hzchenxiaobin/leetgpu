<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold"
        fill="#333" filter="url(#rough2)">2D DFT 行-列分解 (Row-Column Decomposition)</text>

  <!-- ===== Input matrix ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="70" width="140" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="100" y="65" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">输入 signal</text>
    <text x="100" y="88" text-anchor="middle" font-size="11" fill="#446688">M × N 复数矩阵</text>
    <!-- grid lines -->
    <line x1="30" y1="105" x2="170" y2="105" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="30" y1="140" x2="170" y2="140" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="30" y1="175" x2="170" y2="175" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="65" y1="70" x2="65" y2="210" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="100" y1="70" x2="100" y2="210" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="135" y1="70" x2="135" y2="210" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,3"/>
    <!-- row highlight -->
    <rect x="30" y="105" width="140" height="35" fill="none" stroke="#d6a040" stroke-width="2.5" rx="2"/>
    <text x="180" y="127" font-size="10" fill="#d6a040">← 第 r 行</text>
  </g>

  <!-- Arrow 1 -->
  <g filter="url(#rough2)">
    <line x1="185" y1="140" x2="245" y2="140" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="215" y="130" text-anchor="middle" font-size="10" fill="#446688">Pass 1</text>
    <text x="215" y="155" text-anchor="middle" font-size="9" fill="#446688">行 DFT</text>
  </g>

  <!-- ===== Temp matrix ===== -->
  <g filter="url(#rough2)">
    <rect x="260" y="70" width="140" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="330" y="65" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">中间 temp</text>
    <text x="330" y="88" text-anchor="middle" font-size="11" fill="#d6a040">行变换后 X'</text>
    <line x1="260" y1="105" x2="400" y2="105" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="260" y1="140" x2="400" y2="140" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="260" y1="175" x2="400" y2="175" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="295" y1="70" x2="295" y2="210" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="330" y1="70" x2="330" y2="210" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="365" y1="70" x2="365" y2="210" stroke="#d6a040" stroke-width="0.5" stroke-dasharray="3,3"/>
    <!-- column highlight -->
    <rect x="295" y="70" width="35" height="140" fill="none" stroke="#b85450" stroke-width="2.5" rx="2"/>
    <text x="340" y="62" font-size="10" fill="#b85450">↑ 第 c 列</text>
  </g>

  <!-- Arrow 2 -->
  <g filter="url(#rough2)">
    <line x1="415" y1="140" x2="475" y2="140" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="445" y="130" text-anchor="middle" font-size="10" fill="#446688">Pass 2</text>
    <text x="445" y="155" text-anchor="middle" font-size="9" fill="#446688">列 DFT</text>
  </g>

  <!-- ===== Output matrix ===== -->
  <g filter="url(#rough2)">
    <rect x="490" y="70" width="140" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="560" y="65" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">输出 spectrum</text>
    <text x="560" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a">2D DFT 结果 X</text>
    <line x1="490" y1="105" x2="630" y2="105" stroke="#4a7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="490" y1="140" x2="630" y2="140" stroke="#4a7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="490" y1="175" x2="630" y2="175" stroke="#4a7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="525" y1="70" x2="525" y2="210" stroke="#4a7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="560" y1="70" x2="560" y2="210" stroke="#4a7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
    <line x1="595" y1="70" x2="595" y2="210" stroke="#4a7a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
  </g>

  <!-- ===== Kernel mapping box ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="240" width="600" height="155" fill="#fafafa" stroke="#999" stroke-width="1" rx="6" stroke-dasharray="5,3"/>

    <!-- Pass 1 box -->
    <rect x="50" y="255" width="250" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="175" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">Pass 1: 行 DFT</text>
    <text x="60" y="295" font-size="10" fill="#333">grid = M blocks (每 block 一行)</text>
    <text x="60" y="312" font-size="10" fill="#333">DFT 长度 = N</text>
    <text x="60" y="329" font-size="10" fill="#333">elem_stride = 1 (合并访存 ✓)</text>
    <text x="60" y="346" font-size="10" fill="#333">dft_stride = N</text>
    <text x="60" y="363" font-size="10" fill="#d6a040">X'[r,l] = Σ x[r,n]·W_N^(nl)</text>

    <!-- Pass 2 box -->
    <rect x="360" y="255" width="250" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="485" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">Pass 2: 列 DFT</text>
    <text x="370" y="295" font-size="10" fill="#333">grid = N blocks (每 block 一列)</text>
    <text x="370" y="312" font-size="10" fill="#333">DFT 长度 = M</text>
    <text x="370" y="329" font-size="10" fill="#b85450">elem_stride = N (非合并 ⚠)</text>
    <text x="370" y="346" font-size="10" fill="#333">dft_stride = 1</text>
    <text x="370" y="363" font-size="10" fill="#d6a040">X[k,l] = Σ X'[m,l]·W_M^(mk)</text>
  </g>
</svg>
