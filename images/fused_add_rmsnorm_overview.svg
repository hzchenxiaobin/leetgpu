<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#fdfcf7"/>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Fused Add+RMSNorm：朴素两 kernel（中间 temp）vs 融合单 kernel（无 temp）</text>
  <path d="M 200 38 Q 450 48 700 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 上半：朴素两 kernel ============ -->
  <g filter="url(#sk)"><rect x="30" y="60" width="840" height="210" rx="8" fill="#fff3f0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 3"/></g>
  <text x="50" y="82" font-size="13" font-weight="bold" fill="#b85450">朴素版：2 个 kernel + 中间临时张量 temp（5·MD 字节 HBM）</text>

  <!-- x + residual -->
  <g filter="url(#sk)">
    <rect x="50" y="110" width="60" height="80" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="80" y="155" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">x</text>
    <text x="80" y="170" text-anchor="middle" font-size="9" fill="#2b6e9e">M×D</text>
    <rect x="120" y="110" width="60" height="80" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="150" y="155" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">res</text>
    <text x="150" y="170" text-anchor="middle" font-size="9" fill="#2b6e9e">M×D</text>
  </g>
  <text x="115" y="100" text-anchor="middle" font-size="9" fill="#7a5415">读 2·MD</text>

  <!-- Kernel 1: add -->
  <g filter="url(#sk)"><rect x="215" y="120" width="95" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="262" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">Kernel 1</text>
  <text x="262" y="158" text-anchor="middle" font-size="9.5" fill="#444">elementwise</text>
  <text x="262" y="172" text-anchor="middle" font-size="9.5" fill="#444">add</text>
  <path d="M 182 150 L 212 150" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- temp (中间张量 - 红色高亮) -->
  <g filter="url(#sk)">
    <rect x="345" y="110" width="70" height="80" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 2"/>
    <text x="380" y="148" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">temp</text>
    <text x="380" y="163" text-anchor="middle" font-size="9" fill="#b85450">M×D</text>
    <text x="380" y="178" text-anchor="middle" font-size="8.5" fill="#b85450">⚠ 中间物化</text>
  </g>
  <text x="330" y="100" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">写 MD</text>
  <path d="M 312 150 L 342 150" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Kernel 2: rmsnorm -->
  <g filter="url(#sk)"><rect x="455" y="120" width="95" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="502" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">Kernel 2</text>
  <text x="502" y="158" text-anchor="middle" font-size="9.5" fill="#444">RMSNorm</text>
  <text x="502" y="172" text-anchor="middle" font-size="9" fill="#7a5415">归约+归一化</text>
  <text x="430" y="100" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">读 MD</text>
  <path d="M 417 150 L 452 150" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- y -->
  <g filter="url(#sk)">
    <rect x="585" y="110" width="60" height="80" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <text x="615" y="155" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">y</text>
    <text x="615" y="170" text-anchor="middle" font-size="9" fill="#2e6e2e">M×D</text>
  </g>
  <text x="615" y="100" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">写 MD</text>
  <path d="M 552 150 L 582 150" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 流量标注 -->
  <text x="700" y="135" font-size="10.5" fill="#444">合计 HBM：</text>
  <text x="700" y="155" font-size="12" fill="#b85450" font-weight="bold">5·MD·4 B</text>
  <text x="700" y="172" font-size="9.5" fill="#b85450">temp 写+读 = 2·MD 浪费</text>

  <!-- ============ 下半：融合单 kernel ============ -->
  <g filter="url(#sk)"><rect x="30" y="290" width="840" height="210" rx="8" fill="#f0faf2" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="6 3"/></g>
  <text x="50" y="312" font-size="13" font-weight="bold" fill="#2e6e2e">融合版：1 个 kernel，h 留 register（3·MD 字节 HBM，省 40%）</text>

  <!-- x + residual -->
  <g filter="url(#sk)">
    <rect x="80" y="340" width="60" height="80" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="110" y="385" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">x</text>
    <text x="110" y="400" text-anchor="middle" font-size="9" fill="#2b6e9e">M×D</text>
    <rect x="155" y="340" width="60" height="80" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="185" y="385" text-anchor="middle" font-size="9" fill="#2b6e9e" font-weight="bold">res</text>
    <text x="185" y="400" text-anchor="middle" font-size="9" fill="#2b6e9e">M×D</text>
  </g>
  <text x="148" y="330" text-anchor="middle" font-size="9" fill="#7a5415">读 2·MD</text>

  <!-- Fused kernel -->
  <g filter="url(#sk)"><rect x="260" y="340" width="170" height="80" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="345" y="365" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">融合 Kernel</text>
  <text x="345" y="382" text-anchor="middle" font-size="9.5" fill="#444">Pass1: h=x+res, Σh²</text>
  <text x="345" y="397" text-anchor="middle" font-size="9.5" fill="#444">Pass2: y=h·rrms·γ</text>
  <text x="345" y="412" text-anchor="middle" font-size="8.5" fill="#2e6e2e">h 全程在 register ✓</text>
  <path d="M 217 380 L 257 380" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 被消除的 temp（虚线/划掉） -->
  <g filter="url(#sk)">
    <rect x="318" y="280" width="60" height="0" rx="4" fill="none"/>
    <text x="345" y="445" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">temp → 已消除 ✓</text>
    <path d="M 305 448 Q 345 460 385 448" stroke="#4a8e4a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  </g>

  <!-- y -->
  <g filter="url(#sk)">
    <rect x="490" y="340" width="60" height="80" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <text x="520" y="385" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">y</text>
    <text x="520" y="400" text-anchor="middle" font-size="9" fill="#2e6e2e">M×D</text>
  </g>
  <text x="520" y="330" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">写 MD</text>
  <path d="M 432 380 L 487 380" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 流量标注 -->
  <text x="595" y="365" font-size="10.5" fill="#444">合计 HBM：</text>
  <text x="595" y="385" font-size="12" fill="#2e6e2e" font-weight="bold">3·MD·4 B</text>
  <text x="595" y="402" font-size="9.5" fill="#2e6e2e">省 2·MD（40%）</text>
  <text x="595" y="418" font-size="9.5" fill="#7a5415">kernel 启动 1 次</text>

  <!-- 底部洞察 -->
  <g filter="url(#sk)"><rect x="50" y="515" width="800" height="18" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="450" y="528" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">关键洞察：融合不改变计算量，只消除中间 temp 的 HBM 写+读 → memory-bound kernel 的 40% 流量直接 = 40% 加速</text>
</svg>
