<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">SpMM 概览：稀疏 A × 稠密 B → 稠密 C</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">跳过 A 的零元素，只对非零元 × B 对应行做 scaled accumulation</text>

  <!-- ===== Formula ===== -->
  <rect x="120" y="56" width="400" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">C[i,j] = Σ_k A[i,k] · B[k,j]  (A 稀疏, 只遍历 A[i,k]≠0)</text>

  <!-- ===== A sparse ===== -->
  <text x="100" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">A (M×N, 稀疏)</text>
  <rect x="40" y="126" width="120" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="9" fill="#446688">2  0  0  1</text>
  <text x="100" y="168" text-anchor="middle" font-size="9" fill="#446688">0  3  0  0</text>
  <text x="100" y="188" text-anchor="middle" font-size="9" fill="#446688">0  0  4  0</text>
  <text x="100" y="220" text-anchor="middle" font-size="8" fill="#888">~35% 非零</text>
  <text x="100" y="234" text-anchor="middle" font-size="8" fill="#888">nnz=4</text>

  <!-- Arrow -->
  <text x="195" y="180" text-anchor="middle" font-size="9" fill="#888">非零元 ×</text>
  <line x1="165" y1="186" x2="215" y2="186" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== B dense ===== -->
  <text x="290" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">B (N×K, 稠密)</text>
  <rect x="230" y="126" width="120" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">1  2</text>
  <text x="290" y="168" text-anchor="middle" font-size="9" fill="#4a7a3a">3  4</text>
  <text x="290" y="188" text-anchor="middle" font-size="9" fill="#4a7a3a">5  6</text>
  <text x="290" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">7  8</text>
  <text x="290" y="234" text-anchor="middle" font-size="8" fill="#888">所有元素参与</text>

  <!-- Arrow -->
  <text x="400" y="180" text-anchor="middle" font-size="9" fill="#888">→</text>
  <line x1="355" y1="186" x2="415" y2="186" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== C dense ===== -->
  <text x="490" y="118" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">C (M×K, 稠密)</text>
  <rect x="430" y="126" width="120" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="490" y="158" text-anchor="middle" font-size="10" fill="#d6a040">9   12</text>
  <text x="490" y="186" text-anchor="middle" font-size="10" fill="#d6a040">9   12</text>
  <text x="490" y="214" text-anchor="middle" font-size="10" fill="#d6a040">20  24</text>

  <!-- ===== Bottom: computation pattern ===== -->
  <text x="320" y="276" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">每行独立：遍历 A 的非零元，scale B 的对应行累加到 C</text>

  <rect x="30" y="288" width="580" height="56" fill="#e8f0fe" fill-opacity="0.15" stroke="#446688" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="308" font-size="10" fill="#446688" font-weight="bold">Row 0: A[0,0]=2 × B[0,:] + A[0,3]=1 × B[3,:]</text>
  <text x="40" y="324" font-size="9" fill="#888">= 2×[1,2] + 1×[7,8] = [2,4]+[7,8] = [9,12] ✓ (跳过 A[0,1]=0, A[0,2]=0)</text>
  <text x="300" y="308" font-size="10" fill="#4a7a3a" font-weight="bold">Row 1: A[1,1]=3 × B[1,:]</text>
  <text x="300" y="324" font-size="9" fill="#888">= 3×[3,4] = [9,12] ✓</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="360" width="580" height="48" fill="#fce4ec" fill-opacity="0.2" stroke="#b85450" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">核心：跳过零元素，计算量从 O(M·N·K) 降到 O(nnz·K)</text>
  <text x="320" y="398" text-anchor="middle" font-size="10" fill="#888">65% 稀疏时计算量仅为稠密的 35%，B 行读取次数也从 N 降到 nnz</text>
</svg>
