<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Monte Carlo Integration：采样求均值 × 区间宽度</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">∫ₐᵇ f(x)dx ≈ (b-a) × (1/n) × Σ yᵢ，本质是大规模 reduction</text>

  <!-- ===== Left: geometric interpretation ===== -->
  <text x="160" y="76" font-size="12" fill="#446688" font-weight="bold">几何意义</text>
  <g font-size="9" fill="#333">
    <!-- axes -->
    <line x1="60" y1="200" x2="260" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="60" y1="200" x2="60" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="265" y="204" font-size="8" fill="#666">x</text>
    <text x="50" y="76" font-size="8" fill="#666">f(x)</text>

    <!-- function curve (parabola y = x²) -->
    <path d="M 60 200 Q 160 200 260 90" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

    <!-- area under curve (shaded) -->
    <path d="M 80 200 L 80 168 Q 160 168 240 96 L 240 200 Z" fill="#e8f0fe" opacity="0.6" filter="url(#rough2)"/>
    <text x="160" y="220" text-anchor="middle" font-size="8" fill="#446688">∫ₐᵇ f(x)dx ≈ 阴影面积</text>

    <!-- sample points -->
    <g fill="#b85450" filter="url(#rough2)">
      <circle cx="90" cy="183" r="3"/>
      <circle cx="120" cy="162" r="3"/>
      <circle cx="150" cy="148" r="3"/>
      <circle cx="180" cy="130" r="3"/>
      <circle cx="210" cy="112" r="3"/>
      <circle cx="235" cy="98" r="3"/>
    </g>
    <!-- dashed lines from samples to x-axis -->
    <g stroke="#b85450" stroke-width="0.5" stroke-dasharray="2 2" filter="url(#rough2)">
      <line x1="90" y1="183" x2="90" y2="200"/>
      <line x1="120" y1="162" x2="120" y2="200"/>
      <line x1="150" y1="148" x2="150" y2="200"/>
      <line x1="180" y1="130" x2="180" y2="200"/>
      <line x1="210" y1="112" x2="210" y2="200"/>
    </g>
    <text x="160" y="245" text-anchor="middle" font-size="8" fill="#b85450">● 随机采样点 yᵢ = f(xᵢ)</text>

    <!-- interval labels -->
    <text x="80" y="214" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">a</text>
    <text x="240" y="214" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">b</text>
    <line x1="80" y1="205" x2="80" y2="210" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <line x1="240" y1="205" x2="240" y2="210" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="160" y="260" text-anchor="middle" font-size="8" fill="#4a7a3a">(b - a) = 区间宽度</text>
  </g>

  <!-- arrow to formula -->
  <path d="M 280 160 L 320 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="150" text-anchor="middle" font-size="8" fill="#666">≈</text>

  <!-- ===== Right: formula and reduction ===== -->
  <text x="480" y="76" font-size="12" fill="#d6a040" font-weight="bold">计算公式</text>
  <g font-size="9" fill="#333">
    <rect x="340" y="84" width="260" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="470" y="106" text-anchor="middle" font-family="monospace" font-size="11" fill="#d6a040" font-weight="bold">result = (b - a) × mean(y)</text>
    <text x="470" y="124" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">mean(y) = (1/n) × Σᵢ yᵢ</text>
    <text x="470" y="142" text-anchor="middle" font-size="8" fill="#888">核心：对 n 个 y_samples 做 sum reduction</text>
  </g>

  <!-- Reduction view -->
  <text x="480" y="178" font-size="12" fill="#4a7a3a" font-weight="bold">本质：大规模 Reduction</text>
  <g font-size="9" fill="#333">
    <rect x="340" y="186" width="260" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="354" y="206" font-size="9" fill="#4a7a3a">y_samples[0..n-1]</text>
    <text x="354" y="222" font-family="monospace" font-size="8" fill="#555">→ block 归约（每 block 求部分和）</text>
    <text x="354" y="236" font-family="monospace" font-size="8" fill="#555">→ atomicAdd 聚合所有 block</text>
    <text x="354" y="250" font-family="monospace" font-size="8" fill="#4a7a3a">→ result = sum / n × (b-a)</text>
    <text x="354" y="262" font-size="8" fill="#888">n=10M → 40MB 数据，纯 reduction</text>
  </g>

  <!-- ===== Bottom: worked example ===== -->
  <line x1="20" y1="288" x2="620" y2="288" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="304" width="580" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="324" font-size="11" fill="#446688" font-weight="bold">Worked Example（题目示例）：</text>
  <text x="60" y="342" font-family="monospace" font-size="9" fill="#555">a=0, b=2, n=8, y=[0.0625, 0.25, 0.5625, 1.0, 1.5625, 2.25, 3.0625, 4.0]</text>
  <text x="60" y="358" font-family="monospace" font-size="9" fill="#4a7a3a">sum = 0.0625+0.25+...+4.0 = 12.75,  mean = 12.75/8 = 1.59375</text>
  <text x="60" y="370" font-family="monospace" font-size="9" fill="#d6a040" font-weight="bold">result = (2-0) × 1.59375 = 3.1875 ✓</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="388" width="580" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="408" font-size="11" fill="#d6a040" font-weight="bold">💡 关键洞察</text>
  <text x="60" y="424" font-size="10" fill="#555">Monte Carlo 积分 = sum reduction + 标量乘法。n=10M 的归约是 memory-bound（算术强度 ~0.25 FLOP/B），</text>
  <text x="60" y="438" font-size="10" fill="#555">瓶颈在 HBM 带宽。优化方向：grid-stride loop + warp shuffle + atomicAdd 两级归约，与 #4 Reduction 同构。</text>
</svg>
