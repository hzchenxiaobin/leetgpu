<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">PPO Clipped Surrogate Loss 概览：单 kernel 全融合</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">ratio → clip → surrogate → mean 全在寄存器，3 遍 HBM 读 + 1 标量写</text>

  <!-- ===== Inputs (left) ===== -->
  <text x="70" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入 (B, S)</text>
  <rect x="22" y="100" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="120" text-anchor="middle" font-size="10" fill="#446688">advantages</text>
  <rect x="22" y="138" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="158" text-anchor="middle" font-size="10" fill="#446688">log_pi</text>
  <rect x="22" y="176" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="196" text-anchor="middle" font-size="10" fill="#446688">log_pi_old</text>

  <!-- ===== Fused Kernel (center) ===== -->
  <line x1="120" y1="115" x2="180" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="120" y1="153" x2="180" y2="165" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="120" y1="191" x2="180" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="182" y="110" width="300" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="332" y="134" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ppo_loss_kernel（全融合）</text>
  <text x="332" y="152" text-anchor="middle" font-size="9" fill="#555">1 block / (b) 行，grid-stride 扫 S 个 token</text>

  <!-- Steps inside kernel -->
  <rect x="196" y="162" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="236" y="178" text-anchor="middle" font-size="9" fill="#d6a040">ratio=exp()</text>

  <rect x="284" y="162" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="324" y="178" text-anchor="middle" font-size="9" fill="#d6a040">clip(r,lo,hi)</text>

  <rect x="372" y="162" width="96" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="178" text-anchor="middle" font-size="9" fill="#d6a040">min(r·A, clip·A)</text>

  <line x1="278" y1="174" x2="282" y2="174" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="366" y1="174" x2="370" y2="174" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="332" y="204" text-anchor="middle" font-size="9" fill="#555">↑ 三步全在寄存器，零中间数组</text>

  <rect x="226" y="214" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="276" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a">block_reduce_sum</text>

  <rect x="340" y="214" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="230" text-anchor="middle" font-size="9" fill="#4a7a3a">atomicAdd(out)</text>

  <line x1="328" y1="226" x2="338" y2="226" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <line x1="484" y1="180" x2="540" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="172" text-anchor="middle" font-size="9" fill="#888">-mean</text>
  <rect x="542" y="156" width="84" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="584" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">output</text>
  <text x="584" y="196" text-anchor="middle" font-size="9" fill="#888">(1,) 标量</text>

  <!-- ===== Bottom: reduction flow ===== -->
  <text x="330" y="288" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">两级归约结构</text>

  <rect x="56" y="304" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="136" y="324" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">线程级（grid-stride）</text>
  <text x="136" y="340" text-anchor="middle" font-size="9" fill="#555">每线程累加 S/256 个 token</text>

  <rect x="252" y="304" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="332" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">块级（warp shuffle）</text>
  <text x="332" y="340" text-anchor="middle" font-size="9" fill="#555">block_reduce_sum → 1 float</text>

  <rect x="448" y="304" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="528" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">全局（atomicAdd）</text>
  <text x="528" y="340" text-anchor="middle" font-size="9" fill="#555">B 个 block → output[0]</text>

  <line x1="218" y1="326" x2="250" y2="326" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="414" y1="326" x2="446" y2="326" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="330" y="380" text-anchor="middle" font-size="10" fill="#888">朴素版需 3 个 (B,S) 中间数组（6 遍 HBM）；融合后 3 遍读 + 1 标量写</text>
  <text x="330" y="398" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">HBM 流量减半，memory-bound 收益最大</text>
</svg>
