<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">LayerNorm：一个 block 负责一行，两阶段归约（mean → variance）</text>
  <path d="M 230 38 Q 440 46 650 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 输入矩阵 x [M×D] ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="80" width="150" height="150" rx="5" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <line x1="40" y1="117" x2="190" y2="117" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="40" y1="154" x2="190" y2="154" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="40" y1="191" x2="190" y2="191" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="77" y1="80" x2="77" y2="230" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="115" y1="80" x2="115" y2="230" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="152" y1="80" x2="152" y2="230" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="115" y="74" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">x [M×D]</text>
  <!-- highlight row r -->
  <g filter="url(#sk)"><rect x="40" y="80" width="150" height="37" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="115" y="103" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">第 r 行（block r 处理）</text>

  <!-- block of threads -->
  <g filter="url(#sk)">
    <circle cx="222" cy="99" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="240" cy="99" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="258" cy="99" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="276" cy="99" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="298" y="103" font-size="10" fill="#7a5415" font-weight="bold">...256</text>
  </g>
  <text x="250" y="84" text-anchor="middle" font-size="9" fill="#7a5415">block r：grid-stride 扫 D</text>
  <path d="M 192 99 L 214 99" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 三阶段 pipeline ===== -->
  <!-- Pass 1: mean -->
  <g filter="url(#sk)"><rect x="340" y="70" width="150" height="64" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="415" y="90" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Pass 1：求 mean</text>
  <text x="415" y="108" text-anchor="middle" font-size="9.5" fill="#444">block_reduce_sum(x) / D</text>
  <text x="415" y="124" text-anchor="middle" font-size="9" fill="#7a5415">第 1 次块归约</text>

  <!-- Pass 2: variance (depends on mean) -->
  <g filter="url(#sk)"><rect x="340" y="168" width="150" height="64" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="415" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Pass 2：求 variance</text>
  <text x="415" y="206" text-anchor="middle" font-size="9.5" fill="#444">block_reduce_sum((x-μ)²)/D</text>
  <text x="415" y="222" text-anchor="middle" font-size="9" fill="#7a5415">第 2 次块归约（依赖 μ）</text>

  <!-- Pass 3: normalize -->
  <g filter="url(#sk)"><rect x="340" y="266" width="150" height="64" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="415" y="286" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">Pass 3：归一化</text>
  <text x="415" y="304" text-anchor="middle" font-size="9.5" fill="#444">y=(x-μ)·rstd·γ+β</text>
  <text x="415" y="320" text-anchor="middle" font-size="9" fill="#7a5415">逐元素写回</text>

  <!-- arrows between passes -->
  <path d="M 415 134 L 415 166" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 415 232 L 415 264" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="425" y="156" font-size="9" fill="#b85450" font-weight="bold">μ 广播</text>
  <text x="425" y="254" font-size="9" fill="#2e6e2e" font-weight="bold">rstd 广播</text>

  <path d="M 310 99 L 338 100" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 输出 y ===== -->
  <g filter="url(#sk)">
    <rect x="540" y="80" width="150" height="150" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <line x1="540" y1="117" x2="690" y2="117" stroke="#4a8e4a" stroke-width="0.8"/>
    <line x1="540" y1="154" x2="690" y2="154" stroke="#4a8e4a" stroke-width="0.8"/>
    <line x1="540" y1="191" x2="690" y2="191" stroke="#4a8e4a" stroke-width="0.8"/>
    <line x1="577" y1="80" x2="577" y2="230" stroke="#4a8e4a" stroke-width="0.8"/>
    <line x1="615" y1="80" x2="615" y2="230" stroke="#4a8e4a" stroke-width="0.8"/>
    <line x1="652" y1="80" x2="652" y2="230" stroke="#4a8e4a" stroke-width="0.8"/>
  </g>
  <text x="615" y="74" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">y [M×D]</text>
  <g filter="url(#sk)"><rect x="540" y="80" width="150" height="37" rx="2" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <path d="M 492 298 Q 530 200 538 110" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 对比 RMSNorm ===== -->
  <g filter="url(#sk)"><rect x="40" y="360" width="800" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="440" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">LayerNorm vs RMSNorm：归约次数决定 HBM 读遍数</text>

  <text x="60" y="410" font-size="10.5" fill="#444">• <tspan font-weight="bold" fill="#b85450">LayerNorm</tspan>：两次块归约（μ → var，且 var 依赖 μ）→ x 读 3 遍（mean/var/normalize）</text>
  <text x="60" y="430" font-size="10.5" fill="#444">• <tspan font-weight="bold" fill="#2e6e2e">RMSNorm</tspan>：一次块归约（sum of squares）→ x 读 2 遍；省掉 mean-centering</text>
  <text x="60" y="450" font-size="10.5" fill="#444">• 两者均 memory-bound（AI ≈ 0.4 FLOP/byte）；优化主线相同：shared 缓存 x 把读遍数降到 1</text>

  <g filter="url(#sk)"><rect x="60" y="460" width="760" height="16" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="440" y="472" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">关键洞察：variance 依赖 mean → 必须串行两次归约；这是 LayerNorm 比 RMSNorm 多一遍 HBM 读的根因</text>
</svg>
