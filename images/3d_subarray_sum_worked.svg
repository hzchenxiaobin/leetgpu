<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="920" height="600" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Worked Example：3D 子立方体求和逐步演算（N=2, M=2, K=3）</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="60" y="76" font-size="12" font-weight="bold" fill="#2b6e9e">输入体数据（橙色 = 子立方体 [S_DEP=0..1][S_ROW=0..0][S_COL=1..2]）</text>

  <!-- slice d=0 -->
  <text x="60" y="102" font-size="11" font-weight="bold" fill="#2b6e9e">slice d=0</text>
  <g filter="url(#sk)">
    <rect x="130" y="86" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="180" y="86" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="230" y="86" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="130" y="114" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="180" y="114" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="230" y="114" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="155" y="105" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="205" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">2</text>
  <text x="255" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">3</text>
  <text x="155" y="133" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <text x="205" y="133" text-anchor="middle" font-size="12" fill="#2b6e9e">5</text>
  <text x="255" y="133" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="120" y="105" text-anchor="end" font-size="9" fill="#888">row0</text>

  <!-- slice d=1 -->
  <text x="360" y="102" font-size="11" font-weight="bold" fill="#2b6e9e">slice d=1</text>
  <g filter="url(#sk)">
    <rect x="430" y="86" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="480" y="86" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="530" y="86" width="50" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="430" y="114" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="480" y="114" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="530" y="114" width="50" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="455" y="105" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <text x="505" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="555" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="455" y="133" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="505" y="133" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="555" y="133" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="420" y="105" text-anchor="end" font-size="9" fill="#888">row0</text>

  <text x="640" y="105" font-size="10" fill="#888">dep_len=2, row_len=1</text>
  <text x="640" y="120" font-size="10" fill="#888">col_len=2, plane=1×2=2</text>
  <text x="640" y="135" font-size="10" fill="#888">total=2×1×2=4</text>

  <!-- arrow to offset table -->
  <path d="M 460 150 L 460 176" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="472" y="170" font-size="11" fill="#7a5415">展平 + 偏移映射</text>

  <!-- offset mapping table -->
  <text x="60" y="196" font-size="12" font-weight="bold" fill="#2b6e9e">偏移映射：off → (dep, r, c) → idx → input[idx]</text>
  <g filter="url(#sk)">
    <rect x="60" y="206" width="800" height="160" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1"/>
    <line x1="60" y1="234" x2="860" y2="234" stroke="#ccc" stroke-width="1"/>
    <line x1="220" y1="206" x2="220" y2="366" stroke="#ccc" stroke-width="1"/>
    <line x1="350" y1="206" x2="350" y2="366" stroke="#ccc" stroke-width="1"/>
    <line x1="490" y1="206" x2="490" y2="366" stroke="#ccc" stroke-width="1"/>
    <line x1="640" y1="206" x2="640" y2="366" stroke="#ccc" stroke-width="1"/>
    <line x1="750" y1="206" x2="750" y2="366" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="140" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">off</text>
  <text x="285" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">dep=off/plane</text>
  <text x="420" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">rem=off%plane</text>
  <text x="565" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">(r, c)=(rem/2, rem%2)</text>
  <text x="695" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">idx</text>
  <text x="805" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">input[idx]</text>

  <text x="140" y="258" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">0</text>
  <text x="285" y="258" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">0/2 = 0</text>
  <text x="420" y="258" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">0%2 = 0</text>
  <text x="565" y="258" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">(0, 0)</text>
  <text x="695" y="258" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e6e2e">1</text>
  <text x="805" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">2</text>

  <text x="140" y="286" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">1</text>
  <text x="285" y="286" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">1/2 = 0</text>
  <text x="420" y="286" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">1%2 = 1</text>
  <text x="565" y="286" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">(0, 1)</text>
  <text x="695" y="286" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e6e2e">2</text>
  <text x="805" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>

  <text x="140" y="314" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">2</text>
  <text x="285" y="314" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">2/2 = 1</text>
  <text x="420" y="314" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">2%2 = 0</text>
  <text x="565" y="314" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">(0, 0)</text>
  <text x="695" y="314" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e6e2e">7</text>
  <text x="805" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>

  <text x="140" y="342" text-anchor="middle" font-family="monospace" font-size="12" fill="#333">3</text>
  <text x="285" y="342" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">3/2 = 1</text>
  <text x="420" y="342" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">3%2 = 1</text>
  <text x="565" y="342" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a5415">(0, 1)</text>
  <text x="695" y="342" text-anchor="middle" font-family="monospace" font-size="12" fill="#2e6e2e">8</text>
  <text x="805" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>

  <text x="640" y="358" text-anchor="middle" font-size="10" fill="#888">idx = ((S_DEP+dep)·M + S_ROW+r)·K + S_COL+c</text>

  <!-- reduction tree -->
  <text x="60" y="402" font-size="12" font-weight="bold" fill="#2e6e2e">归约：4 个 thread 部分和 → warp shuffle 树形归约 → scratch → output</text>
  <g filter="url(#sk)">
    <rect x="120" y="416" width="60" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="260" y="416" width="60" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="400" y="416" width="60" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="540" y="416" width="60" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="150" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="290" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="430" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="570" y="438" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="150" y="464" text-anchor="middle" font-size="9" fill="#888">thread0</text>
  <text x="290" y="464" text-anchor="middle" font-size="9" fill="#888">thread1</text>
  <text x="430" y="464" text-anchor="middle" font-size="9" fill="#888">thread2</text>
  <text x="570" y="464" text-anchor="middle" font-size="9" fill="#888">thread3</text>

  <!-- shfl down offset=2 -->
  <path d="M 430 450 L 180 478" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 570 450 L 320 478" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="472" font-size="9" fill="#4a7a3a">__shfl_down offset=2</text>

  <g filter="url(#sk)">
    <rect x="120" y="486" width="60" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="260" y="486" width="60" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="150" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">3</text>
  <text x="290" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">2</text>

  <!-- shfl down offset=1 -->
  <path d="M 290 520 L 180 548" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="540" font-size="9" fill="#d6a040">offset=1</text>

  <g filter="url(#sk)">
    <rect x="120" y="556" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="160" y="578" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">7</text>
  <text x="160" y="606" text-anchor="middle" font-size="9" fill="#888">atomicAdd → scratch(long long)</text>

  <!-- final output -->
  <path d="M 205 573 Q 330 573 420 573" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="430" y="556" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="520" y="574" text-anchor="middle" font-size="11" fill="#2e6e2e">output[0] = (int)scratch</text>
  <text x="520" y="590" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">= 7 ✓</text>

  <!-- insight -->
  <g filter="url(#sk)">
    <rect x="660" y="416" width="230" height="170" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="678" y="440" font-size="12" font-weight="bold" fill="#444">💡 演算要点</text>
  <text x="678" y="462" font-size="11" fill="#444">① off=0,1 同属 d=0 片</text>
  <text x="678" y="478" font-size="11" fill="#444">  （dep=0, plane=2）</text>
  <text x="678" y="500" font-size="11" fill="#444">② off=2,3 跳到 d=1 片</text>
  <text x="678" y="516" font-size="11" fill="#444">  （dep=1，跨片不连续）</text>
  <text x="678" y="538" font-size="11" fill="#b85450">③ idx 1→2→7→8 非连续：</text>
  <text x="678" y="554" font-size="11" fill="#b85450">  跨片时 idx 跳跃 M·K=6</text>
  <text x="678" y="576" font-size="11" fill="#2e6e2e">归约骨架与 #47/#48 完全相同</text>
</svg>
