<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Level-Synchronous BFS：层间串行 launch / 层内全并行 pull</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">host 端层循环跑 O(diameter) 次，每次启动一个 kernel；kernel 内每个格子 pull 邻居状态</text>

  <!-- ===== 左侧：host 层循环 ===== -->
  <text x="30" y="74" font-size="12" fill="#d6a040" font-weight="bold">host 端层循环（串行）</text>
  <rect x="20" y="82" width="230" height="300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <g font-family="monospace" font-size="10" fill="#333">
    <text x="35" y="104">for level in 0..diameter:</text>
    <text x="55" y="122">launch bfs_pull&lt;&lt;&lt;grid&gt;&gt;&gt;</text>
    <text x="55" y="136">sync + check flag</text>
  </g>

  <!-- level steps -->
  <g font-size="9" fill="#d6a040">
    <rect x="45" y="148" width="70" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="80" y="163" text-anchor="middle">level = 0</text>
    <path d="M 80 172 L 80 186" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="45" y="188" width="70" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="80" y="203" text-anchor="middle">level = 1</text>
    <path d="M 80 212 L 80 226" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <rect x="45" y="228" width="70" height="22" fill="#fff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="80" y="243" text-anchor="middle">level = 2</text>
    <text x="130" y="243" font-size="14" fill="#888">⋯</text>

    <rect x="45" y="268" width="70" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="80" y="283" text-anchor="middle">flag=2 done</text>
  </g>

  <rect x="35" y="304" width="200" height="40" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="322" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">每次 launch = 全局同步</text>
  <text x="135" y="336" text-anchor="middle" font-size="9" fill="#888">天然充当层间屏障</text>

  <text x="135" y="362" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">O(diameter) 次串行 launch</text>
  <text x="135" y="376" text-anchor="middle" font-size="9" fill="#888">层间依赖无法并行</text>

  <!-- arrow to right -->
  <path d="M 250 200 L 285 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="267" y="192" text-anchor="middle" font-size="8" fill="#888">每次</text>

  <!-- ===== 右侧：kernel 内全格子并行 ===== -->
  <text x="300" y="74" font-size="12" fill="#446688" font-weight="bold">kernel 内全格子并行（1D grid）</text>
  <rect x="290" y="82" width="320" height="300" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <!-- BFS grid visualization: 7x7 cells showing wavefront -->
  <g font-size="9" fill="#446688">
    <!-- grid cells with distance values -->
    <!-- row 0 -->
    <rect x="320" y="110" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="336" y="128" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="352" y="110" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="368" y="128" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="384" y="110" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="400" y="128" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="416" y="110" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="432" y="128" text-anchor="middle" fill="#d6a040">3</text>
    <rect x="448" y="110" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="464" y="128" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="480" y="110" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <rect x="512" y="110" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>

    <!-- row 1 -->
    <rect x="320" y="138" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <rect x="352" y="138" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <rect x="384" y="138" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="400" y="156" text-anchor="middle" fill="#d6a040">3</text>
    <rect x="416" y="138" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <rect x="448" y="138" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="464" y="156" text-anchor="middle" fill="#d6a040">5</text>
    <rect x="480" y="138" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="496" y="156" text-anchor="middle" fill="#d6a040">6</text>
    <rect x="512" y="138" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="528" y="156" text-anchor="middle" fill="#d6a040">7</text>

    <!-- row 2 -->
    <rect x="320" y="166" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="336" y="184" text-anchor="middle" fill="#d6a040">1</text>
    <rect x="352" y="166" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="368" y="184" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="384" y="166" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="400" y="184" text-anchor="middle" fill="#d6a040">4</text>
    <rect x="416" y="166" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="432" y="184" text-anchor="middle" fill="#d6a040">5</text>
    <rect x="448" y="166" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="464" y="184" text-anchor="middle" fill="#d6a040">6</text>
    <rect x="480" y="166" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="496" y="184" text-anchor="middle" fill="#d6a040">7</text>
    <rect x="512" y="166" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="528" y="184" text-anchor="middle" fill="#d6a040">8</text>

    <!-- row 3 -->
    <rect x="320" y="194" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="336" y="212" text-anchor="middle" fill="#d6a040">2</text>
    <rect x="352" y="194" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <rect x="384" y="194" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <rect x="416" y="194" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <rect x="448" y="194" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="464" y="212" text-anchor="middle" fill="#d6a040">7</text>
    <rect x="480" y="194" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="496" y="212" text-anchor="middle" fill="#d6a040">8</text>
    <rect x="512" y="194" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="528" y="212" text-anchor="middle" fill="#4a7a3a" font-weight="bold">E</text>
  </g>

  <!-- legend -->
  <g font-size="8" fill="#666">
    <rect x="320" y="238" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
    <text x="338" y="248">start/end</text>
    <rect x="380" y="238" width="14" height="12" fill="#fff8e1" stroke="#d6a040" rx="2" filter="url(#rough2)"/>
    <text x="398" y="248">dist = level</text>
    <rect x="450" y="238" width="14" height="12" fill="#fce4ec" stroke="#b85450" rx="2" filter="url(#rough2)"/>
    <text x="468" y="248">障碍/未访问</text>
  </g>

  <!-- pull formula box -->
  <rect x="305" y="265" width="290" height="50" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="450" y="285" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">pull: 若 dist[idx]==-1 且</text>
  <text x="450" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">任意邻居 dist[neighbor]==level → dist[idx]=level+1</text>

  <text x="450" y="336" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">每格子只写自己的 dist → 零写竞争</text>
  <text x="450" y="350" text-anchor="middle" font-size="9" fill="#888">邻居的 dist==level 在本层稳定（上一层写定），可安全并行读</text>
  <text x="450" y="364" text-anchor="middle" font-size="9" fill="#888">launch 间全局同步 = 层间屏障</text>

  <!-- bottom note -->
  <rect x="20" y="396" width="600" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">核心洞察：层间必须串行（前层结果是后层输入），但每层内全部格子互不冲突 → pull-based 消除写竞争</text>
  <text x="320" y="426" text-anchor="middle" font-size="9" fill="#888">与 Floyd-Warshall 同属「host 外层循环 + kernel 内并行」模板，区别在于 BFS 的层依赖是距离依赖</text>
</svg>
