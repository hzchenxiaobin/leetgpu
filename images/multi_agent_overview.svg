<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fdfcf7"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Multi-Agent Simulation：O(N²) 邻居交互 + 平均速度归约</text>
  <path d="M 250 42 Q 460 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- agents input -->
  <text x="40" y="78" font-size="12" font-weight="bold" fill="#2b6e9e">N 个 agent（agents[4N]，交错 [px,py,vx,vy]）</text>
  <g filter="url(#sk)">
    <rect x="40" y="88" width="96" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="136" y="88" width="96" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="232" y="88" width="96" height="40" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="88" y="106" text-anchor="middle" font-size="9" fill="#2b6e9e">agent0</text>
  <text x="88" y="120" text-anchor="middle" font-size="8" fill="#2b6e9e">pos·vel</text>
  <text x="184" y="106" text-anchor="middle" font-size="9" fill="#2b6e9e">agent1</text>
  <text x="280" y="106" text-anchor="middle" font-size="9" fill="#2b6e9e">...</text>
  <text x="40" y="142" font-size="9" fill="#888">每个 agent 4 个 float</text>

  <!-- pairwise interaction -->
  <text x="380" y="78" font-size="12" font-weight="bold" fill="#7a5415">每 agent i 遍历全部 j：判距 &lt; r² → 累加 vⱼ</text>
  <g filter="url(#sk)">
    <rect x="380" y="90" width="40" height="40" rx="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="500" y="90" width="40" height="40" rx="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="560" y="90" width="40" height="40" rx="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="400" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">i</text>
  <text x="520" y="114" text-anchor="middle" font-size="10" fill="#7a5415">j</text>
  <text x="580" y="114" text-anchor="middle" font-size="10" fill="#7a5415">j</text>
  <path d="M 420 110 L 498 110" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 112 L 558 112" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="460" y="100" text-anchor="middle" font-size="8" fill="#b85450">d² &lt; 25 ✓ 累加</text>
  <text x="492" y="138" text-anchor="middle" font-size="8" fill="#888">d² ≥ 25 ✗ 跳过</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="40" y="150" width="840" height="54" rx="8" fill="#f0f7ff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="460" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">v̄ᵢ = (Σ_{j∈𝒩ᵢ} vⱼ) / |𝒩ᵢ|　→　vᵢ' = vᵢ + α(v̄ᵢ − vᵢ)　→　pᵢ' = pᵢ + vᵢ'</text>
  <text x="460" y="194" text-anchor="middle" font-size="10" fill="#888">α=0.05, r=5.0(r²=25); 无邻居时 v̄ᵢ=vᵢ（速度不变）; O(N²) 对交互, 每对 ~7 FLOP</text>

  <!-- output -->
  <text x="640" y="78" font-size="12" font-weight="bold" fill="#2e6e2e">输出 agents_next[4N]</text>
  <g filter="url(#sk)">
    <rect x="640" y="88" width="96" height="40" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="736" y="88" width="96" height="40" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="688" y="106" text-anchor="middle" font-size="9" fill="#2e6e2e">agent0'</text>
  <text x="688" y="120" text-anchor="middle" font-size="8" fill="#2e6e2e">p'·v'</text>
  <text x="784" y="106" text-anchor="middle" font-size="9" fill="#2e6e2e">...</text>
  <path d="M 600 110 L 636 110" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- naive vs tiled -->
  <text x="40" y="232" font-size="13" font-weight="bold" fill="#2b2b2b">两种实现对比</text>

  <g filter="url(#sk)">
    <rect x="40" y="244" width="410" height="142" rx="8" fill="#fff5f5" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="245" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">朴素：每线程一个 i，遍历全部 N 个 j</text>
  <text x="55" y="290" font-size="11" fill="#444">• 每 thread 读 N 个 agent（从 global）</text>
  <text x="55" y="310" font-size="11" fill="#444">• N 个 thread 共 N² 次 agent 读取 = N²×4 float</text>
  <text x="55" y="330" font-size="11" fill="#b85450">• reference agent 跨 block 重复读 N 次（无复用）</text>
  <text x="55" y="350" font-size="11" fill="#b85450">• 看似 compute-bound，实则带宽浪费</text>
  <text x="55" y="370" font-size="10" fill="#888">N=10000 → 4亿次 float 读取，远超算力需求</text>

  <g filter="url(#sk)">
    <rect x="470" y="244" width="410" height="142" rx="8" fill="#f5fbf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="675" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">优化：tiled —— reference agent 分块载入 shared</text>
  <text x="485" y="290" font-size="11" fill="#444">• block 协作加载 256 个 agent 到 shared（float4）</text>
  <text x="485" y="310" font-size="11" fill="#444">• 256 个 thread 共享同一 tile，各算自己的 i</text>
  <text x="485" y="330" font-size="11" fill="#2e6e2e">• reference agent 每 block 只读 1 次，复用 256 次</text>
  <text x="485" y="350" font-size="11" fill="#2e6e2e">• 全局读流量降低 ~256 倍</text>
  <text x="485" y="370" font-size="10" fill="#888">算术强度↑, 真正吃满 compute</text>

  <!-- parallelization note -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="840" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="460" y="424" text-anchor="middle" font-size="12" fill="#7a5415">并行策略：一 agent 一线程（block=256）+ 内层串行遍历 j + per-thread 累加 sum_vx/sum_vy/count</text>
  <text x="460" y="440" text-anchor="middle" font-size="10" fill="#888">单 pass 跨 tile 累积即得全部邻居之和，无需中间数组 —— 与 nearest-neighbor(argmin) 同构，归约算子换成 sum/count</text>
</svg>
