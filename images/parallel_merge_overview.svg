<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Parallel Merge 概览：Merge Path + Co-rank 二分搜索</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">两个已排序数组的合并可视为 2D 网格中的路径，任意输出位置 k 的来源可通过二分搜索定位</text>

  <!-- ===== Merge matrix ===== -->
  <text x="40" y="80" font-size="12" fill="#446688" font-weight="bold">Merge Path 网格（A 向右，B 向下）</text>

  <!-- Grid -->
  <rect x="100" y="90" width="400" height="200" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- A labels (top) -->
  <text x="140" y="84" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="200" y="84" text-anchor="middle" font-size="10" fill="#446688">3</text>
  <text x="260" y="84" text-anchor="middle" font-size="10" fill="#446688">5</text>
  <text x="320" y="84" text-anchor="middle" font-size="10" fill="#446688">7</text>
  <text x="80" y="75" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A→</text>

  <!-- B labels (left) -->
  <text x="85" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <text x="85" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
  <text x="85" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">6</text>
  <text x="85" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a">8</text>
  <text x="70" y="105" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↓B</text>

  <!-- Grid lines -->
  <line x1="100" y1="90" x2="100" y2="290" stroke="#ddd" stroke-width="0.5"/>
  <line x1="160" y1="90" x2="160" y2="290" stroke="#ddd" stroke-width="0.5"/>
  <line x1="220" y1="90" x2="220" y2="290" stroke="#ddd" stroke-width="0.5"/>
  <line x1="280" y1="90" x2="280" y2="290" stroke="#ddd" stroke-width="0.5"/>
  <line x1="340" y1="90" x2="340" y2="290" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="110" x2="500" y2="110" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="150" x2="500" y2="150" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="190" x2="500" y2="190" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="230" x2="500" y2="230" stroke="#ddd" stroke-width="0.5"/>
  <line x1="100" y1="270" x2="500" y2="270" stroke="#ddd" stroke-width="0.5"/>

  <!-- Merge path (staircase) -->
  <path d="M 100 110 L 160 110 L 160 150 L 220 150 L 220 190 L 280 190 L 280 230 L 340 230 L 340 270 L 500 270"
        fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- Diagonal k=4 (dashed) -->
  <line x1="260" y1="90" x2="100" y2="230" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="200" y="170" font-size="9" fill="#d6a040" transform="rotate(-37 200 170)">diagonal k=4</text>

  <!-- Intersection point -->
  <circle cx="160" cy="150" r="5" fill="#d6a040" stroke="#333" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="148" font-size="9" fill="#d6a040" font-weight="bold">co-rank: i=1, j=3</text>

  <!-- ===== Output array ===== -->
  <text x="40" y="320" font-size="12" fill="#4a7a3a" font-weight="bold">输出 C（每 thread 独立算一个位置）</text>

  <rect x="100" y="330" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="350" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <rect x="145" y="330" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <rect x="190" y="330" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="350" text-anchor="middle" font-size="10" fill="#446688">3</text>
  <rect x="235" y="330" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
  <rect x="280" y="330" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="10" fill="#446688">5</text>
  <rect x="325" y="330" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="345" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">6</text>
  <rect x="370" y="330" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="390" y="350" text-anchor="middle" font-size="10" fill="#446688">7</text>
  <rect x="415" y="330" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="435" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">8</text>

  <text x="465" y="348" font-size="9" fill="#446688">← A</text>
  <text x="465" y="362" font-size="9" fill="#4a7a3a">← B</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="390" width="580" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">co_rank(k) = A 中应贡献的元素数 i，使 A[0..i-1] ⊕ B[0..k-i-1] = C[0..k-1]</text>
  <text x="320" y="424" text-anchor="middle" font-size="10" fill="#888">二分搜索 i ∈ [max(0,k−N), min(k,M)]，O(log min(M,N)) per thread → 完全并行</text>
</svg>
