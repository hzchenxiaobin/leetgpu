<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">GEMV Worked Example：N=4, K=4, x=[1,0,1,0]</text>
  <path d="M 260 38 Q 440 46 620 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== W matrix (left) ===== -->
  <text x="90" y="66" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">W [4×4]</text>
  <g filter="url(#sk)">
    <rect x="40" y="74" width="100" height="100" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <line x1="40" y1="99"  x2="140" y2="99"  stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="40" y1="124" x2="140" y2="124" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="40" y1="149" x2="140" y2="149" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="65"  y1="74" x2="65"  y2="174" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="90"  y1="74" x2="90"  y2="174" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="115" y1="74" x2="115" y2="174" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <!-- row 0 highlighted -->
  <g filter="url(#sk)"><rect x="40" y="74" width="100" height="25" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="52" y="92" font-size="10" fill="#2b2b2b">1</text>
  <text x="77" y="92" font-size="10" fill="#2b2b2b">2</text>
  <text x="102" y="92" font-size="10" fill="#2b2b2b">3</text>
  <text x="127" y="92" font-size="10" fill="#2b2b2b">4</text>
  <text x="52" y="117" font-size="10" fill="#2b2b2b">5</text>
  <text x="77" y="117" font-size="10" fill="#2b2b2b">6</text>
  <text x="102" y="117" font-size="10" fill="#2b2b2b">7</text>
  <text x="127" y="117" font-size="10" fill="#2b2b2b">8</text>
  <text x="52" y="142" font-size="10" fill="#2b2b2b">9</text>
  <text x="77" y="142" font-size="10" fill="#2b2b2b">10</text>
  <text x="102" y="142" font-size="10" fill="#2b2b2b">11</text>
  <text x="127" y="142" font-size="10" fill="#2b2b2b">12</text>
  <text x="52" y="167" font-size="10" fill="#2b2b2b">13</text>
  <text x="77" y="167" font-size="10" fill="#2b2b2b">14</text>
  <text x="102" y="167" font-size="10" fill="#2b2b2b">15</text>
  <text x="127" y="167" font-size="10" fill="#2b2b2b">16</text>
  <text x="160" y="92" font-size="9" fill="#2e6e2e" font-weight="bold">← block 0</text>

  <!-- x vector -->
  <text x="190" y="66" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">x</text>
  <g filter="url(#sk)">
    <rect x="170" y="74" width="40" height="100" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <line x1="170" y1="99"  x2="210" y2="99"  stroke="#4a7a3a" stroke-width="0.8"/>
    <line x1="170" y1="124" x2="210" y2="124" stroke="#4a7a3a" stroke-width="0.8"/>
    <line x1="170" y1="149" x2="210" y2="149" stroke="#4a7a3a" stroke-width="0.8"/>
  </g>
  <text x="190" y="92"  text-anchor="middle" font-size="10" fill="#2b2b2b">1</text>
  <text x="190" y="117" text-anchor="middle" font-size="10" fill="#2b2b2b">0</text>
  <text x="190" y="142" text-anchor="middle" font-size="10" fill="#2b2b2b">1</text>
  <text x="190" y="167" text-anchor="middle" font-size="10" fill="#2b2b2b">0</text>

  <!-- ===== block 0 computation (right) ===== -->
  <text x="560" y="66" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">block 0：4 thread 各算 1 个 k → 归约</text>

  <!-- thread rows -->
  <g filter="url(#sk)">
    <rect x="280" y="76" width="560" height="24" rx="3" fill="#fffdf3" stroke="#e0d8b8" stroke-width="0.8"/>
    <rect x="280" y="104" width="560" height="24" rx="3" fill="#fffdf3" stroke="#e0d8b8" stroke-width="0.8"/>
    <rect x="280" y="132" width="560" height="24" rx="3" fill="#fffdf3" stroke="#e0d8b8" stroke-width="0.8"/>
    <rect x="280" y="160" width="560" height="24" rx="3" fill="#fffdf3" stroke="#e0d8b8" stroke-width="0.8"/>
  </g>
  <text x="296" y="92"  font-size="9.5" fill="#7a5415" font-weight="bold">t0</text>
  <text x="296" y="120" font-size="9.5" fill="#7a5415" font-weight="bold">t1</text>
  <text x="296" y="148" font-size="9.5" fill="#7a5415" font-weight="bold">t2</text>
  <text x="296" y="176" font-size="9.5" fill="#7a5415" font-weight="bold">t3</text>

  <text x="330" y="92"  font-size="10" fill="#2b2b2b">W[0][0]·x[0] = 1·1 = </text>
  <text x="500" y="92"  font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="330" y="120" font-size="10" fill="#2b2b2b">W[0][1]·x[1] = 2·0 = </text>
  <text x="500" y="120" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="330" y="148" font-size="10" fill="#2b2b2b">W[0][2]·x[2] = 3·1 = </text>
  <text x="500" y="148" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="330" y="176" font-size="10" fill="#2b2b2b">W[0][3]·x[3] = 4·0 = </text>
  <text x="500" y="176" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <!-- reduce bracket -->
  <path d="M 545 88 L 555 88 L 555 172 L 545 172" stroke="#5a5a5a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 555 130 L 580 130" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="127" font-size="10" fill="#7a5415" font-weight="bold">block reduce</text>
  <text x="600" y="142" font-size="10" fill="#2b2b2b">1+0+3+0 = </text>
  <text x="690" y="142" font-size="11" fill="#2e6e2e" font-weight="bold">4</text>

  <!-- y[0] out -->
  <g filter="url(#sk)"><rect x="760" y="116" width="60" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="790" y="136" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">y[0]=4</text>
  <path d="M 720 130 L 758 130" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== full result row ===== -->
  <g filter="url(#sk)"><rect x="40" y="216" width="800" height="68" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="440" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">4 个 block 并行 → y = [4, 12, 20, 28]</text>

  <!-- result boxes -->
  <g filter="url(#sk)">
    <rect x="120" y="250" width="60" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="260" y="250" width="60" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="400" y="250" width="60" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="540" y="250" width="60" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="150" y="269" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">y[0]=4</text>
  <text x="290" y="269" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">y[1]=12</text>
  <text x="430" y="269" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">y[2]=20</text>
  <text x="570" y="269" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">y[3]=28</text>
  <text x="640" y="269" font-size="10" fill="#888">(block 0/1/2/3 各算一行)</text>

  <!-- insight -->
  <g filter="url(#sk)"><rect x="40" y="300" width="800" height="80" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="440" y="324" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">观察</text>
  <text x="56" y="346" font-size="10.5" fill="#444">• 每个 block 独立算一行：W[n][k] 行内连续 → 4 thread 读 W[0][0..3] 落在同一条 cache line → 完全合并</text>
  <text x="56" y="366" font-size="10.5" fill="#444">• x[k] 被所有 block 复用，仅 16 字节，L2 广播；K 增大时同理——x 永远远小于 W，不是瓶颈</text>
</svg>
