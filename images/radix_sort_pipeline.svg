<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#fdfcf7"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">单趟数据流：count → scan → scatter（block scan 用 warp shuffle）</text>
  <path d="M 260 40 Q 460 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- kernel 1: count -->
  <g filter="url(#sk)">
    <rect x="30" y="58" width="250" height="150" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="155" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">① count_kernel&lt;&lt;numBlocks,TILE&gt;&gt;</text>
  <text x="42" y="102" font-size="11" fill="#444">key = src[gj]；pred0 = (bit==0)</text>
  <text x="42" y="120" font-size="11" fill="#7a5415">block_excl_scan(pred0) → rank0</text>
  <text x="42" y="138" font-size="11" fill="#444">total0 = 末线程 incl 总和</text>
  <text x="42" y="158" font-size="11" fill="#444">写 d_count0[blockIdx] = total0</text>
  <text x="42" y="180" font-size="11" fill="#888">每 block 独立 → 互不依赖</text>
  <text x="42" y="198" font-size="11" fill="#888">rank0 此处丢弃（scatter 重算）</text>

  <path d="M 280 120 L 312 120" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="284" y="112" font-size="10" fill="#5a5a5a">d_count0[]</text>

  <!-- kernel 2: scan -->
  <g filter="url(#sk)">
    <rect x="314" y="58" width="250" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="439" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">② scan_kernel&lt;&lt;1,TILE&gt;&gt;</text>
  <text x="326" y="102" font-size="11" fill="#444">v = d_count0[tid]</text>
  <text x="326" y="120" font-size="11" fill="#7a5415">block_excl_scan(v) → excl</text>
  <text x="326" y="138" font-size="11" fill="#444">d_excl0[tid] = excl</text>
  <text x="326" y="158" font-size="11" fill="#444">*d_total = incl 末值</text>
  <text x="326" y="180" font-size="11" fill="#888">numBlocks ≤ 1024 → 单 block</text>
  <text x="326" y="198" font-size="11" fill="#888">= 全局 0 元素的起始基地址</text>

  <path d="M 564 120 L 596 120" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="112" font-size="10" fill="#5a5a5a">d_excl0[] , d_total</text>

  <!-- kernel 3: scatter -->
  <g filter="url(#sk)">
    <rect x="598" y="58" width="292" height="150" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="744" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ scatter_kernel&lt;&lt;numBlocks,TILE&gt;&gt;</text>
  <text x="610" y="102" font-size="11" fill="#444">重算 pred0 + block scan → rank0</text>
  <text x="610" y="120" font-size="11" fill="#444">excl0 = d_excl0[blockIdx]</text>
  <text x="610" y="138" font-size="11" fill="#2e6e2e">bit==0: pos = excl0 + rank0</text>
  <text x="610" y="158" font-size="11" fill="#7a5415">bit==1: pos = totalZ + b*TILE</text>
  <text x="710" y="174" font-size="11" fill="#7a5415">− excl0 + (tid − rank0)</text>
  <text x="610" y="196" font-size="11" fill="#444">d_out[pos] = key（仅 gj&lt;N 写）</text>

  <!-- block scan inset -->
  <g filter="url(#sk)">
    <rect x="30" y="232" width="500" height="172" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="46" y="254" font-size="13" font-weight="bold" fill="#444">block_excl_scan 三阶段（复用 #16 模板）</text>

  <g filter="url(#sk)">
    <rect x="46" y="266" width="148" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="200" y="266" width="148" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="354" y="266" width="160" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="120" y="283" text-anchor="middle" font-size="10" fill="#2b6e9e">warp incl scan</text>
  <text x="120" y="299" text-anchor="middle" font-size="10" fill="#2b6e9e">__shfl_up_sync ×5</text>
  <text x="274" y="283" text-anchor="middle" font-size="10" fill="#2e6e2e">warp 总和 → shared</text>
  <text x="274" y="299" text-anchor="middle" font-size="10" fill="#2e6e2e">sh_warp[32]</text>
  <text x="434" y="283" text-anchor="middle" font-size="10" fill="#7a5415">warp0 扫 sh_warp</text>
  <text x="434" y="299" text-anchor="middle" font-size="10" fill="#7a5415">→ 每 warp 前缀</text>

  <path d="M 194 286 L 200 286" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 348 286 L 354 286" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="46" y="330" font-size="11" fill="#444">incl = warp_incl + warp_prefix；excl = incl − own</text>
  <text x="46" y="350" font-size="11" fill="#7a5415">关键：scan 按线程索引序累加 → 保序 → 整趟划分稳定</text>
  <text x="46" y="370" font-size="11" fill="#888">TILE=1024 → 32 warp → sh_warp[32]；5+5 步 shuffle 完成</text>
  <text x="46" y="390" font-size="11" fill="#888">scan_kernel 同函数，对 numBlocks 个 block 计数再做一次</text>

  <!-- double buffer inset -->
  <g filter="url(#sk)">
    <rect x="548" y="232" width="342" height="172" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="564" y="254" font-size="13" font-weight="bold" fill="#444">双缓冲 ping-pong</text>
  <g filter="url(#sk)">
    <rect x="564" y="266" width="120" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="700" y="266" width="120" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="624" y="288" text-anchor="middle" font-size="11" fill="#2b6e9e">src = data</text>
  <text x="760" y="288" text-anchor="middle" font-size="11" fill="#2e6e2e">out = buf</text>

  <path d="M 624 304 L 760 330" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 760 336 L 624 336" stroke="#4a8e4a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="660" y="354" font-size="11" fill="#444">每趟结束 swap(src, out)</text>
  <text x="564" y="376" font-size="11" fill="#b85450">32 趟为偶数 → 结果落回 data</text>
  <text x="564" y="394" font-size="11" fill="#888">无需末尾拷贝（奇数趟则补一次 D2D）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="30" y="424" width="860" height="96" rx="8" fill="#fdf2f4" stroke="#b85450" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="46" y="448" font-size="13" font-weight="bold" fill="#b85450">⚠️ 稳定性是 radix sort 正确性的命门</text>
  <text x="46" y="470" font-size="11" fill="#444">每趟必须稳定（等位元素保持原相对序），否则高位趟会打乱低位已排好的顺序。</text>
  <text x="46" y="488" font-size="11" fill="#7a5415">本设计用 scan（按索引序累加）算 rank，而非 atomicAdd（执行序不可控 → 不稳定）。</text>
  <text x="46" y="506" font-size="11" fill="#444">从 LSB → MSB 共 32 趟；rank1 = tid − rank0 省掉第二次 scan，是 radix-2 的简洁之源。</text>
</svg>
