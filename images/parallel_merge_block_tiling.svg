<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Block 分块：全局 co-rank → shared 加载 → 局部 co-rank</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">每 block 处理 TILE 个输出，2 次全局二分定位边界，shared 内 256 threads 各做局部二分</text>

  <!-- ===== Step 1: Global co-rank ===== -->
  <rect x="20" y="58" width="600" height="110" fill="#e8f0fe" fill-opacity="0.25" stroke="#446688" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="78" font-size="12" fill="#446688" font-weight="bold">Step 1: 全局 co-rank（thread 0 做两次二分搜索）</text>

  <text x="35" y="100" font-size="10" fill="#333">tile_start = blockIdx.x × TILE</text>
  <text x="35" y="116" font-size="10" fill="#333">i_start = co_rank(tile_start, A, M, B, N)   → A 中贡献的元素数</text>
  <text x="35" y="132" font-size="10" fill="#333">i_end   = co_rank(tile_start + TILE, ...)    → tile 末尾的 co-rank</text>
  <text x="35" y="148" font-size="10" fill="#888">→ 确定 A[i_start..i_end-1] 和 B[j_start..j_end-1] 共 TILE 个元素属于本 block</text>

  <!-- Arrow -->
  <line x1="320" y1="170" x2="320" y2="182" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Shared memory load ===== -->
  <rect x="20" y="184" width="600" height="110" fill="#e6f4ea" fill-opacity="0.25" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="204" font-size="12" fill="#4a7a3a" font-weight="bold">Step 2: 合并加载到 shared memory（coalesced）</text>

  <rect x="35" y="215" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="234" text-anchor="middle" font-size="10" fill="#446688">shared_A[0..a_len-1] ← A[i_start..]</text>

  <rect x="35" y="250" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="269" text-anchor="middle" font-size="10" fill="#4a7a3a">shared_B[0..b_len-1] ← B[j_start..]</text>

  <text x="250" y="234" font-size="10" fill="#888">coalesced 顺序读（i_start 连续）</text>
  <text x="250" y="269" font-size="10" fill="#888">coalesced 顺序读（j_start 连续）</text>
  <text x="35" y="288" font-size="10" fill="#888">a_len + b_len = TILE（保证 shared memory 够用）</text>

  <!-- Arrow -->
  <line x1="320" y1="296" x2="320" y2="308" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: Local co-rank + write ===== -->
  <rect x="20" y="310" width="600" height="110" fill="#fff8e1" fill-opacity="0.25" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="35" y="330" font-size="12" fill="#d6a040" font-weight="bold">Step 3: 每 thread 做局部 co-rank + 写一个输出（shared 二分，coalesced 写）</text>

  <rect x="35" y="342" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="360" text-anchor="middle" font-size="9" fill="#d6a040">t0: k=0</text>

  <rect x="95" y="342" width="55" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="360" text-anchor="middle" font-size="9" fill="#d6a040">t1: k=1</text>

  <text x="165" y="360" text-anchor="middle" font-size="12" fill="#888">...</text>

  <rect x="180" y="342" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="360" text-anchor="middle" font-size="9" fill="#d6a040">t255: k=255</text>

  <text x="260" y="356" font-size="10" fill="#333">每 thread: local_i = co_rank(k, shared_A, a_len, shared_B, b_len)</text>
  <text x="260" y="372" font-size="10" fill="#333">C[tile_start + k] = (shared_A[local_i] ≤ shared_B[local_j]) ? A : B</text>
  <text x="35" y="400" font-size="10" fill="#888">局部二分仅 O(log TILE) = O(8) 次 shared memory 读，极快</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="430" width="600" height="24" fill="#fce4ec" fill-opacity="0.3" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="447" text-anchor="middle" font-size="10" fill="#b85450">💡 全局仅 2 次/block 的 O(log M) 二分（读 global），局部 256 次/block 的 O(log TILE) 二分（读 shared）→ 两级优化</text>
</svg>
