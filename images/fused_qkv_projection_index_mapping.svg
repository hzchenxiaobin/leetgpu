<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#fdfcf7"/>

  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">融合写回索引映射：j → (part, head, hd)</text>
  <path d="M 260 36 Q 440 44 620 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== qkv 列展开条 ===== -->
  <text x="440" y="62" text-anchor="middle" font-size="11" fill="#444">GEMM 输出列 j ∈ [0, 3D)，D = num_heads × head_dim</text>

  <!-- Q region -->
  <g filter="url(#sk)"><rect x="60" y="74" width="240" height="50" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="180" y="93" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">Q 区域</text>
  <text x="180" y="110" text-anchor="middle" font-size="10" fill="#2b6e9e">j ∈ [0, D)　part=0</text>

  <!-- K region -->
  <g filter="url(#sk)"><rect x="310" y="74" width="240" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="430" y="93" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">K 区域</text>
  <text x="430" y="110" text-anchor="middle" font-size="10" fill="#7a5415">j ∈ [D, 2D)　part=1</text>

  <!-- V region -->
  <g filter="url(#sk)"><rect x="560" y="74" width="240" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="680" y="93" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">V 区域</text>
  <text x="680" y="110" text-anchor="middle" font-size="10" fill="#7a2828">j ∈ [2D, 3D)　part=2</text>

  <!-- arrow down -->
  <path d="M 180 126 L 180 148" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 126 L 430 148" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 680 126 L 680 148" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== part = j / D ===== -->
  <text x="180" y="162" text-anchor="middle" font-size="10" fill="#2b6e9e" font-family="monospace">part = j / D</text>
  <text x="430" y="162" text-anchor="middle" font-size="10" fill="#7a5415" font-family="monospace">part = j / D</text>
  <text x="680" y="162" text-anchor="middle" font-size="10" fill="#7a2828" font-family="monospace">part = j / D</text>

  <!-- ===== local = j % D, head, hd ===== -->
  <g filter="url(#sk)"><rect x="60" y="172" width="240" height="70" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1" stroke-dasharray="4 2"/></g>
  <text x="180" y="190" text-anchor="middle" font-size="10" fill="#2b6e9e" font-family="monospace">local = j % D</text>
  <text x="180" y="206" text-anchor="middle" font-size="10" fill="#2b6e9e" font-family="monospace">head = local / head_dim</text>
  <text x="180" y="222" text-anchor="middle" font-size="10" fill="#2b6e9e" font-family="monospace">hd   = local % head_dim</text>
  <text x="180" y="238" text-anchor="middle" font-size="9" fill="#888">例: D=4, hd=2</text>

  <g filter="url(#sk)"><rect x="310" y="172" width="240" height="70" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 2"/></g>
  <text x="430" y="190" text-anchor="middle" font-size="10" fill="#7a5415" font-family="monospace">local = (j-D) % D</text>
  <text x="430" y="206" text-anchor="middle" font-size="10" fill="#7a5415" font-family="monospace">head = local / head_dim</text>
  <text x="430" y="222" text-anchor="middle" font-size="10" fill="#7a5415" font-family="monospace">hd   = local % head_dim</text>
  <text x="430" y="238" text-anchor="middle" font-size="9" fill="#888">等价: local = j % D</text>

  <g filter="url(#sk)"><rect x="560" y="172" width="240" height="70" rx="4" fill="#fff" stroke="#b85450" stroke-width="1" stroke-dasharray="4 2"/></g>
  <text x="680" y="190" text-anchor="middle" font-size="10" fill="#7a2828" font-family="monospace">local = (j-2D) % D</text>
  <text x="680" y="206" text-anchor="middle" font-size="10" fill="#7a2828" font-family="monospace">head = local / head_dim</text>
  <text x="680" y="222" text-anchor="middle" font-size="10" fill="#7a2828" font-family="monospace">hd   = local % head_dim</text>
  <text x="680" y="238" text-anchor="middle" font-size="9" fill="#888">等价: local = j % D</text>

  <!-- arrow down to output -->
  <path d="M 180 244 L 180 266" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 244 L 430 266" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 680 244 L 680 266" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 输出布局 ===== -->
  <text x="440" y="280" text-anchor="middle" font-size="11" fill="#444">写入目标：out[part] 布局 [num_heads, M, head_dim]</text>

  <!-- Q output -->
  <g filter="url(#sk)"><rect x="80" y="290" width="200" height="60" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="180" y="308" text-anchor="middle" font-size="10" fill="#2b6e9e" font-family="monospace" font-weight="bold">Q[head][m][hd]</text>
  <text x="180" y="324" text-anchor="middle" font-size="9" fill="#2b6e9e" font-family="monospace">idx = head*M*hd + m*hd + d</text>
  <text x="180" y="340" text-anchor="middle" font-size="9" fill="#2b6e9e" font-family="monospace">part=0 → out[0] = Q</text>

  <!-- K output -->
  <g filter="url(#sk)"><rect x="330" y="290" width="200" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="430" y="308" text-anchor="middle" font-size="10" fill="#7a5415" font-family="monospace" font-weight="bold">K[head][m][hd]</text>
  <text x="430" y="324" text-anchor="middle" font-size="9" fill="#7a5415" font-family="monospace">idx = head*M*hd + m*hd + d</text>
  <text x="430" y="340" text-anchor="middle" font-size="9" fill="#7a5415" font-family="monospace">part=1 → out[1] = K</text>

  <!-- V output -->
  <g filter="url(#sk)"><rect x="580" y="290" width="200" height="60" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="680" y="308" text-anchor="middle" font-size="10" fill="#7a2828" font-family="monospace" font-weight="bold">V[head][m][hd]</text>
  <text x="680" y="324" text-anchor="middle" font-size="9" fill="#7a2828" font-family="monospace">idx = head*M*hd + m*hd + d</text>
  <text x="680" y="340" text-anchor="middle" font-size="9" fill="#7a2828" font-family="monospace">part=2 → out[2] = V</text>

  <!-- ===== 统一公式 ===== -->
  <g filter="url(#sk)"><rect x="60" y="366" width="760" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="440" y="384" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">统一写回公式（branchless）</text>
  <text x="440" y="400" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">float* out[3] = {Q, K, V};  out[col/D][ (col%D)/hd * M*hd + m*hd + (col%D)%hd ] = sum</text>
</svg>
