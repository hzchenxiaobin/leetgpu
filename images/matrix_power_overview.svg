<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">矩阵幂 A^P：朴素连乘 vs 二进制快速幂</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">以 P=13 为例：朴素法 12 次乘法，快速幂仅 6 次</text>

  <!-- ===== 左侧：朴素连乘 ===== -->
  <text x="30" y="72" font-size="12" fill="#b85450" font-weight="bold">朴素连乘（P-1 次 matmul）</text>
  <rect x="20" y="80" width="280" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <g font-family="monospace" font-size="10" fill="#333">
    <text x="35" y="100">A → A² → A³ → A⁴ → ⋯ → A¹³</text>
  </g>

  <!-- chain of multiplications -->
  <g font-size="9" fill="#b85450">
    <rect x="35" y="110" width="30" height="24" fill="#fff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="50" y="126" text-anchor="middle">A</text>

    <text x="72" y="126" font-size="10" fill="#888">×</text>
    <rect x="82" y="110" width="30" height="24" fill="#fff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="97" y="126" text-anchor="middle">A</text>

    <text x="119" y="126" font-size="10" fill="#888">=</text>
    <rect x="129" y="110" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="144" y="126" text-anchor="middle">A²</text>

    <text x="166" y="126" font-size="14" fill="#888">⋯</text>

    <rect x="186" y="110" width="30" height="24" fill="#fff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="201" y="126" text-anchor="middle">A¹²</text>

    <text x="223" y="126" font-size="10" fill="#888">×</text>
    <rect x="233" y="110" width="30" height="24" fill="#fff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="248" y="126" text-anchor="middle">A</text>

    <text x="270" y="126" font-size="10" fill="#888">=</text>
  </g>

  <!-- arrows showing each step -->
  <g font-size="8" fill="#888">
    <text x="160" y="158" text-anchor="middle">每步 = 1 次 matmul</text>
    <text x="160" y="172" text-anchor="middle">共 12 次 kernel launch</text>
  </g>

  <rect x="40" y="188" width="240" height="28" fill="#fff" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">O(P) 次 matmul — 浪费大量算力</text>

  <!-- ===== 右侧：二进制快速幂 ===== -->
  <text x="350" y="72" font-size="12" fill="#4a7a3a" font-weight="bold">二进制快速幂（O(log P) 次 matmul）</text>
  <rect x="340" y="80" width="280" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <g font-family="monospace" font-size="10" fill="#333">
    <text x="355" y="100">13 = 1101₂ = 8 + 4 + 1</text>
  </g>

  <!-- squaring chain -->
  <g font-size="9" fill="#4a7a3a">
    <rect x="355" y="110" width="36" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="373" y="126" text-anchor="middle">A¹</text>

    <path d="M 395 122 L 415 122" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="405" y="116" text-anchor="middle" font-size="7" fill="#4a7a3a">²</text>

    <rect x="420" y="110" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="438" y="126" text-anchor="middle">A²</text>

    <path d="M 460 122 L 480 122" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="470" y="116" text-anchor="middle" font-size="7" fill="#4a7a3a">²</text>

    <rect x="485" y="110" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="503" y="126" text-anchor="middle">A⁴</text>

    <path d="M 525 122 L 545 122" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="535" y="116" text-anchor="middle" font-size="7" fill="#4a7a3a">²</text>

    <rect x="550" y="110" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="568" y="126" text-anchor="middle">A⁸</text>
  </g>

  <!-- multiply selected powers -->
  <g font-size="10" fill="#d6a040">
    <text x="355" y="158">result = A¹ × A⁴ × A⁸ = A¹³</text>
  </g>

  <g font-size="9" fill="#888">
    <text x="480" y="158" text-anchor="middle">选 bit=1 的项相乘</text>
    <text x="480" y="172" text-anchor="middle">3 次 squaring + 3 次乘法 = 6 次</text>
  </g>

  <rect x="360" y="188" width="240" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(log P) 次 matmul — 大幅减少 launch</text>

  <!-- ===== 对比表 ===== -->
  <text x="30" y="260" font-size="12" fill="#446688" font-weight="bold">不同 P 值的 matmul 次数对比</text>

  <!-- table header -->
  <rect x="30" y="270" width="580" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="287" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">P</text>
  <text x="230" y="287" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">朴素法 (P-1)</text>
  <text x="370" y="287" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">快速幂</text>
  <text x="520" y="287" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">加速比</text>

  <!-- table rows -->
  <g font-size="10" fill="#333">
    <line x1="30" y1="294" x2="610" y2="294" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="310" text-anchor="middle">3</text>
    <text x="230" y="310" text-anchor="middle" fill="#b85450">2</text>
    <text x="370" y="310" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="520" y="310" text-anchor="middle" fill="#888">1.0×</text>

    <line x1="30" y1="318" x2="610" y2="318" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="334" text-anchor="middle">10</text>
    <text x="230" y="334" text-anchor="middle" fill="#b85450">9</text>
    <text x="370" y="334" text-anchor="middle" fill="#4a7a3a">5</text>
    <text x="520" y="334" text-anchor="middle" fill="#d6a040" font-weight="bold">1.8×</text>

    <line x1="30" y1="342" x2="610" y2="342" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="358" text-anchor="middle">13</text>
    <text x="230" y="358" text-anchor="middle" fill="#b85450">12</text>
    <text x="370" y="358" text-anchor="middle" fill="#4a7a3a">6</text>
    <text x="520" y="358" text-anchor="middle" fill="#d6a040" font-weight="bold">2.0×</text>

    <line x1="30" y1="366" x2="610" y2="366" stroke="#ddd" stroke-width="1"/>
    <text x="100" y="382" text-anchor="middle">20</text>
    <text x="230" y="382" text-anchor="middle" fill="#b85450">19</text>
    <text x="370" y="382" text-anchor="middle" fill="#4a7a3a">5</text>
    <text x="520" y="382" text-anchor="middle" fill="#d6a040" font-weight="bold">3.8×</text>
  </g>

  <line x1="30" y1="390" x2="610" y2="390" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="408" width="580" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="426" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">核心洞察：P 越大，快速幂优势越显著</text>
  <text x="320" y="440" text-anchor="middle" font-size="10" fill="#888">性能测点 P=3 时两种方法等价，但算法优化在 P≥8 时收益巨大</text>
</svg>
