<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">GeGLU：Split + GELU Gate + Multiply</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">输入 N 分成 x₁(N/2) 和 x₂(N/2)，output = x₁ × GELU(x₂)，融合 kernel</text>

  <!-- ===== Top: split + gate + multiply dataflow ===== -->
  <text x="160" y="76" font-size="12" fill="#446688" font-weight="bold">input[N]（前半 x₁ + 后半 x₂）</text>
  <g font-size="9" fill="#333">
    <rect x="40" y="84" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <rect x="40" y="84" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <rect x="160" y="84" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="100" y="102" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">x₁ = input[0..N/2-1]</text>
    <text x="220" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">x₂ = input[N/2..N-1]</text>
  </g>

  <!-- arrows down from x1 and x2 -->
  <path d="M 100 116 L 100 140" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 116 L 220 140" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- x1 passthrough -->
  <rect x="50" y="142" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="160" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">x₁ (直通)</text>

  <!-- GELU gate on x2 -->
  <rect x="170" y="142" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="160" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">GELU(x₂)</text>

  <!-- GELU formula box -->
  <rect x="300" y="142" width="200" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="160" text-anchor="middle" font-family="monospace" font-size="8" fill="#555">0.5·x₂·(1+erf(x₂/√2))</text>

  <!-- arrows to multiply -->
  <path d="M 100 172 L 100 192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 172 L 220 192" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- multiply -->
  <circle cx="160" cy="200" r="14" fill="#fafafa" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="205" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">×</text>
  <text x="190" y="205" font-size="8" fill="#666">element-wise mul</text>

  <!-- arrow to output -->
  <path d="M 160 216 L 160 236" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="80" y="238" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="256" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">output[N/2] = x₁ × GELU(x₂)</text>

  <!-- ===== Right: thread mapping ===== -->
  <text x="480" y="76" font-size="12" fill="#d6a040" font-weight="bold">Thread 映射</text>
  <g font-size="9" fill="#333">
    <rect x="340" y="84" width="260" height="120" fill="#f6f6f6" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="352" y="100" font-size="8" fill="#888">1 thread → 1 output element</text>
    <text x="352" y="116" font-family="monospace" font-size="8" fill="#4a7a3a">tid → output index i</text>
    <text x="352" y="132" font-family="monospace" font-size="8" fill="#446688">x1 = input[i]</text>
    <text x="352" y="146" font-family="monospace" font-size="8" fill="#d6a040">x2 = input[i + halfN]</text>
    <text x="352" y="160" font-family="monospace" font-size="8" fill="#b85450">gelu = 0.5*x2*(1+erf(x2/√2))</text>
    <text x="352" y="174" font-family="monospace" font-size="8" fill="#4a7a3a">output[i] = x1 * gelu</text>
    <text x="352" y="192" font-size="8" fill="#888">融合：split+GELU+mul 在一个 kernel</text>
  </g>

  <!-- ===== Bottom: GELU implementations ===== -->
  <line x1="20" y1="284" x2="620" y2="284" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="300" width="580" height="120" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="320" font-size="11" fill="#444" font-weight="bold">GELU 的两种实现：</text>

  <g font-size="9" fill="#555">
    <circle cx="54" cy="338" r="3" fill="#b85450" filter="url(#rough2)"/>
    <text x="64" y="341" fill="#b85450" font-weight="bold">精确版（erf）</text>
    <text x="180" y="341" font-family="monospace" fill="#555">0.5*x*(1+erf(x/√2))</text>
    <text x="400" y="341" fill="#888">— 精确但 erf 慢（~30 cycle）</text>

    <circle cx="54" cy="358" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
    <text x="64" y="361" fill="#4a7a3a" font-weight="bold">tanh 近似</text>
    <text x="180" y="361" font-family="monospace" fill="#555">0.5*x*(1+tanh(√(2/π)·(x+0.044715·x³)))</text>
    <text x="400" y="361" fill="#888">— 快（~10 cycle），误差 < 10⁻⁴</text>

    <circle cx="54" cy="378" r="3" fill="#d6a040" filter="url(#rough2)"/>
    <text x="64" y="381" fill="#d6a040" font-weight="bold">本题选择</text>
    <text x="180" y="381">用 erff()（CUDA 内置），atol=10⁻⁴ 需精确版</text>

    <circle cx="54" cy="398" r="3" fill="#888" filter="url(#rough2)"/>
    <text x="64" y="401" fill="#888" font-weight="bold">融合优势</text>
    <text x="180" y="401">split + GELU + mul 融合为单 kernel，省 2 次 HBM 往返（x₂ 临时数组 + gelu 中间结果）</text>
  </g>
</svg>
