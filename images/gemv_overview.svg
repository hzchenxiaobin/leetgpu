<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">GEMV：矩阵-向量乘法（单 token 解码）</text>
  <path d="M 260 38 Q 440 46 620 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 朴素版（左）===== -->
  <text x="210" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">朴素：1 thread / row，K 串行（W 跨行非合并）</text>

  <!-- W grid (naive) -->
  <g filter="url(#sk)">
    <rect x="40" y="86" width="120" height="90" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <line x1="40" y1="108" x2="160" y2="108" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="40" y1="131" x2="160" y2="131" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="40" y1="154" x2="160" y2="154" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="70" y1="86" x2="70" y2="176" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="100" y1="86" x2="100" y2="176" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="130" y1="86" x2="130" y2="176" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="100" y="80" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">W [N×K]</text>

  <!-- strided read marker: column k highlighted across rows -->
  <g filter="url(#sk)">
    <rect x="100" y="86" width="30" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="100" y="131" width="30" height="22" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="115" y="200" text-anchor="middle" font-size="9" fill="#b85450">同 k 跨行：stride=K</text>

  <!-- threads (one per row) -->
  <g filter="url(#sk)">
    <circle cx="195" cy="97" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="195" cy="120" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="195" cy="143" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="195" cy="166" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="195" y="80" text-anchor="middle" font-size="9" fill="#7a5415">thread/行</text>

  <!-- x vector reused by all -->
  <g filter="url(#sk)"><rect x="40" y="214" width="120" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="100" y="228" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">x [K]  ← 被 N 个 thread 重复读</text>

  <!-- y out -->
  <g filter="url(#sk)"><rect x="230" y="100" width="40" height="68" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="250" y="92" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">y</text>
  <path d="M 205 131 L 228 131" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- naive annotations -->
  <text x="135" y="258" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">⚠ W 非合并：128B cache line 仅 1 float 有用</text>
  <text x="135" y="274" text-anchor="middle" font-size="9.5" fill="#b85450">有效带宽 ~1/32，深度 memory-bound</text>

  <!-- divider -->
  <path d="M 330 60 L 330 290" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)"/>

  <!-- ===== 优化版（右）===== -->
  <text x="600" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">优化：1 block / row，threads 切分 K（W 行内连续合并）</text>

  <!-- W grid (optimized): one row highlighted, threads walk along K -->
  <g filter="url(#sk)">
    <rect x="360" y="86" width="160" height="90" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <line x1="360" y1="108" x2="520" y2="108" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="360" y1="131" x2="520" y2="131" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="360" y1="154" x2="520" y2="154" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="400" y1="86" x2="400" y2="176" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="440" y1="86" x2="440" y2="176" stroke="#4a8edb" stroke-width="0.8"/>
    <line x1="480" y1="86" x2="480" y2="176" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="440" y="80" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">W [N×K]</text>
  <!-- row n highlighted: contiguous K -->
  <g filter="url(#sk)"><rect x="360" y="86" width="160" height="22" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="440" y="100" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">第 n 行（连续 k）</text>

  <!-- block of threads along K -->
  <g filter="url(#sk)">
    <circle cx="370" cy="200" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="395" cy="200" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="420" cy="200" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="445" cy="200" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="470" cy="200" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="505" y="204" font-size="10" fill="#7a5415" font-weight="bold">... 256 thread</text>
  </g>
  <text x="440" y="186" text-anchor="middle" font-size="9" fill="#7a5415">block n：沿 K grid-stride</text>

  <!-- x via L2 -->
  <g filter="url(#sk)"><rect x="360" y="214" width="160" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="440" y="228" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">x [K] ← L2 广播（16KB 驻留）</text>

  <!-- reduce box -->
  <g filter="url(#sk)"><rect x="555" y="115" width="70" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="590" y="133" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">block</text>
  <text x="590" y="147" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">归约</text>
  <path d="M 525 131 L 553 131" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- y out -->
  <g filter="url(#sk)"><rect x="645" y="118" width="36" height="34" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="663" y="110" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">y[n]</text>
  <path d="M 628 135 L 643 135" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- optimized annotations -->
  <text x="510" y="258" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-weight="bold">✓ W 行内连续 + float4：cache line 全命中</text>
  <text x="510" y="274" text-anchor="middle" font-size="9.5" fill="#2e6e2e">有效带宽 ~1.0，逼近 HBM 峰值</text>

  <!-- ===== 底部 roofline 对比 ===== -->
  <g filter="url(#sk)"><rect x="40" y="300" width="800" height="160" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="440" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">为什么 M=1 是 memory-bound？</text>

  <text x="60" y="350" font-size="10.5" fill="#444">• GEMV (M=1)：W 每个元素只用 1 次 → 算术强度 = 2 FLOP / 4 byte = <tspan font-weight="bold" fill="#b85450">0.5 FLOP/byte</tspan></text>
  <text x="60" y="370" font-size="10.5" fill="#444">• GEMM (M=64)：W 被 64 行复用 → 算术强度 = 2·64 / 4 = <tspan font-weight="bold" fill="#2e6e2e">32 FLOP/byte</tspan>（compute-bound）</text>
  <text x="60" y="390" font-size="10.5" fill="#444">• 优化 GEMV 不减计算量，只把必读的 W 流量「读得更快」：合并 + 向量化 → 逼近带宽 roofline</text>
  <text x="60" y="410" font-size="10.5" fill="#444">• 系统层质变：Continuous Batching 把多个 M=1 GEMV 拼成 M≫1 GEMM → 算术强度随 batch 线性增长</text>

  <g filter="url(#sk)"><rect x="60" y="424" width="760" height="26" rx="5" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.1"/></g>
  <text x="440" y="441" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">关键洞察：翻转并行轴（N→K），W 从跨行 stride 变行内连续，带宽利用率 1/32 → 1</text>
</svg>
