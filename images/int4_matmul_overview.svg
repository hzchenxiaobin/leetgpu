<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">W4A16 量化矩阵乘概览：INT4 权重 → 反量化 → FP16×FP16</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">权重压缩 4×（INT4 vs FP16），激活保持 FP16 精度，在 kernel 内即时反量化</text>

  <!-- ===== Inputs ===== -->
  <text x="80" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x (FP16)</text>
  <rect x="30" y="85" width="100" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="11" fill="#446688">M × K</text>
  <text x="80" y="128" text-anchor="middle" font-size="9" fill="#888">激活（不量化）</text>
  <text x="80" y="140" text-anchor="middle" font-size="9" fill="#888">16-bit float</text>

  <text x="240" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">w_q (UINT8)</text>
  <rect x="190" y="85" width="100" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="110" text-anchor="middle" font-size="11" fill="#d6a040">N × K/2</text>
  <text x="240" y="128" text-anchor="middle" font-size="9" fill="#888">打包 INT4 权重</text>
  <text x="240" y="140" text-anchor="middle" font-size="9" fill="#888">2 个 nibble / byte</text>

  <text x="240" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">scales (FP16)</text>
  <rect x="190" y="168" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="240" y="188" text-anchor="middle" font-size="11" fill="#b85450">N × K/gs</text>
  <text x="240" y="202" text-anchor="middle" font-size="9" fill="#888">分组缩放因子</text>

  <!-- ===== Dequant box ===== -->
  <rect x="340" y="90" width="140" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">即时反量化</text>
  <text x="410" y="132" text-anchor="middle" font-size="10" fill="#333">nibble = (byte &gt;&gt; 4) &amp; 0xF</text>
  <text x="410" y="148" text-anchor="middle" font-size="10" fill="#333">或 byte &amp; 0xF</text>
  <text x="410" y="166" text-anchor="middle" font-size="10" fill="#333">W = (nibble - 8) × scale</text>
  <text x="410" y="182" text-anchor="middle" font-size="9" fill="#888">FP32 累加保精度</text>

  <!-- Arrows to dequant -->
  <line x1="290" y1="115" x2="335" y2="115" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="290" y1="188" x2="335" y2="160" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="130" y1="115" x2="335" y2="135" stroke="#666" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <text x="580" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">y (FP16)</text>
  <rect x="530" y="85" width="80" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="570" y="110" text-anchor="middle" font-size="11" fill="#446688">M × N</text>
  <text x="570" y="128" text-anchor="middle" font-size="9" fill="#888">y = x × W^T</text>
  <text x="570" y="140" text-anchor="middle" font-size="9" fill="#888">16-bit float</text>

  <line x1="485" y1="140" x2="525" y2="115" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="132" text-anchor="middle" font-size="8" fill="#888">matmul</text>

  <!-- ===== Memory savings ===== -->
  <text x="320" y="230" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">内存压缩：4× 权重节省</text>

  <rect x="60" y="245" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="268" text-anchor="middle" font-size="10" fill="#446688">FP16 权重: N×K×2 bytes</text>

  <rect x="60" y="288" width="100" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="110" y="311" text-anchor="middle" font-size="10" fill="#d6a040">INT4: N×K/2</text>

  <rect x="165" y="288" width="95" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="212" y="311" text-anchor="middle" font-size="10" fill="#b85450">scales: 小</text>

  <text x="290" y="311" font-size="11" fill="#4a7a3a" font-weight="bold">≈ 4× 压缩</text>
  <text x="60" y="338" font-size="9" fill="#888">4096×4096: FP16=32MB → INT4+scales≈8.1MB（省 24MB）</text>

  <!-- ===== Bottom: pipeline ===== -->
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">Kernel 内处理流水线</text>

  <rect x="40" y="382" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="402" text-anchor="middle" font-size="9" fill="#d6a040">① 加载 w_q tile 到 shared</text>

  <line x1="165" y1="397" x2="195" y2="397" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="382" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="9" fill="#4a7a3a">② 解包 nibble + × scale</text>

  <line x1="325" y1="397" x2="355" y2="397" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="360" y="382" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="402" text-anchor="middle" font-size="9" fill="#446688">③ x(FP16) × W(FP16) 累加</text>

  <line x1="485" y1="397" x2="515" y2="397" stroke="#666" stroke-width="1" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="520" y="382" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="565" y="402" text-anchor="middle" font-size="9" fill="#446688">④ 写 y (FP16)</text>

  <rect x="30" y="420" width="580" height="16" fill="#fce4ec" fill-opacity="0.3" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="320" y="432" text-anchor="middle" font-size="9" fill="#b85450">💡 关键：反量化在 shared memory 内完成，不落 HBM——「读压缩数据，算全精度」</text>
</svg>
