<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">Shared Memory FFT: 线程映射与同步 (N=8, 4 threads)</text>

  <!-- ===== Global Memory ===== -->
  <g filter="url(#rough2)">
    <text x="60" y="65" font-size="12" font-weight="bold" fill="#446688">Global Memory</text>
    <text x="60" y="80" font-size="10" fill="#666">input[0..7] (float2)</text>
    <!-- 8 cells -->
    <rect x="50" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="72" y="109" text-anchor="middle" font-size="9" fill="#446688">x[0]</text>
    <rect x="94" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="116" y="109" text-anchor="middle" font-size="9" fill="#446688">x[1]</text>
    <rect x="138" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="160" y="109" text-anchor="middle" font-size="9" fill="#446688">x[2]</text>
    <rect x="182" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="204" y="109" text-anchor="middle" font-size="9" fill="#446688">x[3]</text>
    <rect x="226" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="248" y="109" text-anchor="middle" font-size="9" fill="#446688">x[4]</text>
    <rect x="270" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="292" y="109" text-anchor="middle" font-size="9" fill="#446688">x[5]</text>
    <rect x="314" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="336" y="109" text-anchor="middle" font-size="9" fill="#446688">x[6]</text>
    <rect x="358" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="380" y="109" text-anchor="middle" font-size="9" fill="#446688">x[7]</text>
  </g>

  <!-- ===== Bit-reversal load arrows ===== -->
  <g filter="url(#rough2)" stroke="#d6a040" stroke-width="1" fill="none">
    <!-- tid=0: x[0] -> s[0] -->
    <line x1="72" y1="120" x2="72" y2="175" marker-end="url(#arr)"/>
    <text x="38" y="150" font-size="8" fill="#d6a040">tid0</text>
    <!-- tid=1: x[1] -> s[4] -->
    <line x1="116" y1="120" x2="248" y2="175" marker-end="url(#arr)" stroke-dasharray="3,2"/>
    <text x="130" y="150" font-size="8" fill="#d6a040">tid1→s[4]</text>
    <!-- tid=2: x[2] -> s[2] -->
    <line x1="160" y1="120" x2="160" y2="175" marker-end="url(#arr)"/>
    <text x="168" y="150" font-size="8" fill="#d6a040">tid2→s[2]</text>
    <!-- tid=3: x[3] -> s[6] -->
    <line x1="204" y1="120" x2="336" y2="175" marker-end="url(#arr)" stroke-dasharray="3,2"/>
    <text x="218" y="150" font-size="8" fill="#d6a040">tid3→s[6]</text>
  </g>

  <!-- ===== Shared Memory (after bit-reversal) ===== -->
  <g filter="url(#rough2)">
    <text x="60" y="170" font-size="12" font-weight="bold" fill="#d6a040">Shared Memory (位反转后)</text>
    <rect x="50" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="72" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[0]</text>
    <rect x="94" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="116" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[1]</text>
    <rect x="138" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="160" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[2]</text>
    <rect x="182" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="204" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[3]</text>
    <rect x="226" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="248" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[4]</text>
    <rect x="270" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="292" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[5]</text>
    <rect x="314" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="336" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[6]</text>
    <rect x="358" y="178" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="380" y="197" text-anchor="middle" font-size="9" fill="#d6a040">s[7]</text>
  </g>

  <!-- __syncthreads marker -->
  <g filter="url(#rough2)">
    <rect x="430" y="180" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="495" y="197" text-anchor="middle" font-size="9" fill="#b85450">__syncthreads() ①</text>
  </g>

  <!-- ===== Stage 1: thread to butterfly mapping ===== -->
  <g filter="url(#rough2)">
    <text x="60" y="250" font-size="12" font-weight="bold" fill="#d6a040">Stage 1 (m=2, m2=1): 每线程 1 个蝶形</text>
    <!-- 4 thread boxes -->
    <rect x="50" y="260" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="90" y="275" text-anchor="middle" font-size="9" fill="#446688">tid=0: k=0,j=0</text>
    <rect x="140" y="260" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="180" y="275" text-anchor="middle" font-size="9" fill="#446688">tid=1: k=2,j=0</text>
    <rect x="230" y="260" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="270" y="275" text-anchor="middle" font-size="9" fill="#446688">tid=2: k=4,j=0</text>
    <rect x="320" y="260" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="360" y="275" text-anchor="middle" font-size="9" fill="#446688">tid=3: k=6,j=0</text>
    <!-- pairs -->
    <text x="90" y="295" text-anchor="middle" font-size="8" fill="#b85450">读写 s[0],s[1]</text>
    <text x="180" y="295" text-anchor="middle" font-size="8" fill="#b85450">读写 s[2],s[3]</text>
    <text x="270" y="295" text-anchor="middle" font-size="8" fill="#b85450">读写 s[4],s[5]</text>
    <text x="360" y="295" text-anchor="middle" font-size="8" fill="#b85450">读写 s[6],s[7]</text>
  </g>

  <!-- syncthreads -->
  <g filter="url(#rough2)">
    <rect x="430" y="265" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="495" y="282" text-anchor="middle" font-size="9" fill="#b85450">__syncthreads() ②</text>
  </g>

  <!-- ===== Stage 2 ===== -->
  <g filter="url(#rough2)">
    <text x="60" y="325" font-size="12" font-weight="bold" fill="#d6a040">Stage 2 (m=4, m2=2): 跨步配对</text>
    <rect x="50" y="335" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="90" y="350" text-anchor="middle" font-size="9" fill="#446688">tid=0: k=0,j=0</text>
    <rect x="140" y="335" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="180" y="350" text-anchor="middle" font-size="9" fill="#446688">tid=1: k=0,j=1</text>
    <rect x="230" y="335" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="270" y="350" text-anchor="middle" font-size="9" fill="#446688">tid=2: k=4,j=0</text>
    <rect x="320" y="335" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="360" y="350" text-anchor="middle" font-size="9" fill="#446688">tid=3: k=4,j=1</text>
    <text x="90" y="370" text-anchor="middle" font-size="8" fill="#b85450">读写 s[0],s[2]</text>
    <text x="180" y="370" text-anchor="middle" font-size="8" fill="#b85450">读写 s[1],s[3]</text>
    <text x="270" y="370" text-anchor="middle" font-size="8" fill="#b85450">读写 s[4],s[6]</text>
    <text x="360" y="370" text-anchor="middle" font-size="8" fill="#b85450">读写 s[5],s[7]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="430" y="340" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="495" y="357" text-anchor="middle" font-size="9" fill="#b85450">__syncthreads() ③</text>
  </g>

  <!-- ===== Stage 3 ===== -->
  <g filter="url(#rough2)">
    <text x="60" y="400" font-size="12" font-weight="bold" fill="#4a7a3a">Stage 3 (m=8, m2=4): 最大跨度</text>
    <rect x="50" y="410" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="90" y="425" text-anchor="middle" font-size="9" fill="#446688">tid=0: k=0,j=0</text>
    <rect x="140" y="410" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="180" y="425" text-anchor="middle" font-size="9" fill="#446688">tid=1: k=0,j=1</text>
    <rect x="230" y="410" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="270" y="425" text-anchor="middle" font-size="9" fill="#446688">tid=2: k=0,j=2</text>
    <rect x="320" y="410" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="360" y="425" text-anchor="middle" font-size="9" fill="#446688">tid=3: k=0,j=3</text>
    <text x="90" y="445" text-anchor="middle" font-size="8" fill="#b85450">读写 s[0],s[4]</text>
    <text x="180" y="445" text-anchor="middle" font-size="8" fill="#b85450">读写 s[1],s[5]</text>
    <text x="270" y="445" text-anchor="middle" font-size="8" fill="#b85450">读写 s[2],s[6]</text>
    <text x="360" y="445" text-anchor="middle" font-size="8" fill="#b85450">读写 s[3],s[7]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="430" y="415" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="495" y="432" text-anchor="middle" font-size="9" fill="#b85450">__syncthreads() ④</text>
  </g>

  <!-- ===== Right side: key insights ===== -->
  <g filter="url(#rough2)">
    <rect x="580" y="90" width="130" height="360" fill="#fafafa" stroke="#999" stroke-width="1" rx="6" stroke-dasharray="5,3"/>
    <text x="645" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">关键特性</text>
    <text x="590" y="135" font-size="9" fill="#446688">● 全程在 shared mem</text>
    <text x="590" y="150" font-size="9" fill="#446688">  完成, 仅 2 次 global</text>
    <text x="590" y="165" font-size="9" fill="#446688">  读写 (加载+写回)</text>
    <text x="590" y="190" font-size="9" fill="#d6a040">● 位反转在加载时完成</text>
    <text x="590" y="205" font-size="9" fill="#d6a040">  s[rev(tid)] = in[tid]</text>
    <text x="590" y="230" font-size="9" fill="#b85450">● 每级后 __syncthreads</text>
    <text x="590" y="245" font-size="9" fill="#b85450">  保证蝶形读写可见</text>
    <text x="590" y="270" font-size="9" fill="#4a7a3a">● 同级蝶形不相交</text>
    <text x="590" y="285" font-size="9" fill="#4a7a3a">  无 race condition</text>
    <text x="590" y="310" font-size="9" fill="#666">● k = (tid/m2)*m</text>
    <text x="590" y="325" font-size="9" fill="#666">  j = tid % m2</text>
    <text x="590" y="340" font-size="9" fill="#666">  读写 k+j, k+j+m2</text>
    <text x="590" y="365" font-size="9" fill="#d6a040">● N/2 线程, 每线程</text>
    <text x="590" y="380" font-size="9" fill="#d6a040">  每级做 1 个蝶形</text>
    <text x="590" y="405" font-size="9" fill="#b85450">● 旋转因子 W = </text>
    <text x="590" y="420" font-size="9" fill="#b85450">  e^(-2πi·j/m) 现算</text>
    <text x="590" y="435" font-size="9" fill="#b85450">  (或查表预计算)</text>
  </g>
</svg>
