<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold"
        fill="#333" filter="url(#rough2)">Radix-2 Cooley-Tukey FFT 三阶段流程</text>

  <!-- ===== Step 1: Bit-reversal ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="70" width="180" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <text x="120" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">① 位反转排列</text>
    <text x="120" y="113" text-anchor="middle" font-size="10" fill="#446688">Bit-Reversal Permutation</text>
    <!-- before -->
    <text x="55" y="140" font-size="10" fill="#333">索引</text>
    <text x="120" y="140" font-size="10" fill="#333">→ 反转后</text>
    <text x="55" y="158" font-size="10" fill="#666">0 (000)</text>
    <text x="135" y="158" font-size="10" fill="#d6a040">0 (000)</text>
    <text x="55" y="174" font-size="10" fill="#666">1 (001)</text>
    <text x="135" y="174" font-size="10" fill="#d6a040">4 (100)</text>
    <text x="55" y="190" font-size="10" fill="#666">2 (010)</text>
    <text x="135" y="190" font-size="10" fill="#d6a040">2 (010)</text>
    <text x="55" y="206" font-size="10" fill="#666">3 (011)</text>
    <text x="135" y="206" font-size="10" fill="#d6a040">6 (110)</text>
    <text x="55" y="222" font-size="10" fill="#666">4 (100)</text>
    <text x="135" y="222" font-size="10" fill="#d6a040">1 (001)</text>
    <text x="55" y="238" font-size="10" fill="#666">...</text>
    <text x="135" y="238" font-size="10" fill="#d6a040">...</text>
    <text x="55" y="256" font-size="10" fill="#666">7 (111)</text>
    <text x="135" y="256" font-size="10" fill="#d6a040">7 (111)</text>
  </g>

  <!-- Arrow 1 -->
  <g filter="url(#rough2)">
    <line x1="215" y1="170" x2="250" y2="170" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Step 2: Butterfly stages ===== -->
  <g filter="url(#rough2)">
    <rect x="255" y="70" width="290" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="400" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">② 蝶形运算 (log₂N 级)</text>
    <text x="400" y="113" text-anchor="middle" font-size="10" fill="#d6a040">Butterfly Operations</text>

    <!-- Stage boxes -->
    <rect x="270" y="130" width="78" height="120" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="309" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">Stage 1</text>
    <text x="309" y="168" text-anchor="middle" font-size="9" fill="#333">m = 2</text>
    <text x="309" y="183" text-anchor="middle" font-size="9" fill="#333">m2 = 1</text>
    <text x="309" y="200" text-anchor="middle" font-size="9" fill="#b85450">W₂⁰</text>
    <text x="309" y="218" text-anchor="middle" font-size="9" fill="#666">N/2 蝶形</text>
    <text x="309" y="238" text-anchor="middle" font-size="9" fill="#666">相邻配对</text>

    <rect x="360" y="130" width="78" height="120" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="399" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">Stage 2</text>
    <text x="399" y="168" text-anchor="middle" font-size="9" fill="#333">m = 4</text>
    <text x="399" y="183" text-anchor="middle" font-size="9" fill="#333">m2 = 2</text>
    <text x="399" y="200" text-anchor="middle" font-size="9" fill="#b85450">W₄⁰ W₄¹</text>
    <text x="399" y="218" text-anchor="middle" font-size="9" fill="#666">N/2 蝶形</text>
    <text x="399" y="238" text-anchor="middle" font-size="9" fill="#666">间隔 2</text>

    <rect x="450" y="130" width="78" height="120" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="489" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">Stage 3</text>
    <text x="489" y="168" text-anchor="middle" font-size="9" fill="#333">m = 8</text>
    <text x="489" y="183" text-anchor="middle" font-size="9" fill="#333">m2 = 4</text>
    <text x="489" y="200" text-anchor="middle" font-size="9" fill="#b85450">W₈⁰..W₈³</text>
    <text x="489" y="218" text-anchor="middle" font-size="9" fill="#666">N/2 蝶形</text>
    <text x="489" y="238" text-anchor="middle" font-size="9" fill="#666">间隔 4</text>
  </g>

  <!-- Arrow 2 -->
  <g filter="url(#rough2)">
    <line x1="550" y1="170" x2="585" y2="170" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Step 3: Output ===== -->
  <g filter="url(#rough2)">
    <rect x="590" y="70" width="110" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="645" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">③ 输出</text>
    <text x="645" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a">X[k] 频谱</text>
    <text x="645" y="145" text-anchor="middle" font-size="10" fill="#333">自然顺序</text>
    <text x="645" y="165" text-anchor="middle" font-size="10" fill="#333">X[0]</text>
    <text x="645" y="180" text-anchor="middle" font-size="10" fill="#333">X[1]</text>
    <text x="645" y="195" text-anchor="middle" font-size="10" fill="#333">X[2]</text>
    <text x="645" y="210" text-anchor="middle" font-size="10" fill="#333">...</text>
    <text x="645" y="225" text-anchor="middle" font-size="10" fill="#333">X[N-1]</text>
    <text x="645" y="255" text-anchor="middle" font-size="9" fill="#4a7a3a">O(N log N)</text>
  </g>

  <!-- ===== Bottom: Kernel mapping ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="295" width="670" height="125" fill="#fafafa" stroke="#999" stroke-width="1" rx="6" stroke-dasharray="5,3"/>
    <text x="365" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">GPU Kernel 映射（shared memory 单 block 版, N ≤ 2048）</text>

    <rect x="50" y="330" width="195" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="147" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">位反转加载</text>
    <text x="60" y="368" font-size="9" fill="#333">thread tid → bit_reverse(tid)</text>
    <text x="60" y="383" font-size="9" fill="#333">s_data[rev] = input[tid]</text>
    <text x="60" y="398" font-size="9" fill="#d6a040">每线程加载 1-2 元素</text>

    <rect x="265" y="330" width="225" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="377" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">蝶形循环 (log₂N 级)</text>
    <text x="275" y="368" font-size="9" fill="#333">for s = 1..log₂N:</text>
    <text x="275" y="383" font-size="9" fill="#333">  k=(tid/m2)*m, j=tid%m2</text>
    <text x="275" y="398" font-size="9" fill="#b85450">  __syncthreads() 每级屏障</text>

    <rect x="510" y="330" width="175" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="597" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">写回 global</text>
    <text x="520" y="368" font-size="9" fill="#333">output[tid] = s_data[tid]</text>
    <text x="520" y="383" font-size="9" fill="#333">自然顺序输出</text>
    <text x="520" y="398" font-size="9" fill="#4a7a3a">无额外排列</text>
  </g>
</svg>
