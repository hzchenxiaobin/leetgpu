<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">RGB to Grayscale：逐像素加权求和</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888">gray = 0.299·R + 0.587·G + 0.114·B，3 通道 → 1 通道，memory-bound</text>

  <!-- ===== Left: interleaved RGB layout ===== -->
  <text x="160" y="76" font-size="12" fill="#446688" font-weight="bold">input[H×W×3]（交织存储）</text>
  <g font-size="9" fill="#333">
    <!-- RGB triplets as colored cells -->
    <!-- pixel 0: red -->
    <rect x="40" y="84" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="55" y="100" text-anchor="middle" font-size="8" fill="#446688">R₀</text>
    <rect x="72" y="84" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="87" y="100" text-anchor="middle" font-size="8" fill="#4a7a3a">G₀</text>
    <rect x="104" y="84" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="119" y="100" text-anchor="middle" font-size="8" fill="#b85450">B₀</text>

    <!-- pixel 1: green -->
    <rect x="140" y="84" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="155" y="100" text-anchor="middle" font-size="8" fill="#446688">R₁</text>
    <rect x="172" y="84" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="187" y="100" text-anchor="middle" font-size="8" fill="#4a7a3a">G₁</text>
    <rect x="204" y="84" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="219" y="100" text-anchor="middle" font-size="8" fill="#b85450">B₁</text>

    <!-- pixel 2: blue -->
    <rect x="240" y="84" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="255" y="100" text-anchor="middle" font-size="8" fill="#446688">R₂</text>
    <rect x="272" y="84" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="287" y="100" text-anchor="middle" font-size="8" fill="#4a7a3a">G₂</text>
    <rect x="304" y="84" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="319" y="100" text-anchor="middle" font-size="8" fill="#b85450">B₂</text>

    <text x="170" y="126" text-anchor="middle" font-size="8" fill="#888">每像素 3 个连续 float（R,G,B 交织）</text>

    <!-- bracket for pixel 0 -->
    <path d="M 40 112 L 40 118 L 134 118 L 134 112" stroke="#d6a040" stroke-width="1" fill="none" filter="url(#rough2)"/>
    <text x="87" y="132" text-anchor="middle" font-size="7" fill="#d6a040">pixel 0</text>
  </g>

  <!-- arrow -->
  <path d="M 170 140 L 170 160" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="155" font-size="8" fill="#666">0.299R+0.587G+0.114B</text>

  <!-- ===== Middle: grayscale output ===== -->
  <text x="160" y="180" font-size="12" fill="#4a7a3a" font-weight="bold">output[H×W]</text>
  <g font-size="9" fill="#333">
    <rect x="100" y="186" width="40" height="24" fill="#d0d0d0" stroke="#555" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="120" y="202" text-anchor="middle" font-size="8" fill="#555" font-weight="bold">gray₀</text>
    <rect x="144" y="186" width="40" height="24" fill="#c0c0c0" stroke="#555" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="164" y="202" text-anchor="middle" font-size="8" fill="#555" font-weight="bold">gray₁</text>
    <rect x="188" y="186" width="40" height="24" fill="#b0b0b0" stroke="#555" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="208" y="202" text-anchor="middle" font-size="8" fill="#555" font-weight="bold">gray₂</text>

    <text x="164" y="228" text-anchor="middle" font-size="8" fill="#888">每像素 1 个 float（灰度值）</text>
  </g>

  <!-- ===== Right: thread mapping ===== -->
  <text x="480" y="76" font-size="12" fill="#d6a040" font-weight="bold">Thread 映射</text>
  <g font-size="9" fill="#333">
    <rect x="380" y="84" width="220" height="120" fill="#f6f6f6" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="392" y="100" font-size="8" fill="#888">1 thread → 1 pixel</text>
    <text x="392" y="116" font-family="monospace" font-size="8" fill="#4a7a3a">tid → pixel_idx</text>
    <text x="392" y="132" font-family="monospace" font-size="8" fill="#446688">R = input[tid*3]</text>
    <text x="392" y="146" font-family="monospace" font-size="8" fill="#4a7a3a">G = input[tid*3+1]</text>
    <text x="392" y="160" font-family="monospace" font-size="8" fill="#b85450">B = input[tid*3+2]</text>
    <text x="392" y="176" font-family="monospace" font-size="8" fill="#d6a040">gray = .299R+.587G+.114B</text>
    <text x="392" y="190" font-family="monospace" font-size="8" fill="#555">output[tid] = gray</text>
  </g>

  <!-- ===== Bottom: worked example ===== -->
  <line x1="20" y1="252" x2="620" y2="252" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="268" width="580" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="288" font-size="11" fill="#446688" font-weight="bold">Worked Example（题目示例）：</text>
  <g font-size="9" fill="#555">
    <text x="60" y="306">pixel 0 (红): R=255, G=0, B=0 → gray = 0.299×255 + 0.587×0 + 0.114×0 = 76.245</text>
    <text x="60" y="320">pixel 1 (绿): R=0, G=255, B=0 → gray = 0 + 0.587×255 + 0 = 149.685</text>
    <text x="60" y="334">pixel 2 (蓝): R=0, G=0, B=255 → gray = 0 + 0 + 0.114×255 = 29.07</text>
  </g>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="356" width="580" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="376" font-size="11" fill="#d6a040" font-weight="bold">💡 关键洞察</text>
  <text x="60" y="394" font-size="10" fill="#555">RGB→Gray 是最简"多通道→单通道"elementwise kernel：每像素读 3 个 float、做 2 次乘加、写 1 个 float。</text>
  <text x="60" y="410" font-size="10" fill="#555">算术强度 = 5 FLOP / 16B ≈ 0.31 FLOP/B，纯 memory-bound。读 12B + 写 4B = 16B/像素。</text>
  <text x="60" y="426" font-size="10" fill="#555">优化方向：float3 向量化读取 R,G/B；grid-stride loop 覆盖任意尺寸；__ldg 走只读缓存。</text>
</svg>
